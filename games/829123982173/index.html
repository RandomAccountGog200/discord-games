<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>829123982173</title>
    <style>
        :root {
            --bg: #080c18;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            cursor: pointer;
            image-rendering: auto;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('game');
            const ctx = canvas.getContext('2d');

            const TARGET_NUMBER = '829123982173';
            const TARGET_DIGITS = TARGET_NUMBER.split('').map(Number);
            const TOTAL_DIGITS = TARGET_DIGITS.length;

            const VIRTUAL_WIDTH = 480;
            const VIRTUAL_HEIGHT = 800;

            const STATE = { MENU: 'menu', PLAYING: 'playing', PAUSED: 'paused', LEVEL_COMPLETE: 'levelComplete',
                GAME_OVER: 'gameOver', WIN: 'win' };

            const LEVELS = [
                { digits: [0, 1, 2], speed: 1.0, decoyCount: 2, name: 'WAVE 1' },
                { digits: [3, 4, 5], speed: 1.4, decoyCount: 3, name: 'WAVE 2' },
                { digits: [6, 7, 8], speed: 1.8, decoyCount: 4, name: 'WAVE 3' },
                { digits: [9, 10, 11], speed: 2.3, decoyCount: 5, name: 'FINAL WAVE' },
            ];

            class AudioSystem {
                constructor() {
                    this.ctx = null;
                    this.initialized = false;
                    this.musicNodes = [];
                    this.musicPlaying = false;
                    this.masterGain = null;
                }
                init() {
                    if (this.initialized) return;
                    try {
                        this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                        this.masterGain = this.ctx.createGain();
                        this.masterGain.gain.value = 0.35;
                        this.masterGain.connect(this.ctx.destination);
                        this.initialized = true;
                    } catch (e) {
                        console.warn('Audio not available');
                    }
                }
                resume() {
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                }
                playTone(freq, duration, type = 'sine', volume = 0.3, detune = 0) {
                    if (!this.initialized) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    if (detune) osc.detune.value = detune;
                    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start(this.ctx.currentTime);
                    osc.stop(this.ctx.currentTime + duration);
                }
                playCollect() {
                    this.playTone(880, 0.1, 'sine', 0.4);
                    setTimeout(() => this.playTone(1100, 0.12, 'sine', 0.35), 60);
                }
                playWrong() {
                    this.playTone(150, 0.25, 'sawtooth', 0.5);
                    this.playTone(100, 0.3, 'square', 0.3);
                }
                playLevelComplete() {
                    [523, 659, 784, 1047].forEach((f, i) => {
                        setTimeout(() => this.playTone(f, 0.2, 'triangle', 0.4), i * 100);
                    });
                }
                playGameOver() {
                    [400, 350, 300, 200].forEach((f, i) => {
                        setTimeout(() => this.playTone(f, 0.3, 'sawtooth', 0.35), i * 150);
                    });
                }
                playWin() {
                    [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => {
                        setTimeout(() => this.playTone(f, 0.25, 'triangle', 0.45), i * 80);
                    });
                }
                playClick() {
                    this.playTone(600, 0.05, 'square', 0.2);
                }
                playShield() {
                    this.playTone(1200, 0.15, 'sine', 0.3);
                    setTimeout(() => this.playTone(1600, 0.1, 'sine', 0.25), 80);
                }
                playSlowTime() {
                    this.playTone(300, 0.4, 'triangle', 0.3);
                }
                playExtraLife() {
                    [600, 800, 1000].forEach((f, i) => {
                        setTimeout(() => this.playTone(f, 0.15, 'sine', 0.4), i * 70);
                    });
                }
                startMusic() {
                    if (!this.initialized || this.musicPlaying) return;
                    this.musicPlaying = true;
                    const chords = [
                        [130.81, 164.81, 196.0],
                        [146.83, 174.61, 220.0],
                        [164.81, 207.65, 246.94],
                        [130.81, 164.81, 196.0],
                    ];
                    let chordIndex = 0;
                    const playChord = () => {
                        if (!this.musicPlaying) return;
                        const chord = chords[chordIndex % chords.length];
                        chord.forEach(freq => {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'triangle';
                            osc.frequency.value = freq;
                            gain.gain.setValueAtTime(0, this.ctx.currentTime);
                            gain.gain.linearRampToValueAtTime(0.06, this.ctx.currentTime + 0.5);
                            gain.gain.linearRampToValueAtTime(0.04, this.ctx.currentTime + 1.5);
                            gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 2.8);
                            osc.connect(gain);
                            gain.connect(this.masterGain);
                            osc.start(this.ctx.currentTime);
                            osc.stop(this.ctx.currentTime + 3.0);
                        });
                        chordIndex++;
                        this._musicTimer = setTimeout(playChord, 2800);
                    };
                    playChord();
                }
                stopMusic() {
                    this.musicPlaying = false;
                    if (this._musicTimer) clearTimeout(this._musicTimer);
                }
            }

            class Particle {
                constructor(x, y, vx, vy, color, life, size = 3) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.color = color;
                    this.life = life;
                    this.maxLife = life;
                    this.size = size;
                    this.alive = true;
                }
                update(dt) {
                    this.life -= dt;
                    if (this.life <= 0) { this.alive = false; return; }
                    this.vy += 200 * dt;
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;
                }
                draw(ctx) {
                    const alpha = Math.max(0, this.life / this.maxLife);
                    const s = this.size * (0.5 + 0.5 * alpha);
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = s * 2;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, s, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            class PowerUp {
                constructor(x, y, type) {
                    this.x = x;
                    this.y = y;
                    this.type = type;
                    this.speed = 120 + Math.random() * 60;
                    this.width = 28;
                    this.height = 28;
                    this.alive = true;
                    this.glowPhase = Math.random() * Math.PI * 2;
                }
                update(dt) {
                    this.y += this.speed * dt;
                    this.glowPhase += dt * 4;
                    if (this.y > VIRTUAL_HEIGHT + 40) this.alive = false;
                }
                draw(ctx) {
                    const glow = 0.5 + 0.5 * Math.sin(this.glowPhase);
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    const symbol = this.type === 'shield' ? '◆' : this.type === 'slowTime' ? '❄' : '♥';
                    const color = this.type === 'shield' ? '#4dc9f6' : this.type === 'slowTime' ? '#c084fc' :
                        '#f87171';
                    ctx.fillStyle = color;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 12 + glow * 10;
                    ctx.font = '22px serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(symbol, 0, 0);
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeText(symbol, 0, 0);
                    ctx.restore();
                }
                getBounds() {
                    return { x: this.x - 16, y: this.y - 16, w: 32, h: 32 };
                }
            }

            class FallingDigit {
                constructor(x, y, value, isTarget, speed) {
                    this.x = x;
                    this.y = y;
                    this.value = value;
                    this.isTarget = isTarget;
                    this.baseSpeed = speed;
                    this.speed = speed;
                    this.width = 44;
                    this.height = 44;
                    this.alive = true;
                    this.glowPhase = Math.random() * Math.PI * 2;
                    this.collected = false;
                    this.wobbleAmp = 0;
                    this.wobbleFreq = 0;
                    this.wobbleOffset = 0;
                    if (!isTarget && Math.random() < 0.35) {
                        this.wobbleAmp = 25 + Math.random() * 40;
                        this.wobbleFreq = 1.5 + Math.random() * 2.5;
                        this.wobbleOffset = Math.random() * Math.PI * 2;
                    }
                }
                update(dt, timeScale = 1) {
                    const ts = timeScale;
                    this.y += this.speed * ts * dt;
                    this.glowPhase += dt * 3;
                    if (this.wobbleAmp > 0) {
                        this.x += Math.sin(this.glowPhase * this.wobbleFreq + this.wobbleOffset) * this.wobbleAmp *
                            ts * dt;
                        this.x = Math.max(30, Math.min(VIRTUAL_WIDTH - 30, this.x));
                    }
                    if (this.y > VIRTUAL_HEIGHT + 50) this.alive = false;
                }
                draw(ctx) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    if (this.isTarget) {
                        const pulse = 0.7 + 0.3 * Math.sin(this.glowPhase);
                        const glowSize = 20 + pulse * 12;
                        const grad = ctx.createRadialGradient(0, 0, 5, 0, 0, glowSize);
                        grad.addColorStop(0, 'rgba(255,200,60,0.9)');
                        grad.addColorStop(0.4, 'rgba(255,160,20,0.5)');
                        grad.addColorStop(0.7, 'rgba(255,120,0,0.15)');
                        grad.addColorStop(1, 'rgba(255,80,0,0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(0, 0, glowSize, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#1a1a2e';
                        ctx.strokeStyle = '#ffc830';
                        ctx.lineWidth = 3;
                        ctx.shadowColor = '#ffb800';
                        ctx.shadowBlur = 18 + pulse * 10;
                        ctx.beginPath();
                        ctx.roundRect(-20, -20, 40, 40, 10);
                        ctx.fill();
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#fff8dc';
                        ctx.font = 'bold 24px "Courier New", monospace';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(this.value.toString(), 0, 1);
                    } else {
                        const colors = ['#ff6b6b', '#6bc5ff', '#a78bfa', '#5eef8b', '#ff9f43', '#ff6eb4',
                        '#54d2d2'];
                        const col = colors[this.value % colors.length];
                        ctx.fillStyle = '#1a1a2e';
                        ctx.strokeStyle = col;
                        ctx.lineWidth = 2;
                        ctx.shadowColor = col;
                        ctx.shadowBlur = 8;
                        ctx.beginPath();
                        ctx.roundRect(-18, -18, 36, 36, 8);
                        ctx.fill();
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = col;
                        ctx.font = 'bold 20px "Courier New", monospace';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(this.value.toString(), 0, 1);
                    }
                    ctx.restore();
                }
                getBounds() {
                    const s = this.isTarget ? 20 : 18;
                    return { x: this.x - s, y: this.y - s, w: s * 2, h: s * 2 };
                }
            }

            class Player {
                constructor() {
                    this.width = 70;
                    this.height = 22;
                    this.x = VIRTUAL_WIDTH / 2;
                    this.y = VIRTUAL_HEIGHT - 90;
                    this.targetX = this.x;
                    this.speed = 480;
                    this.invulnerable = 0;
                    this.shieldActive = false;
                    this.trailPositions = [];
                }
                update(dt) {
                    const dx = this.targetX - this.x;
                    const moveSpeed = this.speed * dt;
                    if (Math.abs(dx) < moveSpeed) {
                        this.x = this.targetX;
                    } else {
                        this.x += Math.sign(dx) * moveSpeed;
                    }
                    this.x = Math.max(this.width / 2, Math.min(VIRTUAL_WIDTH - this.width / 2, this.x));
                    if (this.invulnerable > 0) this.invulnerable -= dt;
                    this.trailPositions.push({ x: this.x, y: this.y, life: 0.25 });
                    for (let i = this.trailPositions.length - 1; i >= 0; i--) {
                        this.trailPositions[i].life -= dt;
                        if (this.trailPositions[i].life <= 0) this.trailPositions.splice(i, 1);
                    }
                }
                setTarget(x) { this.targetX = Math.max(this.width / 2, Math.min(VIRTUAL_WIDTH - this.width / 2, x)); }
                draw(ctx) {
                    for (const t of this.trailPositions) {
                        const alpha = t.life / 0.25;
                        ctx.save();
                        ctx.globalAlpha = alpha * 0.4;
                        ctx.fillStyle = '#4df0ff';
                        ctx.shadowColor = '#4df0ff';
                        ctx.shadowBlur = 6;
                        ctx.beginPath();
                        ctx.roundRect(t.x - this.width / 2, t.y - this.height / 2, this.width, this.height, 6);
                        ctx.fill();
                        ctx.restore();
                    }
                    ctx.save();
                    const invulnFlash = this.invulnerable > 0 && Math.floor(this.invulnerable * 20) % 2 === 0;
                    const alpha = invulnFlash ? 0.4 : 1;
                    ctx.globalAlpha = alpha;
                    const grad = ctx.createLinearGradient(this.x, this.y - this.height / 2, this.x, this.y + this
                        .height / 2);
                    grad.addColorStop(0, '#7ef9ff');
                    grad.addColorStop(0.5, '#00e5ff');
                    grad.addColorStop(1, '#009faf');
                    ctx.fillStyle = grad;
                    ctx.shadowColor = '#00e5ff';
                    ctx.shadowBlur = 16;
                    ctx.beginPath();
                    ctx.roundRect(this.x - this.width / 2, this.y - this.height / 2, this.width, this.height, 8);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    if (this.shieldActive) {
                        ctx.strokeStyle = '#4dc9f6';
                        ctx.lineWidth = 3;
                        ctx.shadowColor = '#4dc9f6';
                        ctx.shadowBlur = 14;
                        ctx.beginPath();
                        ctx.roundRect(this.x - this.width / 2 - 6, this.y - this.height / 2 - 6, this.width + 12, this
                            .height + 12, 12);
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                    }
                    const glowDot = ctx.createRadialGradient(this.x, this.y - 4, 2, this.x, this.y - 4, 18);
                    glowDot.addColorStop(0, 'rgba(255,255,255,0.9)');
                    glowDot.addColorStop(0.5, 'rgba(180,255,255,0.4)');
                    glowDot.addColorStop(1, 'rgba(0,200,255,0)');
                    ctx.fillStyle = glowDot;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y - 4, 18, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
                getBounds() {
                    const m = 4;
                    return { x: this.x - this.width / 2 + m, y: this.y - this.height / 2 + m, w: this.width - m * 2, h: this
                            .height - m * 2 };
                }
            }

            class Game {
                constructor() {
                    this.audio = new AudioSystem();
                    this.state = STATE.MENU;
                    this.player = new Player();
                    this.fallingDigits = [];
                    this.particles = [];
                    this.powerUps = [];
                    this.currentLevel = 0;
                    this.currentDigitIndex = 0;
                    this.lives = 5;
                    this.score = 0;
                    this.combo = 0;
                    this.comboTimer = 0;
                    this.maxCombo = 0;
                    this.timeScale = 1;
                    this.timeScaleTimer = 0;
                    this.activeTargetOnScreen = false;
                    this.spawnTimer = 0;
                    this.spawnDelay = 0.6;
                    this.levelTransitionTimer = 0;
                    this.screenShake = 0;
                    this.screenShakeX = 0;
                    this.screenShakeY = 0;
                    this.bestScore = 0;
                    this.flashAlpha = 0;
                    this.flashColor = '#ffffff';
                    this.stars = [];
                    this.totalElapsed = 0;
                    this.loadBestScore();
                    this.generateStars();
                    this._canvasScale = 1;
                    this._canvasOffsetX = 0;
                    this._canvasOffsetY = 0;
                }
                loadBestScore() {
                    try {
                        const saved = localStorage.getItem('numberGame_best');
                        if (saved !== null) this.bestScore = parseInt(saved, 10) || 0;
                    } catch (e) { this.bestScore = 0; }
                }
                saveBestScore() {
                    try {
                        if (this.score > this.bestScore) {
                            this.bestScore = this.score;
                            localStorage.setItem('numberGame_best', this.bestScore.toString());
                        }
                    } catch (e) {}
                }
                generateStars() {
                    this.stars = [];
                    for (let i = 0; i < 80; i++) {
                        this.stars.push({
                            x: Math.random() * VIRTUAL_WIDTH,
                            y: Math.random() * VIRTUAL_HEIGHT,
                            size: Math.random() * 2 + 0.5,
                            twinkle: Math.random() * Math.PI * 2,
                            speed: Math.random() * 0.4 + 0.1,
                        });
                    }
                }
                resizeCanvas() {
                    const windowW = window.innerWidth;
                    const windowH = window.innerHeight;
                    const aspect = VIRTUAL_WIDTH / VIRTUAL_HEIGHT;
                    let canvasW, canvasH;
                    if (windowW / windowH > aspect) {
                        canvasH = windowH;
                        canvasW = canvasH * aspect;
                    } else {
                        canvasW = windowW;
                        canvasH = canvasW / aspect;
                    }
                    canvas.style.width = canvasW + 'px';
                    canvas.style.height = canvasH + 'px';
                    canvas.width = VIRTUAL_WIDTH;
                    canvas.height = VIRTUAL_HEIGHT;
                    this._canvasScale = canvasW / VIRTUAL_WIDTH;
                    this._canvasOffsetX = (windowW - canvasW) / 2;
                    this._canvasOffsetY = (windowH - canvasH) / 2;
                }
                getCanvasPos(e) {
                    const rect = canvas.getBoundingClientRect();
                    const scaleX = VIRTUAL_WIDTH / rect.width;
                    const scaleY = VIRTUAL_HEIGHT / rect.height;
                    return {
                        x: (e.clientX - rect.left) * scaleX,
                        y: (e.clientY - rect.top) * scaleY,
                    };
                }
                startGame() {
                    this.audio.init();
                    this.audio.resume();
                    this.state = STATE.PLAYING;
                    this.currentLevel = 0;
                    this.currentDigitIndex = 0;
                    this.lives = 5;
                    this.score = 0;
                    this.combo = 0;
                    this.comboTimer = 0;
                    this.maxCombo = 0;
                    this.timeScale = 1;
                    this.timeScaleTimer = 0;
                    this.activeTargetOnScreen = false;
                    this.spawnTimer = 0.3;
                    this.spawnDelay = 0.6;
                    this.fallingDigits = [];
                    this.particles = [];
                    this.powerUps = [];
                    this.screenShake = 0;
                    this.flashAlpha = 0;
                    this.player = new Player();
                    this.player.x = VIRTUAL_WIDTH / 2;
                    this.player.targetX = VIRTUAL_WIDTH / 2;
                    this.totalElapsed = 0;
                    this.audio.startMusic();
                }
                spawnBatch() {
                    if (this.activeTargetOnScreen) return;
                    const level = LEVELS[this.currentLevel];
                    const targetDigitValue = TARGET_DIGITS[this.currentDigitIndex];
                    const tx = 60 + Math.random() * (VIRTUAL_WIDTH - 120);
                    const ty = -30 - Math.random() * 60;
                    const targetSpeed = (100 + level.speed * 90) * (1 + this.totalElapsed * 0.015);
                    const target = new FallingDigit(tx, ty, targetDigitValue, true, targetSpeed);
                    this.fallingDigits.push(target);
                    this.activeTargetOnScreen = true;
                    const usedXs = [tx];
                    const decoyCount = level.decoyCount + Math.floor(this.totalElapsed / 40);
                    const actualDecoys = Math.min(decoyCount, 10);
                    for (let i = 0; i < actualDecoys; i++) {
                        let dx;
                        let attempts = 0;
                        do {
                            dx = 40 + Math.random() * (VIRTUAL_WIDTH - 80);
                            attempts++;
                        } while (usedXs.some(ux => Math.abs(ux - dx) < 35) && attempts < 20);
                        usedXs.push(dx);
                        let decoyValue;
                        do {
                            decoyValue = Math.floor(Math.random() * 10);
                        } while (decoyValue === targetDigitValue && Math.random() < 0.7);
                        const dy = -30 - Math.random() * 100;
                        const decoySpeed = targetSpeed * (0.8 + Math.random() * 0.5);
                        const decoy = new FallingDigit(dx, dy, decoyValue, false, decoySpeed);
                        this.fallingDigits.push(decoy);
                    }
                    if (Math.random() < 0.18 && this.powerUps.length < 2) {
                        const types = ['shield', 'shield', 'slowTime', 'slowTime', 'extraLife'];
                        const pType = types[Math.floor(Math.random() * types.length)];
                        if (pType === 'extraLife' && this.lives >= 6) {} else {
                            const px = 50 + Math.random() * (VIRTUAL_WIDTH - 100);
                            const py = -50 - Math.random() * 80;
                            this.powerUps.push(new PowerUp(px, py, pType));
                        }
                    }
                }
                collectTarget(digit) {
                    digit.collected = true;
                    digit.alive = false;
                    this.activeTargetOnScreen = false;
                    this.combo++;
                    this.comboTimer = 1.8;
                    if (this.combo > this.maxCombo) this.maxCombo = this.combo;
                    const comboBonus = Math.min(this.combo - 1, 8) * 15;
                    this.score += 100 + comboBonus;
                    this.currentDigitIndex++;
                    this.flashAlpha = 0.7;
                    this.flashColor = '#fffde0';
                    this.spawnTimer = 0.35;
                    this.spawnDelay = Math.max(0.2, 0.6 - this.currentLevel * 0.1);
                    this.audio.playCollect();
                    for (let i = 0; i < 25; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = 100 + Math.random() * 300;
                        const p = new Particle(digit.x, digit.y, Math.cos(angle) * speed, Math.sin(angle) * speed,
                            '#ffc830', 0.6 + Math.random() * 0.6, 2 + Math.random() * 4);
                        this.particles.push(p);
                    }
                    for (let i = 0; i < 12; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = 40 + Math.random() * 120;
                        const p = new Particle(digit.x, digit.y, Math.cos(angle) * speed, Math.sin(angle) * speed,
                            '#ffffff', 0.3 + Math.random() * 0.4, 1 + Math.random() * 2);
                        this.particles.push(p);
                    }
                    this.screenShake = Math.max(this.screenShake, 0.15);
                    if (this.currentDigitIndex >= TOTAL_DIGITS) {
                        this.winGame();
                        return;
                    }
                    const completedLevels = LEVELS.filter(lvl => lvl.digits[lvl.digits.length - 1] < this
                        .currentDigitIndex).length;
                    if (completedLevels > this.currentLevel) {
                        this.currentLevel = completedLevels;
                        this.state = STATE.LEVEL_COMPLETE;
                        this.levelTransitionTimer = 1.8;
                        this.activeTargetOnScreen = false;
                        this.fallingDigits.forEach(d => { if (!d.isTarget) d.alive = false; });

                collectWrong(digit) {
                    if (this.player.invulnerable > 0 || this.player.shieldActive) {

                                    speed, '#4dc9f6', 0.5 + Math.random() * 0.5, 2 + Math.random() * 3);

                        digit.alive = false;

                            '#ff5555', 0.4 + Math.random() * 0.5, 2 + Math.random() * 4);

                missTarget() {

                    this.audio.playWrong();

                        const p = new Particle(VIRTUAL_WIDTH / 2, VIRTUAL_HEIGHT, (Math.random() - 0.5) * 200, -100 -
                            Math.random() * 300, '#ff6644', 0.5 + Math.random() * 0.5, 2 + Math.random() * 3);
                        this.particles.push(p);

                activatePowerUp(powerUp) {
                    powerUp.alive = false;
                    switch (powerUp.type) {

                            this.flashAlpha = 0.3;
                            this.flashColor = '#4dc9f6';
                            for (let i = 0; i < 15; i++) {

                                const speed = 60 + Math.random() * 180;
                                const p = new Particle(powerUp.x, powerUp.y, Math.cos(angle) * speed, Math.sin(angle) *
                                    speed, '#4dc9f6', 0.4 + Math.random() * 0.4, 2 + Math.random() * 3);
                                this.particles.push(p);
                            }
                            break;
                        case 'slowTime':
                            this.timeScale = 0.4;
                            this.timeScaleTimer = 5.0;

                            this.flashColor = '#c084fc';
                            for (let i = 0; i < 12; i++) {
                                const angle = Math.random() * Math.PI * 2;
                                const speed = 50 + Math.random() * 150;
                                const p = new Particle(powerUp.x, powerUp.y, Math.cos(angle) * speed, Math.sin(angle) *
                                    speed, '#c084fc', 0.5 + Math.random() * 0.5, 2 + Math.random() * 3);
                                this.particles.push(p);
                            }
                            break;
                        case 'extraLife':
                            this.lives = Math.min(7, this.lives + 1);

                            this.flashColor = '#f87171';

                                    speed, '#f87171', 0.5 + Math.random() * 0.6, 2 + Math.random() * 4);

                winGame() {

                        const p = new Particle(VIRTUAL_WIDTH / 2, VIRTUAL_HEIGHT / 2, Math.cos(angle) * speed, Math.sin(

                gameOver() {
                    this.state = STATE.GAME_OVER;

                    this.fallingDigits = [];
                    this.powerUps = [];

                checkCollisions() {
                    const playerBounds = this.player.getBounds();
                    for (const digit of this.fallingDigits) {
                        if (!digit.alive || digit.collected) continue;
                        const dBounds = digit.getBounds();
                        if (
                            playerBounds.x < dBounds.x + dBounds.w &&
                            playerBounds.x + playerBounds.w > dBounds.x &&
                            playerBounds.y < dBounds.y + dBounds.h &&
                            playerBounds.y + playerBounds.h > dBounds.y
                        ) {
                            if (digit.isTarget) {
                                this.collectTarget(digit);
                            } else {
                                this.collectWrong(digit);
                            }
                            break;
                        }
                    }
                    for (const pu of this.powerUps) {
                        if (!pu.alive) continue;
                        const pBounds = pu.getBounds();
                        if (
                            playerBounds.x < pBounds.x + pBounds.w &&
                            playerBounds.x + playerBounds.w > pBounds.x &&
                            playerBounds.y < pBounds.y + pBounds.h &&
                            playerBounds.y + playerBounds.h > pBounds.y
                        ) {
                            this.activatePowerUp(pu);
                        }

                update(dt) {
                    if (this.state === STATE.PAUSED) return;
                    if (this.state === STATE.LEVEL_COMPLETE) {
                        this.levelTransitionTimer -= dt;
                        this.player.update(dt);
                        for (const p of this.particles) p.update(dt);
                        this.particles = this.particles.filter(p => p.alive);
                        if (this.screenShake > 0) this.screenShake = Math.max(0, this.screenShake - dt * 2);
                        if (this.flashAlpha > 0) this.flashAlpha = Math.max(0, this.flashAlpha - dt * 2.5);
                        if (this.levelTransitionTimer <= 0) {
                            this.state = STATE.PLAYING;
                            this.spawnTimer = 0.4;
                            this.activeTargetOnScreen = false;
                            this.fallingDigits = [];
                        }
                        return;
                    }
                    if (this.state !== STATE.PLAYING) {
                        for (const p of this.particles) p.update(dt);
                        this.particles = this.particles.filter(p => p.alive);
                        if (this.screenShake > 0) this.screenShake = Math.max(0, this.screenShake - dt * 1.5);
                        if (this.flashAlpha > 0) this.flashAlpha = Math.max(0, this.flashAlpha - dt * 2);
                        return;
                    }
                    this.totalElapsed += dt;
                    const ts = this.timeScale;
                    if (this.timeScaleTimer > 0) {
                        this.timeScaleTimer -= dt;
                        if (this.timeScaleTimer <= 0) this.timeScale = 1;
                    }
                    if (this.comboTimer > 0) {
                        this.comboTimer -= dt;
                        if (this.comboTimer <= 0) this.combo = 0;
                    }
                    this.player.update(dt);
                    if (this.player.invulnerable > 0) this.player.invulnerable -= dt;
                    if (this.spawnTimer > 0) {
                        this.spawnTimer -= dt;
                    } else if (!this.activeTargetOnScreen && this.state === STATE.PLAYING) {
                        this.spawnBatch();
                        this.spawnTimer = this.spawnDelay;
                    }
                    for (const digit of this.fallingDigits) digit.update(dt, ts);
                    for (const pu of this.powerUps) pu.update(dt);
                    for (const p of this.particles) p.update(dt);
                    this.fallingDigits = this.fallingDigits.filter(d => {
                        if (!d.alive) return false;
                        if (d.y > VIRTUAL_HEIGHT + 40 && d.isTarget && !d.collected) {
                            this.missTarget();
                            return false;
                        }
                        if (d.y > VIRTUAL_HEIGHT + 60) return false;
                        return true;
                    });
                    this.powerUps = this.powerUps.filter(p => p.alive);
                    this.particles = this.particles.filter(p => p.alive);
                    this.checkCollisions();
                    if (this.screenShake > 0) {
                        this.screenShake = Math.max(0, this.screenShake - dt * 3);
                        this.screenShakeX = (Math.random() - 0.5) * this.screenShake * 25;
                        this.screenShakeY = (Math.random() - 0.5) * this.screenShake * 25;
                    } else {
                        this.screenShakeX = 0;
                        this.screenShakeY = 0;
                    }
                    if (this.flashAlpha > 0) this.flashAlpha = Math.max(0, this.flashAlpha - dt * 3);
                    for (const star of this.stars) {
                        star.twinkle += star.speed * dt;
                    }
                }
                drawStars(ctx) {
                    for (const star of this.stars) {
                        const alpha = 0.3 + 0.35 * Math.sin(star.twinkle);
                        ctx.fillStyle = `rgba(200,220,255,${alpha})`;
                        ctx.beginPath();
                        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                drawUI(ctx) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 13px "Courier New", monospace';
                    ctx.textAlign = 'left';
                    ctx.fillText(`WAVE ${this.currentLevel+1}/4`, 15, 25);
                    ctx.textAlign = 'right';
                    const hearts = '♥'.repeat(this.lives);
                    ctx.fillStyle = '#f87171';
                    ctx.fillText(hearts, VIRTUAL_WIDTH - 15, 25);
                    if (this.player.shieldActive) {
                        ctx.fillStyle = '#4dc9f6';
                        ctx.textAlign = 'right';
                        ctx.fillText('◆ SHIELD', VIRTUAL_WIDTH - 15, 48);
                    }
                    if (this.timeScale < 0.9) {
                        ctx.fillStyle = '#c084fc';
                        ctx.textAlign = 'center';
                        ctx.fillText('⏳ SLOWED', VIRTUAL_WIDTH / 2, 48);
                    }
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.font = 'bold 15px "Courier New", monospace';
                    const progressText = TARGET_DIGITS.map((d, i) => {
                        if (i < this.currentDigitIndex) return d.toString();
                        if (i === this.currentDigitIndex && this.state === STATE.PLAYING) return `[${d}]`;
                        return '_';
                    }).join(' ');
                    ctx.fillText(progressText, VIRTUAL_WIDTH / 2, VIRTUAL_HEIGHT - 20);
                    if (this.combo > 1) {
                        const comboAlpha = Math.min(1, this.comboTimer / 0.5);

                        ctx.fillStyle = '#ffc830';

                        ctx.fillText(`COMBO x${this.combo}`, VIRTUAL_WIDTH / 2, VIRTUAL_HEIGHT - 50);

                drawScreenFlash(ctx) {
                    if (this.flashAlpha > 0) {

                        ctx.fillStyle = this.flashColor;
                        ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
                        ctx.restore();
                    }
                }
                drawMenu(ctx) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 36px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('NUMBER', VIRTUAL_WIDTH / 2, 220);

                    ctx.shadowBlur = 0;
                    ctx.restore();
                    ctx.fillStyle = '#888888';
                    ctx.font = '13px "Courier New", monospace';

                    ctx.font = '14px "Courier New", monospace';

                drawWin(ctx) {

                    ctx.fillStyle = '#000510';

                    ctx.font = 'bold 30px "Courier New", monospace';

                    ctx.font = 'bold 20px "Courier New", monospace';

                    ctx.font = '16px "Courier New", monospace';

                    if (this.score >= this.bestScore) {

                handleInput(action) {

                                this.state = STATE.PLAYING;

                                this.audio.playClick();

                            } else if (this.state === STATE.PAUSED) {
                                this.audio.playClick();
                                this.state = STATE.PLAYING;

                        case 'moveRight':
                            if (this.state === STATE.PLAYING) {

                            if (this.state === STATE.PLAYING && arguments.length > 1) {
                                this.player.setTarget(arguments[1]);
                            }
                            break;
                    }
                }
            }

            const game = new Game();
            game.resizeCanvas();
            window.addEventListener('resize', () => game.resizeCanvas());

            const keys = {};
            window.addEventListener('keydown', (e) => {
                keys[e.key] = true;
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    game.handleInput('start');
                }
                if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
                    e.preventDefault();
                    game.handleInput('pause');
                }
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                    e.preventDefault();
                    game.handleInput('moveLeft');
                }
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                    e.preventDefault();
                    game.handleInput('moveRight');
                }
            });
            window.addEventListener('keyup', (e) => {
                keys[e.key] = false;
            });

            canvas.addEventListener('click', (e) => {
                const pos = game.getCanvasPos(e);
                if (game.state === STATE.MENU || game.state === STATE.GAME_OVER || game.state === STATE.WIN) {
                    game.handleInput('start');
                } else if (game.state === STATE.PAUSED) {
                    game.handleInput('start');
                }
                if (game.state === STATE.PLAYING) {
                    game.handleInput('moveTo', pos.x);

            });

                e.preventDefault();
                touchActive = true;
                const pos = game.getCanvasPos(e.touches[0]);
                if (game.state === STATE.MENU || game.state === STATE.GAME_OVER || game.state === STATE.WIN) {
                    game.handleInput('start');
                } else if (game.state === STATE.PAUSED) {
                    game.handleInput('start');
                }
                if (game.state === STATE.PLAYING) {
                    game.handleInput('moveTo', pos.x);
                }
            }, { passive: false });
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (touchActive && game.state === STATE.PLAYING) {
                    const pos = game.getCanvasPos(e.touches[0]);
                    game.handleInput('moveTo', pos.x);
                }
            }, { passive: false });
            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                touchActive = false;
            }, { passive: false });

            let lastTime = performance.now();
            function gameLoop(timestamp) {
                let dt = (timestamp - lastTime) / 1000;
                lastTime = timestamp;
                if (dt <= 0) dt = 0.016;
                if (dt > 0.2) dt = 0.2;
                if (game.state === STATE.PLAYING || game.state === STATE.LEVEL_COMPLETE || game.state === STATE
                    .GAME_OVER || game.state === STATE.WIN) {
                    game.update(dt);
                }
                if (game.state === STATE.MENU) {
                    game.update(dt);
                }
                game.draw(ctx);
                requestAnimationFrame(gameLoop);
            }
            game.audio.init();
            requestAnimationFrame(gameLoop);
        })();
    </script>
</body>
