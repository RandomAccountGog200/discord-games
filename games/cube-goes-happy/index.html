<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cube Goes Happy</title>
    <style>
        :root {
            --bg: #1a1a2e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        canvas {
            display: block;
            image-rendering: auto;
            border-radius: 12px;
            box-shadow: 0 0 60px rgba(255, 150, 50, 0.3), 0 0 120px rgba(255, 100, 30, 0.15);
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            const INTERNAL_W = 800;
            const INTERNAL_H = 500;
            canvas.width = INTERNAL_W;
            canvas.height = INTERNAL_H;

            function resizeCanvas() {
                const scaleX = window.innerWidth / INTERNAL_W;
                const scaleY = window.innerHeight / INTERNAL_H;
                const scale = Math.min(scaleX, scaleY, 1.6);
                canvas.style.width = (INTERNAL_W * scale) + 'px';
                canvas.style.height = (INTERNAL_H * scale) + 'px';
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // ────────────────────────────────────
            // AUDIO SYSTEM
            // ────────────────────────────────────
            class AudioManager {
                constructor() {
                    this.ctx = null;
                    this.musicGain = null;
                    this.sfxGain = null;
                    this.musicOscillators = [];
                    this.musicPlaying = false;
                    this.initialized = false;
                }

                init() {
                    if (this.initialized) return;
                    try {
                        this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                        this.masterGain = this.ctx.createGain();
                        this.masterGain.gain.value = 0.35;
                        this.masterGain.connect(this.ctx.destination);
                        this.sfxGain = this.ctx.createGain();
                        this.sfxGain.gain.value = 0.6;
                        this.sfxGain.connect(this.masterGain);
                        this.musicGain = this.ctx.createGain();
                        this.musicGain.gain.value = 0.25;
                        this.musicGain.connect(this.masterGain);
                        this.initialized = true;
                    } catch (e) {
                        console.warn('Web Audio not available');
                    }
                }

                playTone(freq, duration, type = 'square', gainVal = 0.3, dest = null) {
                    if (!this.ctx) return;
                    const destNode = dest || this.sfxGain;
                    const osc = this.ctx.createOscillator();
                    const env = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    env.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    env.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(env);
                    env.connect(destNode);
                    osc.start(this.ctx.currentTime);
                    osc.stop(this.ctx.currentTime + duration + 0.05);
                }

                playJump() {
                    this.playTone(400, 0.08, 'square', 0.2);
                    setTimeout(() => this.playTone(600, 0.1, 'square', 0.18), 40);
                }

                playCollect() {
                    this.playTone(880, 0.06, 'sine', 0.25);
                    setTimeout(() => this.playTone(1100, 0.08, 'sine', 0.22), 50);
                    setTimeout(() => this.playTone(1320, 0.1, 'sine', 0.2), 100);
                }

                playHurt() {
                    this.playTone(120, 0.2, 'sawtooth', 0.35);
                    this.playTone(80, 0.25, 'sawtooth', 0.3);
                }

                playEnemyDefeat() {
                    this.playTone(200, 0.05, 'square', 0.25);
                    setTimeout(() => this.playTone(600, 0.07, 'square', 0.2), 40);
                }

                playLevelComplete() {
                    const notes = [523, 659, 784, 1047];
                    notes.forEach((f, i) => {
                        setTimeout(() => this.playTone(f, 0.2, 'sine', 0.3), i * 120);
                    });
                }

                playGameOver() {
                    const notes = [440, 370, 330, 220];
                    notes.forEach((f, i) => {
                        setTimeout(() => this.playTone(f, 0.3, 'triangle', 0.35), i * 200);
                    });
                }

                playUIClick() {
                    this.playTone(700, 0.04, 'square', 0.15);
                }

                startMusic() {
                    if (!this.ctx || this.musicPlaying) return;
                    this.musicPlaying = true;
                    this._musicLoop();
                }

                stopMusic() {
                    this.musicPlaying = false;
                    this.musicOscillators.forEach(o => {
                        try { o.stop(); } catch (e) {}
                    });
                    this.musicOscillators = [];
                }

                _musicLoop() {
                    if (!this.musicPlaying || !this.ctx) return;
                    const notes = [130, 165, 196, 220, 196, 165, 147, 130];
                    const beatDuration = 0.45;
                    const totalBeats = notes.length;

                    const playSequence = (startIdx) => {
                        if (!this.musicPlaying) return;
                        for (let i = 0; i < totalBeats; i++) {
                            const noteIdx = (startIdx + i) % totalBeats;
                            const freq = notes[noteIdx];
                            const time = this.ctx.currentTime + i * beatDuration;
                            const osc = this.ctx.createOscillator();
                            const env = this.ctx.createGain();
                            osc.type = 'triangle';
                            osc.frequency.setValueAtTime(freq, time);
                            env.gain.setValueAtTime(0.08, time);
                            env.gain.exponentialRampToValueAtTime(0.001, time + beatDuration * 0.7);
                            osc.connect(env);
                            env.connect(this.musicGain);
                            osc.start(time);
                            osc.stop(time + beatDuration * 0.75);
                            this.musicOscillators.push(osc);
                            if (this.musicOscillators.length > 40) {
                                const old = this.musicOscillators.shift();
                                try { old.stop(); } catch (e) {}
                            }
                        }
                        const nextStart = (startIdx + 2) % totalBeats;
                        this._musicTimeout = setTimeout(() => playSequence(nextStart), totalBeats * beatDuration *
                            1000);
                    };
                    playSequence(0);
                }
            }

            // ────────────────────────────────────
            // PARTICLE SYSTEM
            // ────────────────────────────────────
            class Particle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = 0;
                    this.y = 0;
                    this.vx = 0;
                    this.vy = 0;
                    this.life = 0;
                    this.maxLife = 0;
                    this.size = 4;
                    this.color = '#fff';
                    this.gravity = 0;
                    this.active = false;
                }
                init(x, y, vx, vy, life, size, color, gravity = 200) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.life = life;
                    this.maxLife = life;
                    this.size = size;
                    this.color = color;
                    this.gravity = gravity;
                    this.active = true;
                }
                update(dt) {
                    if (!this.active) return;
                    this.life -= dt;
                    this.vy += this.gravity * dt;
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;
                    if (this.life <= 0) this.active = false;
                }
                draw(ctx, camX, camY) {
                    if (!this.active) return;
                    const alpha = Math.max(0, this.life / this.maxLife);
                    const s = this.size * (0.5 + 0.5 * alpha);
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = s * 2;
                    ctx.beginPath();
                    ctx.arc(this.x - camX, this.y - camY, s, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            class ParticleSystem {
                constructor(maxParticles = 200) {
                    this.particles = [];
                    for (let i = 0; i < maxParticles; i++) {
                        this.particles.push(new Particle());
                    }
                }
                emit(x, y, count, spread, life, size, color, gravity = 200) {
                    let emitted = 0;
                    for (const p of this.particles) {
                        if (!p.active) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = (Math.random() * 0.6 + 0.4) * spread;
                            p.init(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed - Math.random() * 150,
                                life * (0.6 + Math.random() * 0.8), size * (0.5 + Math.random()),
                                color, gravity);
                            emitted++;
                            if (emitted >= count) break;
                        }
                    }
                }
                update(dt) {
                    for (const p of this.particles) p.update(dt);
                }
                draw(ctx, camX, camY) {
                    for (const p of this.particles) p.draw(ctx, camX, camY);
                }
            }

            // ────────────────────────────────────
            // PLAYER
            // ────────────────────────────────────
            class Player {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.width = 30;
                    this.height = 30;
                    this.vx = 0;
                    this.vy = 0;
                    this.speed = 280;
                    this.jumpForce = -520;
                    this.gravity = 1300;
                    this.friction = 0.82;
                    this.onGround = false;
                    this.doubleJumpAvailable = false;
                    this.hasDoubleJumped = false;
                    this.coyoteTimer = 0;
                    this.coyoteTime = 0.08;
                    this.jumpBufferTimer = 0;
                    this.jumpBufferTime = 0.1;
                    this.squash = 1;
                    this.stretch = 1;
                    this.facingRight = true;
                    this.invincibleTimer = 0;
                    this.happiness = 50;
                    this.maxHappiness = 100;
                    this.alive = true;
                    this.walkCycle = 0;
                }

                update(dt, platforms, enemies, collectibles, particles, audio, camera) {
                    if (!this.alive) return;
                    if (this.invincibleTimer > 0) this.invincibleTimer -= dt;

                    // Coyote time
                    if (this.onGround) {
                        this.coyoteTimer = this.coyoteTime;
                        this.doubleJumpAvailable = true;
                        this.hasDoubleJumped = false;
                    } else {
                        this.coyoteTimer -= dt;
                    }

                    // Jump buffer
                    if (this.jumpBufferTimer > 0) {
                        this.jumpBufferTimer -= dt;
                        if (this.coyoteTimer > 0 && this.jumpBufferTimer > 0) {
                            this._doJump(audio);
                            this.jumpBufferTimer = 0;
                            this.coyoteTimer = 0;
                        }
                    }

                    // Gravity
                    this.vy += this.gravity * dt;
                    if (this.vy > 900) this.vy = 900;

                    // Move
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;

                    // Platform collision
                    this.onGround = false;
                    for (const plat of platforms) {
                        const overlapX = this._overlapX(plat);
                        const overlapY = this._overlapY(plat);
                        if (overlapX > 0 && overlapY > 0) {
                            if (overlapX < overlapY) {
                                if (this.x + this.width / 2 < plat.x + plat.w / 2) {
                                    this.x = plat.x - this.width;
                                } else {
                                    this.x = plat.x + plat.w;
                                }
                                this.vx = 0;
                            } else {
                                if (this.vy > 0 && this.y + this.height - plat.y < overlapY + 4) {
                                    this.y = plat.y - this.height;
                                    this.vy = 0;
                                    this.onGround = true;
                                } else if (this.vy < 0 && plat.y + plat.h - this.y < overlapY + 4) {
                                    this.y = plat.y + plat.h;
                                    this.vy = 0;
                                }
                            }
                        }
                    }

                    // Moving platform support
                    for (const plat of platforms) {
                        if (plat.vx !== undefined && plat.vx !== 0) {
                            if (this.onGround && this.y + this.height >= plat.y - 2 && this.y + this.height <= plat.y +
                                6 &&
                                this.x + this.width > plat.x && this.x < plat.x + plat.w) {
                                this.x += plat.vx * dt;
                                this.y = plat.y - this.height;
                            }
                        }
                        if (plat.vy !== undefined && plat.vy !== 0) {
                            if (this.onGround && this.y + this.height >= plat.y - 2 && this.y + this.height <= plat.y +
                                6 &&
                                this.x + this.width > plat.x && this.x < plat.x + plat.w) {
                                this.y += plat.vy * dt;
                            }
                        }
                    }

                    // Friction
                    if (this.onGround) {
                        this.vx *= this.friction;
                        if (Math.abs(this.vx) < 10) this.vx = 0;
                    } else {
                        this.vx *= 0.95;
                    }

                    // Squash and stretch
                    if (!this.onGround && this.vy < -200) {
                        this.stretch = Math.min(1.35, this.stretch + dt * 8);
                        this.squash = Math.max(0.7, this.squash - dt * 8);
                    } else if (this.onGround && this.vy >= 0 && this.squash < 1) {
                        this.squash = Math.min(1, this.squash + dt * 12);
                        this.stretch = Math.max(1, this.stretch - dt * 12);
                        if (this.squash > 0.95 && this.squash < 1.05) {
                            this.squash = 1;
                            this.stretch = 1;
                        }
                    } else if (this.onGround) {
                        this.squash = Math.max(1, this.squash - dt * 6);
                        this.stretch = Math.min(1, this.stretch + dt * 6);
                    }

                    // Walk cycle
                    if (Math.abs(this.vx) > 20 && this.onGround) {
                        this.walkCycle += dt * 12;
                    } else if (this.onGround) {
                        this.walkCycle *= 0.85;
                    }

                    // Enemy collision
                    for (const enemy of enemies) {
                        if (!enemy.alive) continue;
                        if (this._collidesWith(enemy)) {
                            const playerBottom = this.y + this.height;
                            const enemyTop = enemy.y;
                            const playerFalling = this.vy > 50;
                            const fromAbove = playerBottom - enemyTop < 18 && playerFalling;

                            if (fromAbove && enemy.stompable !== false) {
                                enemy.alive = false;
                                this.vy = -350;
                                this.onGround = false;
                                this.coyoteTimer = 0;
                                audio.playEnemyDefeat();
                                particles.emit(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, 20, 250,
                                    0.5, 5, '#ff6b9d', 300);
                                camera.shake(6, 0.2);
                            } else if (this.invincibleTimer <= 0) {
                                this.happiness = Math.max(0, this.happiness - 15);
                                this.invincibleTimer = 1.2;
                                audio.playHurt();
                                particles.emit(this.x + this.width / 2, this.y + this.height / 2, 15, 180,
                                    0.6, 6, '#ff4444', 250);
                                camera.shake(12, 0.35);
                                const knockX = (this.x + this.width / 2) - (enemy.x + enemy.width / 2) > 0 ? 1 : -1;
                                this.vx = knockX * 250;
                                this.vy = -250;
                                this.onGround = false;
                                this.coyoteTimer = 0;
                            }
                        }
                    }

                    // Collectible collision
                    for (const col of collectibles) {
                        if (!col.collected && this._collidesWith(col)) {
                            col.collected = true;
                            this.happiness = Math.min(this.maxHappiness, this.happiness + 10);
                            audio.playCollect();
                            particles.emit(col.x + col.width / 2, col.y + col.height / 2, 18, 200, 0.7, 4.5,
                                '#ffd700', 150);
                            camera.shake(3, 0.15);
                        }
                    }

                    // Fell off world
                    if (this.y > 650) {
                        this.happiness = Math.max(0, this.happiness - 20);
                        this.invincibleTimer = 0.8;
                        audio.playHurt();
                        particles.emit(this.x, 600, 25, 200, 0.8, 7, '#ff6600', 200);
                        camera.shake(15, 0.4);
                        return 'respawn';
                    }

                    if (this.happiness <= 0) {
                        this.alive = false;
                        return 'dead';
                    }
                    return null;
                }

                _doJump(audio) {
                    this.vy = this.jumpForce;
                    this.onGround = false;
                    this.coyoteTimer = 0;
                    this.squash = 0.65;
                    this.stretch = 1.4;
                    audio.playJump();
                }

                jump(audio) {
                    if (this.coyoteTimer > 0) {
                        this._doJump(audio);
                        this.coyoteTimer = 0;
                        this.jumpBufferTimer = 0;
                    } else if (this.doubleJumpAvailable && !this.hasDoubleJumped) {
                        this.vy = this.jumpForce * 0.85;
                        this.hasDoubleJumped = true;
                        this.doubleJumpAvailable = false;
                        this.onGround = false;
                        this.squash = 0.7;
                        this.stretch = 1.35;
                        audio.playJump();
                    } else {
                        this.jumpBufferTimer = this.jumpBufferTime;
                    }
                }

                _overlapX(rect) {
                    return Math.min(this.x + this.width, rect.x + rect.w) - Math.max(this.x, rect.x);
                }
                _overlapY(rect) {
                    return Math.min(this.y + this.height, rect.y + rect.h) - Math.max(this.y, rect.y);
                }
                _collidesWith(entity) {
                    return (
                        this.x < entity.x + entity.width &&
                        this.x + this.width > entity.x &&
                        this.y < entity.y + entity.height &&
                        this.y + this.height > entity.y
                    );
                }

                draw(ctx, camX, camY) {
                    if (!this.alive) return;
                    if (this.invincibleTimer > 0 && Math.floor(this.invincibleTimer * 20) % 2 === 0) return;

                    const cx = this.x + this.width / 2 - camX;
                    const cy = this.y + this.height / 2 - camY;
                    const sw = this.width * this.squash;
                    const sh = this.height * this.stretch;
                    const sx = cx - sw / 2;
                    const sy = cy - sh / 2;

                    ctx.save();
                    ctx.translate(cx, cy);
                    // Glow
                    ctx.shadowColor = 'rgba(255,150,60,0.6)';
                    ctx.shadowBlur = 18;

                    // Body gradient
                    const grad = ctx.createLinearGradient(-sw / 2, -sh / 2, sw / 2, sh / 2);
                    grad.addColorStop(0, '#ff9a56');
                    grad.addColorStop(0.5, '#ff7b3d');
                    grad.addColorStop(1, '#e85d2c');
                    ctx.fillStyle = grad;
                    const radius = Math.min(sw, sh) * 0.22;
                    ctx.beginPath();
                    ctx.roundRect(-sw / 2, -sh / 2, sw, sh, radius);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Outline
                    ctx.strokeStyle = '#c44a1f';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();

                    // Face
                    const happyRatio = this.happiness / this.maxHappiness;
                    const eyeY = -sh * 0.22;
                    const eyeSpacing = sw * 0.2;
                    const eyeR = 3.5 + happyRatio * 1.5;

                    // Eyes
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(-eyeSpacing, eyeY, eyeR + 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(eyeSpacing, eyeY, eyeR + 0.5, 0, Math.PI * 2);
                    ctx.fill();

                    // Pupils
                    ctx.fillStyle = '#1a1a1a';
                    const pupilOffX = this.vx * 0.003;
                    const pupilOffY = Math.min(1.5, Math.max(-1.5, this.vy * 0.004));
                    ctx.beginPath();
                    ctx.arc(-eyeSpacing + pupilOffX, eyeY + pupilOffY, eyeR * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(eyeSpacing + pupilOffX, eyeY + pupilOffY, eyeR * 0.6, 0, Math.PI * 2);
                    ctx.fill();

                    // Mouth
                    const mouthY = sh * 0.15;
                    const mouthWidth = sw * 0.32;
                    const mouthCurve = (happyRatio - 0.5) * sh * 0.35;
                    ctx.strokeStyle = '#3d1000';
                    ctx.lineWidth = 2.5;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(-mouthWidth, mouthY);
                    ctx.quadraticCurveTo(0, mouthY + mouthCurve, mouthWidth, mouthY);
                    ctx.stroke();

                    // Blush on cheeks when happy
                    if (happyRatio > 0.6) {
                        const blushAlpha = (happyRatio - 0.6) / 0.4;
                        ctx.fillStyle = `rgba(255,150,150,${blushAlpha * 0.5})`;
                        ctx.beginPath();
                        ctx.arc(-eyeSpacing - 6, eyeY + 5, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(eyeSpacing + 6, eyeY + 5, 5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }

            // ────────────────────────────────────
            // ENEMY
            // ────────────────────────────────────
            class Enemy {
                constructor(x, y, width, height, patrolRange, speed, stompable = true, color = '#e74c5e') {
                    this.x = x;
                    this.y = y;
                    this.width = width;
                    this.height = height;
                    this.startX = x;
                    this.patrolRange = patrolRange;
                    this.speed = speed;
                    this.vx = speed;
                    this.vy = 0;
                    this.gravity = 1200;
                    this.alive = true;
                    this.stompable = stompable;
                    this.color = color;
                    this.walkCycle = 0;
                }

                update(dt, platforms) {
                    if (!this.alive) return;
                    this.vy += this.gravity * dt;
                    if (this.vy > 800) this.vy = 800;
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;

                    let onPlatform = false;
                    for (const plat of platforms) {
                        const overlapX = Math.min(this.x + this.width, plat.x + plat.w) - Math.max(this.x, plat.x);
                        const overlapY = Math.min(this.y + this.height, plat.y + plat.h) - Math.max(this.y, plat.y);
                        if (overlapX > 0 && overlapY > 0) {
                            if (overlapX < overlapY) {
                                if (this.x + this.width / 2 < plat.x + plat.w / 2) this.x = plat.x - this.width;
                                else this.x = plat.x + plat.w;
                                this.vx *= -1;
                            } else if (this.vy > 0) {
                                this.y = plat.y - this.height;
                                this.vy = 0;
                                onPlatform = true;
                            }
                        }
                    }

                    if (onPlatform) {
                        if (this.x <= this.startX - this.patrolRange) this.vx = Math.abs(this.speed);
                        if (this.x >= this.startX + this.patrolRange) this.vx = -Math.abs(this.speed);
                    }

                    if (this.y > 700) this.alive = false;
                    if (Math.abs(this.vx) > 10) this.walkCycle += dt * 10;
                }

                draw(ctx, camX, camY) {
                    if (!this.alive) return;
                    const cx = this.x + this.width / 2 - camX;
                    const cy = this.y + this.height / 2 - camY;
                    const w = this.width;
                    const h = this.height;

                    ctx.save();
                    ctx.translate(cx, cy);
                    const bob = Math.sin(this.walkCycle) * 2;
                    ctx.translate(0, bob);

                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 10;
                    const grad = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
                    grad.addColorStop(0, this.color);
                    grad.addColorStop(1, this._darken(this.color, 0.4));
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    if (this.stompable) {
                        ctx.roundRect(-w / 2, -h / 2, w, h, w * 0.25);
                    } else {
                        // Spiky shape
                        const spikes = 6;
                        const cx2 = 0;
                        const cy2 = 0;
                        const rOuter = Math.max(w, h) / 2;
                        const rInner = rOuter * 0.55;
                        for (let i = 0; i < spikes * 2; i++) {
                            const angle = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
                            const r = i % 2 === 0 ? rOuter : rInner;
                            const sx = cx2 + Math.cos(angle) * r;
                            const sy = cy2 + Math.sin(angle) * r;
                            if (i === 0) ctx.moveTo(sx, sy);
                            else ctx.lineTo(sx, sy);
                        }
                        ctx.closePath();
                    }
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = this._darken(this.color, 0.5);
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Angry eyes
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(-w * 0.18, -h * 0.15, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(w * 0.18, -h * 0.15, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(-w * 0.18, -h * 0.13, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(w * 0.18, -h * 0.13, 2, 0, Math.PI * 2);
                    ctx.fill();
                    // Angry eyebrows
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-w * 0.28, -h * 0.28);
                    ctx.lineTo(-w * 0.08, -h * 0.2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(w * 0.28, -h * 0.28);
                    ctx.lineTo(w * 0.08, -h * 0.2);
                    ctx.stroke();

                    ctx.restore();
                }

                _darken(hex, factor) {
                    const r = parseInt(hex.slice(1, 3), 16);
                    const g = parseInt(hex.slice(3, 5), 16);
                    const b = parseInt(hex.slice(5, 7), 16);
                    const dr = Math.floor(r * (1 - factor));
                    const dg = Math.floor(g * (1 - factor));
                    const db = Math.floor(b * (1 - factor));
                    return '#' + [dr, dg, db].map(c => c.toString(16).padStart(2, '0')).join('');
                }
            }

            // ────────────────────────────────────
            // COLLECTIBLE
            // ────────────────────────────────────
            class Collectible {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.width = 18;
                    this.height = 18;
                    this.collected = false;
                    this.bobOffset = Math.random() * Math.PI * 2;
                    this.time = this.bobOffset;
                }
                update(dt) {
                    if (!this.collected) this.time += dt;
                }
                draw(ctx, camX, camY) {
                    if (this.collected) return;
                    const cx = this.x + this.width / 2 - camX;
                    const cy = this.y + this.height / 2 - camY + Math.sin(this.time * 3) * 4;
                    ctx.save();
                    ctx.translate(cx, cy);
                    const pulse = 1 + Math.sin(this.time * 4) * 0.15;
                    ctx.scale(pulse, pulse);
                    ctx.shadowColor = '#ffd700';
                    ctx.shadowBlur = 16;
                    const grad = ctx.createRadialGradient(0, -2, 1, 0, 0, this.width / 2);
                    grad.addColorStop(0, '#fffde0');
                    grad.addColorStop(0.4, '#ffd700');
                    grad.addColorStop(1, '#e6a800');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.width / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.beginPath();
                    ctx.arc(-3, -4, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // ────────────────────────────────────
            // CAMERA
            // ────────────────────────────────────
            class Camera {
                constructor() {
                    this.x = 0;
                    this.y = 0;
                    this.targetX = 0;
                    this.targetY = 0;
                    this.shakeX = 0;
                    this.shakeY = 0;
                    this.shakeIntensity = 0;
                    this.shakeDuration = 0;
                    this.shakeTimer = 0;
                }
                update(dt, player, levelWidth, levelHeight) {
                    this.targetX = player.x + player.width / 2 - INTERNAL_W / 2;
                    this.targetY = player.y + player.height / 2 - INTERNAL_H / 2;
                    this.targetX = Math.max(0, Math.min(this.targetX, levelWidth - INTERNAL_W));
                    this.targetY = Math.max(0, Math.min(this.targetY, levelHeight - INTERNAL_H));
                    this.x += (this.targetX - this.x) * 8 * dt;
                    this.y += (this.targetY - this.y) * 6 * dt;
                    if (this.shakeTimer > 0) {
                        this.shakeTimer -= dt;
                        const decay = this.shakeTimer / this.shakeDuration;
                        this.shakeX = (Math.random() - 0.5) * this.shakeIntensity * decay;
                        this.shakeY = (Math.random() - 0.5) * this.shakeIntensity * decay;
                    } else {
                        this.shakeX = 0;
                        this.shakeY = 0;
                    }
                }
                shake(intensity, duration) {
                    this.shakeIntensity = intensity;
                    this.shakeDuration = duration;
                    this.shakeTimer = duration;
                }
                getX() { return this.x + this.shakeX; }
                getY() { return this.y + this.shakeY; }
            }

            // ────────────────────────────────────
            // GAME CLASS
            // ────────────────────────────────────
            class Game {
                constructor() {
                    this.audio = new AudioManager();
                    this.particles = new ParticleSystem(250);
                    this.camera = new Camera();
                    this.state = 'menu'; // menu, playing, paused, levelComplete, gameOver, victory
                    this.levels = createLevels();
                    this.currentLevelIndex = 0;
                    this.player = null;
                    this.enemies = [];
                    this.collectibles = [];
                    this.platforms = [];
                    this.levelData = null;
                    this.totalHappiness = 0;
                    this.highScore = 0;
                    this.transitionTimer = 0;
                    this.stateTimer = 0;
                    this.exitReached = false;
                    this.keys = {};
                    this.touchLeft = false;
                    this.touchRight = false;
                    this.touchJump = false;
                    this.touchActive = false;
                    this.pauseCooldown = 0;

                    this._loadHighScore();
                    this._setupInput();
                    this._setupTouchControls();
                }

                _loadHighScore() {
                    try {
                        this.highScore = parseInt(localStorage.getItem('cubeGoesHappy_highScore')) || 0;
                    } catch (e) {
                        this.highScore = 0;
                    }
                }

                _saveHighScore() {
                    try {
                        localStorage.setItem('cubeGoesHappy_highScore', this.highScore.toString());
                    } catch (e) {}
                }

                _setupInput() {
                    window.addEventListener('keydown', (e) => {
                        this.keys[e.key] = true;
                        this.keys[e.code] = true;
                        if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
                            if (this.pauseCooldown <= 0) {
                                if (this.state === 'playing') {
                                    this.state = 'paused';
                                    this.audio.playUIClick();
                                } else if (this.state === 'paused') {
                                    this.state = 'playing';
                                    this.audio.playUIClick();
                                }
                                this.pauseCooldown = 0.3;
                            }
                        }
                        if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                            e.preventDefault();
                        }
                    });
                    window.addEventListener('keyup', (e) => {
                        this.keys[e.key] = false;
                        this.keys[e.code] = false;
                    });
                }

                _setupTouchControls() {
                    canvas.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        this.touchActive = true;
                        this._handleTouches(e.touches);
                        if (this.state === 'menu') {
                            this._startGame();
                        } else if (this.state === 'gameOver' || this.state === 'victory') {
                            if (this.stateTimer > 0.6) this._goToMenu();
                        } else if (this.state === 'levelComplete') {
                            if (this.transitionTimer > 0.8) this._nextLevel();
                        }
                    }, { passive: false });
                    canvas.addEventListener('touchmove', (e) => {
                        e.preventDefault();
                        this._handleTouches(e.touches);
                    }, { passive: false });
                    canvas.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        if (e.touches.length === 0) {
                            this.touchLeft = false;
                            this.touchRight = false;
                            this.touchJump = false;
                            this.touchActive = false;
                        } else {
                            this._handleTouches(e.touches);
                        }
                    }, { passive: false });
                    canvas.addEventListener('touchcancel', () => {
                        this.touchLeft = false;
                        this.touchRight = false;
                        this.touchJump = false;
                        this.touchActive = false;
                    });
                    canvas.addEventListener('click', (e) => {
                        if (this.state === 'menu') {
                            this._startGame();
                        } else if (this.state === 'gameOver' || this.state === 'victory') {
                            if (this.stateTimer > 0.6) this._goToMenu();
                        } else if (this.state === 'levelComplete') {
                            if (this.transitionTimer > 0.8) this._nextLevel();
                        } else if (this.state === 'paused') {
                            const rect = canvas.getBoundingClientRect();
                            const scaleX = INTERNAL_W / rect.width;
                            const scaleY = INTERNAL_H / rect.height;
                            const cx = (e.clientX - rect.left) * scaleX;
                            const cy = (e.clientY - rect.top) * scaleY;
                            if (cx > INTERNAL_W / 2 - 80 && cx < INTERNAL_W / 2 + 80 && cy > INTERNAL_H / 2 + 20 && cy <
                                INTERNAL_H / 2 + 60) {
                                this.state = 'playing';
                                this.audio.playUIClick();
                            }
                        }
                    });
                }

                _handleTouches(touches) {
                    this.touchLeft = false;
                    this.touchRight = false;
                    this.touchJump = false;
                    const rect = canvas.getBoundingClientRect();
                    const scaleX = INTERNAL_W / rect.width;
                    const scaleY = INTERNAL_H / rect.height;
                    for (let i = 0; i < touches.length; i++) {
                        const tx = (touches[i].clientX - rect.left) * scaleX;
                        const ty = (touches[i].clientY - rect.top) * scaleY;
                        if (ty > INTERNAL_H - 110) {
                            if (tx < INTERNAL_W / 3) this.touchLeft = true;
                            else if (tx < INTERNAL_W * 0.66) this.touchJump = true;
                            else this.touchRight = true;
                        } else if (ty > INTERNAL_H - 160 && tx > INTERNAL_W * 0.5) {
                            this.touchJump = true;
                        } else if (tx < INTERNAL_W / 2 && ty < INTERNAL_H - 110) {
                            this.touchJump = true;
                        }
                    }
                }

                _startGame() {
                    this.audio.init();
                    this.audio.playUIClick();
                    this.audio.startMusic();
                    this.currentLevelIndex = 0;
                    this.totalHappiness = 50;
                    this._loadLevel(0);
                    this.state = 'playing';
                }

                _loadLevel(index) {
                    this.levelData = this.levels[index];
                    this.player = new Player(this.levelData.playerSpawn.x, this.levelData.playerSpawn.y);
                    this.player.happiness = (index === 0) ? 50 : this.totalHappiness;
                    this.player.alive = true;
                    this.platforms = [];
                    this.enemies = [];
                    this.collectibles = [];
                    this.exitReached = false;
                    this.camera.x = 0;
                    this.camera.y = 0;
                    this.camera.shakeTimer = 0;
                    this.camera.shakeX = 0;
                    this.camera.shakeY = 0;
                    this.transitionTimer = 0;

                    for (const p of this.levelData.platforms) {
                        const plat = {
                            x: p.x,
                            y: p.y,
                            w: p.w,
                            h: p.h,
                            vx: p.vx || 0,
                            vy: p.vy || 0,
                            movingRange: p.movingRange || 0,
                            movingAxis: p.movingAxis || 'x',
                            startX: p.startX || p.x,
                            startY: p.startY || p.y,
                        };
                        this.platforms.push(plat);
                    }

                    for (const e of this.levelData.enemies) {
                        const enemy = new Enemy(e.x, e.y, e.w, e.h, e.patrol, e.speed, e.stompable, e.color);
                        this.enemies.push(enemy);
                    }

                    for (const c of this.levelData.collectibles) {
                        const col = new Collectible(c.x, c.y);
                        this.collectibles.push(col);
                    }
                }

                _nextLevel() {
                    this.currentLevelIndex++;
                    this.totalHappiness = this.player.happiness;
                    if (this.currentLevelIndex >= this.levels.length) {
                        this.state = 'victory';
                        this.stateTimer = 0;
                        this.totalHappiness = this.player.happiness;
                        if (this.totalHappiness > this.highScore) {
                            this.highScore = this.totalHappiness;
                            this._saveHighScore();
                        }
                        this.audio.playLevelComplete();
                        return;
                    }
                    this._loadLevel(this.currentLevelIndex);
                    this.state = 'playing';
                    this.audio.playLevelComplete();
                }

                _goToMenu() {
                    this.state = 'menu';
                    this.audio.stopMusic();
                    this.audio.playUIClick();
                }

                update(dt) {
                    if (this.pauseCooldown > 0) this.pauseCooldown -= dt;
                    if (this.state === 'paused') return;
                    if (this.state === 'menu' || this.state === 'gameOver' || this.state === 'victory') {
                        this.stateTimer += dt;
                        return;
                    }
                    if (this.state === 'levelComplete') {
                        this.transitionTimer += dt;
                        if (this.transitionTimer > 1.8) this._nextLevel();
                        this.particles.update(dt);
                        return;
                    }

                    if (!this.player || !this.player.alive && this.state === 'playing') {
                        this.stateTimer += dt;
                        if (this.stateTimer > 1.5) {
                            this.state = 'gameOver';
                            this.stateTimer = 0;
                            if (this.totalHappiness > this.highScore) {
                                this.highScore = this.totalHappiness;
                                this._saveHighScore();
                            }
                            this.audio.playGameOver();
                            this.audio.stopMusic();
                        }
                        this.particles.update(dt);
                        return;
                    }

                    // Input
                    let moveX = 0;
                    if (this.keys['ArrowLeft'] || this.keys['KeyA'] || this.keys['a'] || this.touchLeft) moveX = -1;
                    if (this.keys['ArrowRight'] || this.keys['KeyD'] || this.keys['d'] || this.touchRight) moveX = 1;
                    const jumpPressed = this.keys[' '] || this.keys['Space'] || this.keys['ArrowUp'] || this.keys[
                        'KeyW'] || this.keys['w'] || this.touchJump;

                    if (moveX !== 0) {
                        this.player.vx += moveX * this.player.speed * 4 * dt;
                        this.player.vx = Math.max(-this.player.speed, Math.min(this.player.speed, this.player.vx));
                        this.player.facingRight = moveX > 0;
                    }
                    if (jumpPressed) {
                        this.player.jump(this.audio);
                    }

                    // Update moving platforms
                    for (const plat of this.platforms) {
                        if (plat.movingRange > 0 && plat.vx !== 0 && plat.movingAxis === 'x') {
                            plat.x += plat.vx * dt;
                            if (plat.x > plat.startX + plat.movingRange) plat.vx = -Math.abs(plat.vx);
                            if (plat.x < plat.startX - plat.movingRange) plat.vx = Math.abs(plat.vx);
                        }
                        if (plat.movingRange > 0 && plat.vy !== 0 && plat.movingAxis === 'y') {
                            plat.y += plat.vy * dt;
                            if (plat.y > plat.startY + plat.movingRange) plat.vy = -Math.abs(plat.vy);
                            if (plat.y < plat.startY - plat.movingRange) plat.vy = Math.abs(plat.vy);
                        }
                    }

                    // Update player
                    const playerResult = this.player.update(dt, this.platforms, this.enemies, this.collectibles, this
                        .particles, this.audio, this.camera);
                    if (playerResult === 'respawn') {
                        this.player.x = this.levelData.playerSpawn.x;
                        this.player.y = this.levelData.playerSpawn.y;
                        this.player.vx = 0;
                        this.player.vy = 0;
                        this.player.onGround = false;
                        this.player.coyoteTimer = 0;
                        this.player.doubleJumpAvailable = false;
                        this.player.hasDoubleJumped = false;
                    }
                    if (playerResult === 'dead') {
                        this.totalHappiness = Math.max(0, this.player.happiness);
                        this.stateTimer = 0;
                        this.audio.playGameOver();
                        this.audio.stopMusic();
                    }

                    // Update enemies
                    for (const enemy of this.enemies) enemy.update(dt, this.platforms);

                    // Update collectibles
                    for (const col of this.collectibles) col.update(dt);

                    // Update particles
                    this.particles.update(dt);

                    // Update camera
                    this.camera.update(dt, this.player, this.levelData.width, this.levelData.height);

                    // Check exit
                    const exit = this.levelData.exitPos;
                    const exitW = 44;
                    const exitH = 54;
                    if (
                        this.player.x + this.player.width > exit.x &&
                        this.player.x < exit.x + exitW &&
                        this.player.y + this.player.height > exit.y &&
                        this.player.y < exit.y + exitH &&
                        !this.exitReached
                    ) {
                        this.exitReached = true;
                        this.totalHappiness = this.player.happiness;
                        this.state = 'levelComplete';
                        this.transitionTimer = 0;
                        this.particles.emit(exit.x + exitW / 2, exit.y + exitH / 2, 40, 300, 1.2, 6, '#ffd700', 100);
                        this.particles.emit(exit.x + exitW / 2, exit.y + exitH / 2, 30, 200, 1.0, 8, '#ffffff', 80);
                        this.audio.playLevelComplete();
                    }
                }

                draw() {
                    ctx.clearRect(0, 0, INTERNAL_W, INTERNAL_H);

                    if (this.state === 'menu') {
                        this._drawMenu();
                        return;
                    }

                    const camX = this.camera.getX();
                    const camY = this.camera.getY();

                    // Background
                    this._drawBackground(camX, camY);

                    // Platforms
                    for (const plat of this.platforms) {
                        const px = plat.x - camX;
                        const py = plat.y - camY;
                        if (px + plat.w < -50 || px > INTERNAL_W + 50) continue;
                        if (py + plat.h < -50 || py > INTERNAL_H + 50) continue;
                        const grad = ctx.createLinearGradient(px, py, px, py + plat.h);
                        grad.addColorStop(0, '#8B7355');
                        grad.addColorStop(0.3, '#6d5840');
                        grad.addColorStop(1, '#4a3828');
                        ctx.fillStyle = grad;
                        ctx.fillRect(px, py, plat.w, plat.h);
                        ctx.strokeStyle = '#3d2e1f';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(px, py, plat.w, plat.h);
                        // Top highlight
                        ctx.fillStyle = 'rgba(255,255,255,0.12)';
                        ctx.fillRect(px + 4, py + 2, plat.w - 8, 6);
                        ctx.fillStyle = 'rgba(0,0,0,0.15)';
                        ctx.fillRect(px + 4, py + plat.h - 6, plat.w - 8, 4);
                    }

                    // Collectibles
                    for (const col of this.collectibles) col.draw(ctx, camX, camY);

                    // Enemies
                    for (const enemy of this.enemies) enemy.draw(ctx, camX, camY);

                    // Exit door
                    if (this.levelData && !this.exitReached) {
                        const exit = this.levelData.exitPos;
                        const ex = exit.x - camX;
                        const ey = exit.y - camY;
                        const ew = 44;
                        const eh = 54;
                        const pulse = 1 + Math.sin(this.stateTimer * 3) * 0.08;
                        ctx.save();
                        ctx.translate(ex + ew / 2, ey + eh / 2);
                        ctx.scale(pulse, pulse);
                        ctx.shadowColor = '#ffd700';
                        ctx.shadowBlur = 20;
                        const doorGrad = ctx.createLinearGradient(-ew / 2, -eh / 2, ew / 2, eh / 2);
                        doorGrad.addColorStop(0, '#ffe082');
                        doorGrad.addColorStop(0.5, '#ffb300');
                        doorGrad.addColorStop(1, '#e68900');
                        ctx.fillStyle = doorGrad;
                        ctx.beginPath();
                        ctx.roundRect(-ew / 2, -eh / 2, ew, eh, 8);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.strokeStyle = '#8b5e00';
                        ctx.lineWidth = 3;
                        ctx.stroke();
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 22px system-ui';
                        ctx.textAlign = 'center';
                        ctx.fillText('🚪', 0, 5);
                        ctx.restore();
                    }

                    // Player
                    if (this.player && this.player.alive) {
                        this.player.draw(ctx, camX, camY);
                    }

                    // Particles
                    this.particles.draw(ctx, camX, camY);

                    // HUD
                    this._drawHUD();

                    // Touch controls
                    if (this.state === 'playing') this._drawTouchControls();

                    // Paused overlay
                    if (this.state === 'paused') this._drawPauseOverlay();

                    // Level complete overlay
                    if (this.state === 'levelComplete') this._drawLevelCompleteOverlay();

                    // Game over overlay
                    if (this.state === 'gameOver') this._drawGameOverOverlay();

                    // Victory overlay
                    if (this.state === 'victory') this._drawVictoryOverlay();
                }

                _drawBackground(camX, camY) {
                    const ld = this.levelData;
                    if (!ld) {
                        ctx.fillStyle = '#1a1a2e';
                        ctx.fillRect(0, 0, INTERNAL_W, INTERNAL_H);
                        return;
                    }
                    const grad = ctx.createLinearGradient(0, 0, 0, INTERNAL_H);
                    grad.addColorStop(0, ld.bgTop);
                    grad.addColorStop(1, ld.bgBottom);
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, INTERNAL_W, INTERNAL_H);

                    // Parallax background elements
                    if (ld.bgElements === 'hills') {
                        ctx.fillStyle = 'rgba(100,180,80,0.25)';
                        for (let i = 0; i < 12; i++) {
                            const hx = (i * 250 - camX * 0.3) % (INTERNAL_W + 400) - 200;
                            const hy = INTERNAL_H - 80 + Math.sin(i * 1.7) * 60;
                            ctx.beginPath();
                            ctx.arc(hx, hy, 80 + Math.sin(i * 2.3) * 40, Math.PI, 0);
                            ctx.fill();
                        }
                    } else if (ld.bgElements === 'clouds') {
                        ctx.fillStyle = 'rgba(255,255,255,0.3)';
                        for (let i = 0; i < 10; i++) {
                            const cx = (i * 300 - camX * 0.2) % (INTERNAL_W + 500) - 250;
                            const cy = 60 + Math.sin(i * 1.1) * 50;
                            ctx.beginPath();
                            ctx.arc(cx, cy, 35, 0, Math.PI * 2);
                            ctx.arc(cx + 30, cy - 15, 28, 0, Math.PI * 2);
                            ctx.arc(cx + 55, cy, 32, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    } else if (ld.bgElements === 'cave') {
                        ctx.fillStyle = 'rgba(80,40,100,0.2)';
                        for (let i = 0; i < 8; i++) {
                            const sx = (i * 350 - camX * 0.15) % (INTERNAL_W + 600) - 300;
                            ctx.beginPath();
                            ctx.moveTo(sx, INTERNAL_H);
                            ctx.lineTo(sx + 30, INTERNAL_H - 120 - Math.random() * 80);
                            ctx.lineTo(sx - 20, INTERNAL_H - 180 - Math.random() * 60);
                            ctx.lineTo(sx + 10, INTERNAL_H);
                            ctx.fill();
                        }
                    } else if (ld.bgElements === 'sunset') {
                        ctx.fillStyle = 'rgba(255,200,100,0.2)';
                        ctx.beginPath();
                        ctx.arc(INTERNAL_W * 0.7 - camX * 0.1, 100, 80, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(255,180,120,0.15)';
                        ctx.beginPath();
                        ctx.arc(INTERNAL_W * 0.7 - camX * 0.1, 100, 140, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (ld.bgElements === 'rainbow') {
                        const colors = ['rgba(255,100,100,0.12)', 'rgba(255,200,100,0.12)', 'rgba(255,255,150,0.12)',
                            'rgba(150,255,150,0.12)', 'rgba(150,150,255,0.12)', 'rgba(200,150,255,0.12)'
                        ];
                        for (let j = 0; j < 6; j++) {
                            ctx.strokeStyle = colors[j];
                            ctx.lineWidth = 8;
                            ctx.beginPath();
                            const arcX = INTERNAL_W * 0.5 - camX * 0.15;
                            ctx.arc(arcX, INTERNAL_H + 60, 160 + j * 30, Math.PI, Math.PI * 1.8);
                            ctx.stroke();
                        }
                    }
                }

                _drawHUD() {
                    if (!this.player) return;
                    // Happiness bar
                    const barW = 180;
                    const barH = 16;
                    const barX = INTERNAL_W - barW - 20;
                    const barY = 16;
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.beginPath();
                    ctx.roundRect(barX - 2, barY - 2, barW + 4, barH + 4, 10);
                    ctx.fill();
                    const happyGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
                    happyGrad.addColorStop(0, '#ff6b6b');
                    happyGrad.addColorStop(0.5, '#ffd93d');
                    happyGrad.addColorStop(1, '#6bcb77');
                    ctx.fillStyle = happyGrad;
                    const fillW = (this.player.happiness / this.player.maxHappiness) * barW;
                    ctx.beginPath();
                    ctx.roundRect(barX, barY, Math.max(fillW, 4), barH, 8);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 11px system-ui';
                    ctx.textAlign = 'center';
                    ctx.fillText('😊 Happiness', barX + barW / 2, barY - 6);

                    // Level name
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.font = 'bold 14px system-ui';
                    ctx.textAlign = 'left';
                    const lvlName = this.levelData ? this.levelData.name : '';
                    ctx.fillText(`Level ${this.currentLevelIndex + 1}: ${lvlName}`, 16, 28);

                    // Pause hint
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.font = '11px system-ui';
                    ctx.textAlign = 'right';
                    ctx.fillText('P or Esc to pause', INTERNAL_W - 20, INTERNAL_H - 12);
                }

                _drawTouchControls() {
                    const btnY = INTERNAL_H - 100;
                    const btnSize = 50;
                    ctx.globalAlpha = 0.35;

                    // Left button
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.roundRect(20, btnY, btnSize, btnSize, 14);
                    ctx.fill();
                    ctx.fillStyle = '#333';
                    ctx.beginPath();
                    ctx.moveTo(45, btnY + 15);
                    ctx.lineTo(30, btnY + btnSize / 2);
                    ctx.lineTo(45, btnY + btnSize - 15);
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = '#333';
                    ctx.stroke();
                    if (this.touchLeft) {
                        ctx.fillStyle = 'rgba(255,255,200,0.5)';
                        ctx.beginPath();
                        ctx.roundRect(20, btnY, btnSize, btnSize, 14);
                        ctx.fill();
                    }

                    // Right button
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.roundRect(INTERNAL_W - 20 - btnSize, btnY, btnSize, btnSize, 14);
                    ctx.fill();
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(INTERNAL_W - 45, btnY + 15);
                    ctx.lineTo(INTERNAL_W - 30, btnY + btnSize / 2);
                    ctx.lineTo(INTERNAL_W - 45, btnY + btnSize - 15);
                    ctx.stroke();
                    if (this.touchRight) {
                        ctx.fillStyle = 'rgba(255,255,200,0.5)';
                        ctx.beginPath();
                        ctx.roundRect(INTERNAL_W - 20 - btnSize, btnY, btnSize, btnSize, 14);
                        ctx.fill();
                    }

                    // Jump button
                    const jumpX = INTERNAL_W / 2 - btnSize / 2;
                    const jumpY = btnY - 5;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.roundRect(jumpX, jumpY, btnSize + 10, btnSize, 14);
                    ctx.fill();
                    ctx.fillStyle = '#333';
                    ctx.font = 'bold 14px system-ui';
                    ctx.textAlign = 'center';
                    ctx.fillText('JUMP', jumpX + btnSize / 2 + 5, jumpY + btnSize / 2 + 5);
                    if (this.touchJump) {
                        ctx.fillStyle = 'rgba(255,255,200,0.5)';
                        ctx.beginPath();
                        ctx.roundRect(jumpX, jumpY, btnSize + 10, btnSize, 14);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                }

                _drawMenu() {
                    const grad = ctx.createLinearGradient(0, 0, 0, INTERNAL_H);
                    grad.addColorStop(0, '#667eea');
                    grad.addColorStop(1, '#764ba2');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, INTERNAL_W, INTERNAL_H);

                    // Decorative cubes
                    for (let i = 0; i < 20; i++) {
                        const dx = (i * 130 + this.stateTimer * 40 + Math.sin(i * 3) * 60) % (INTERNAL_W + 200) - 100;
                        const dy = 80 + Math.sin(i * 1.8 + this.stateTimer) * 180;
                        const ds = 12 + Math.sin(i * 2.1 + this.stateTimer * 0.7) * 8;
                        ctx.fillStyle = `rgba(255,255,255,${0.08 + Math.sin(i + this.stateTimer) * 0.05})`;
                        ctx.beginPath();
                        ctx.roundRect(dx, dy, ds, ds, ds * 0.3);
                        ctx.fill();
                    }

                    // Title
                    const titleY = 130 + Math.sin(this.stateTimer * 2) * 8;
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 56px system-ui';
                    ctx.textAlign = 'center';
                    ctx.shadowColor = 'rgba(255,150,50,0.7)';
                    ctx.shadowBlur = 30;
                    ctx.fillText('Cube Goes Happy', INTERNAL_W / 2, titleY);
                    ctx.shadowBlur = 0;

                    // Subtitle
                    ctx.fillStyle = 'rgba(255,255,255,0.8)';
                    ctx.font = '18px system-ui';
                    ctx.fillText('A joyful platforming adventure!', INTERNAL_W / 2, titleY + 40);

                    // Animated cube preview
                    const cubeX = INTERNAL_W / 2;
                    const cubeY = titleY + 120 + Math.sin(this.stateTimer * 3) * 15;
                    const cs = 50;
                    ctx.save();
                    ctx.translate(cubeX, cubeY);
                    const happyCycle = (Math.sin(this.stateTimer * 2.5) + 1) / 2;
                    const cgrad = ctx.createLinearGradient(-cs / 2, -cs / 2, cs / 2, cs / 2);
                    cgrad.addColorStop(0, '#ff9a56');
                    cgrad.addColorStop(1, '#e85d2c');
                    ctx.fillStyle = cgrad;
                    ctx.shadowColor = 'rgba(255,150,60,0.7)';
                    ctx.shadowBlur = 25;
                    ctx.beginPath();
                    ctx.roundRect(-cs / 2, -cs / 2, cs, cs, cs * 0.22);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#c44a1f';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    // Face
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(-cs * 0.18, -cs * 0.2, 5.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cs * 0.18, -cs * 0.2, 5.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#1a1a1a';
                    ctx.beginPath();
                    ctx.arc(-cs * 0.18, -cs * 0.18, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cs * 0.18, -cs * 0.18, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#3d1000';
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    const mouthCurve = happyCycle * cs * 0.25;
                    ctx.moveTo(-cs * 0.28, cs * 0.08);
                    ctx.quadraticCurveTo(0, cs * 0.08 + mouthCurve, cs * 0.28, cs * 0.08);
                    ctx.stroke();
                    ctx.restore();

                    // Start button
                    const btnX = INTERNAL_W / 2 - 100;
                    const btnY = cubeY + 80;
                    const btnW = 200;
                    const btnH = 54;
                    const btnPulse = 1 + Math.sin(this.stateTimer * 4) * 0.03;
                    ctx.save();
                    ctx.translate(INTERNAL_W / 2, btnY + btnH / 2);
                    ctx.scale(btnPulse, btnPulse);
                    ctx.fillStyle = '#ff7b3d';
                    ctx.shadowColor = 'rgba(255,120,40,0.6)';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.roundRect(-btnW / 2, -btnH / 2, btnW, btnH, 16);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#c44a1f';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 22px system-ui';
                    ctx.textAlign = 'center';
                    ctx.fillText('▶  PLAY', 0, 7);
                    ctx.restore();

                    // High score
                    if (this.highScore > 0) {
                        ctx.fillStyle = 'rgba(255,255,255,0.9)';
                        ctx.font = 'bold 15px system-ui';
                        ctx.textAlign = 'center';
                        ctx.fillText(`🏆 Best Happiness: ${this.highScore}`, INTERNAL_W / 2, btnY + btnH + 36);
                    }

                    // Controls info
                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.font = '13px system-ui';
                    ctx.fillText('Arrow Keys / WASD to move  ·  Space to jump  ·  Double jump!', INTERNAL_W / 2, INTERNAL_H -
                        25);
                    ctx.fillText('Stomp enemies from above  ·  Collect ✨ orbs  ·  Reach the 🚪', INTERNAL_W / 2,
                    INTERNAL_H - 50);
                }

                _drawPauseOverlay() {
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(0, 0, INTERNAL_W, INTERNAL_H);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 40px system-ui';
                    ctx.textAlign = 'center';
                    ctx.fillText('⏸  Paused', INTERNAL_W / 2, INTERNAL_H / 2 - 20);
                    ctx.font = '16px system-ui';
                    ctx.fillText('Press P or Esc to resume', INTERNAL_W / 2, INTERNAL_H / 2 + 30);
                    // Resume button for touch
                    ctx.fillStyle = '#ff7b3d';
                    ctx.beginPath();
                    ctx.roundRect(INTERNAL_W / 2 - 80, INTERNAL_H / 2 + 50, 160, 44, 12);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 18px system-ui';
                    ctx.fillText('Resume', INTERNAL_W / 2, INTERNAL_H / 2 + 78);
                }

                _drawLevelCompleteOverlay() {
                    const alpha = Math.min(1, this.transitionTimer / 0.5);
                    ctx.fillStyle = `rgba(0,0,0,${alpha * 0.5})`;
                    ctx.fillRect(0, 0, INTERNAL_W, INTERNAL_H);
                    if (this.transitionTimer > 0.3) {
                        const scale = Math.min(1, (this.transitionTimer - 0.3) / 0.3);
                        ctx.save();
                        ctx.translate(INTERNAL_W / 2, INTERNAL_H / 2);
                        ctx.scale(scale, scale);
                        ctx.fillStyle = '#ffd700';
                        ctx.font = 'bold 38px system-ui';
                        ctx.textAlign = 'center';
                        ctx.shadowColor = 'rgba(255,200,0,0.8)';
                        ctx.shadowBlur = 20;
                        ctx.fillText('✨ Level Complete! ✨', 0, -10);
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#fff';
                        ctx.font = '18px system-ui';
                        const lvlName = this.levelData ? this.levelData.name : '';
                        ctx.fillText(`${lvlName} cleared!`, 0, 30);
                        if (this.currentLevelIndex < this.levels.length - 1) {
                            ctx.fillText('Next level loading...', 0, 56);
                        } else {
                            ctx.fillText('Final level complete! 🎉', 0, 56);
                        }
                        ctx.restore();
                    }
                }

                _drawGameOverOverlay() {
                    const alpha = Math.min(1, this.stateTimer / 0.5);
                    ctx.fillStyle = `rgba(30,0,0,${alpha * 0.7})`;
                    ctx.fillRect(0, 0, INTERNAL_W, INTERNAL_H);
                    if (this.stateTimer > 0.4) {
                        ctx.fillStyle = '#ff6b6b';
                        ctx.font = 'bold 42px system-ui';
                        ctx.textAlign = 'center';
                        ctx.fillText('😢 Game Over', INTERNAL_W / 2, INTERNAL_H / 2 - 30);
                        ctx.fillStyle = '#fff';
                        ctx.font = '16px system-ui';
                        ctx.fillText(`Happiness depleted! Score: ${this.totalHappiness}`, INTERNAL_W / 2, INTERNAL_H / 2 +
                            20);
                        if (this.stateTimer > 0.8) {
                            ctx.fillText('Tap or click to return to menu', INTERNAL_W / 2, INTERNAL_H / 2 + 50);
                        }
                    }
                }

                _drawVictoryOverlay() {
                    const alpha = Math.min(1, this.stateTimer / 0.5);
                    ctx.fillStyle = `rgba(0,0,20,${alpha * 0.65})`;
                    ctx.fillRect(0, 0, INTERNAL_W, INTERNAL_H);
                    if (this.stateTimer > 0.3) {
                        const s = Math.min(1, (this.stateTimer - 0.3) / 0.4);
                        ctx.save();
                        ctx.translate(INTERNAL_W / 2, INTERNAL_H / 2 - 10);
                        ctx.scale(s, s);
                        ctx.fillStyle = '#ffd700';
                        ctx.font = 'bold 44px system-ui';
                        ctx.textAlign = 'center';
                        ctx.shadowColor = 'rgba(255,200,0,0.9)';
                        ctx.shadowBlur = 30;
                        ctx.fillText('🎉 You Win! 🎉', 0, -20);
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#fff';
                        ctx.font = '20px system-ui';
                        ctx.fillText('Cube is VERY happy!', 0, 25);
                        ctx.fillText(`Total Happiness: ${this.totalHappiness}`, 0, 55);
                        if (this.totalHappiness >= this.highScore && this.highScore > 0) {
                            ctx.fillStyle = '#ffd700';
                            ctx.fillText('🏆 NEW HIGH SCORE! 🏆', 0, 80);
                        }
                        if (this.stateTimer > 0.8) {
                            ctx.fillStyle = '#fff';
                            ctx.font = '15px system-ui';
                            ctx.fillText('Tap or click to return to menu', 0, 110);
                        }
                        ctx.restore();
                    }
                }

                run(timestamp) {
                    if (this.lastTime === undefined) this.lastTime = timestamp;
                    let dt = (timestamp - this.lastTime) / 1000;
                    this.lastTime = timestamp;
                    if (dt > 0.1) dt = 0.1;
                    if (dt <= 0) dt = 0.016;

                    this.stateTimer += dt;
                    if (this.state === 'playing' || this.state === 'levelComplete') {
                        this.update(dt);
                    } else if (this.state === 'menu' || this.state === 'gameOver' || this.state === 'victory') {
                        this.update(dt);
                    }

                    this.draw();
                    requestAnimationFrame((t) => this.run(t));
                }
            }

            // ────────────────────────────────────
            // BOOT
            // ────────────────────────────────────
            const game = new Game();
            requestAnimationFrame((t) => game.run(t));
        })();
    </script>
</body>
</html>
