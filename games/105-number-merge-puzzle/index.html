<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>105 - Number Merge Puzzle</title>
    <style>
        :root {
            --bg: #0a0a14;
            --surface: #12122a;
            --text: #e0e0f0;
            --accent: #ff6b9d;
            --gold: #ffd740;
            --neon-cyan: #00e5ff;
            --neon-purple: #b388ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            border-radius: 12px;
            box-shadow: 0 0 60px rgba(120, 80, 255, 0.25), 0 0 120px rgba(0, 180, 255, 0.12);
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 1 / 1.35;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            // --- Responsive Sizing ---
            const BASE_WIDTH = 420;
            const BASE_HEIGHT = 570;
            let scale = 1;

            function resize() {
                const maxW = window.innerWidth * 0.95;
                const maxH = window.innerHeight * 0.95;
                const ratio = BASE_WIDTH / BASE_HEIGHT;
                let w, h;
                if (maxW / maxH > ratio) {
                    h = maxH;
                    w = h * ratio;
                } else {
                    w = maxW;
                    h = w / ratio;
                }
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                canvas.width = BASE_WIDTH;
                canvas.height = BASE_HEIGHT;
                scale = w / BASE_WIDTH;
            }
            window.addEventListener('resize', resize);
            resize();

            // --- Audio Manager ---
            class AudioManager {
                constructor() {
                    this.ctx = null;
                    this.enabled = true;
                    this.musicGain = null;
                    this.musicOscillators = [];
                    this.musicPlaying = false;
                    try {
                        this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                    } catch (e) {
                        this.enabled = false;
                    }
                }

                resume() {
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                }

                playNote(freq, duration, type = 'sine', vol = 0.15, detune = 0) {
                    if (!this.enabled || !this.ctx) return;
                    const t = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    osc.detune.value = detune;
                    gain.gain.setValueAtTime(vol, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(t);
                    osc.stop(t + duration);
                }

                playMerge(value) {
                    if (!this.enabled || !this.ctx) return;
                    const baseFreq = 220 + (Math.log2(value + 1) * 55);
                    this.playNote(baseFreq, 0.25, 'triangle', 0.18);
                    this.playNote(baseFreq * 1.5, 0.2, 'sine', 0.1, 5);
                    if (value >= 30) {
                        this.playNote(baseFreq * 0.5, 0.35, 'sawtooth', 0.08, -10);
                    }
                }

                playMove() {
                    this.playNote(180, 0.06, 'square', 0.04);
                }

                playSpawn() {
                    this.playNote(350, 0.1, 'sine', 0.07);
                    this.playNote(520, 0.08, 'sine', 0.05, 10);
                }

                playLevelUp() {
                    if (!this.enabled || !this.ctx) return;
                    const t = this.ctx.currentTime;
                    [523, 659, 784, 1047].forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.16, t + i * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.35);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(t + i * 0.12);
                        osc.stop(t + i * 0.12 + 0.35);
                    });
                }

                playWin() {
                    if (!this.enabled || !this.ctx) return;
                    const t = this.ctx.currentTime;
                    [523, 659, 784, 1047, 1319, 1568].forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.2, t + i * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.5);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(t + i * 0.1);
                        osc.stop(t + i * 0.1 + 0.5);
                    });
                }

                playGameOver() {
                    if (!this.enabled || !this.ctx) return;
                    const t = this.ctx.currentTime;
                    [300, 240, 190, 140].forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.1, t + i * 0.15);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.15 + 0.4);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(t + i * 0.15);
                        osc.stop(t + i * 0.15 + 0.4);
                    });
                }

                playUIClick() {
                    this.playNote(600, 0.08, 'sine', 0.08);
                    this.playNote(900, 0.05, 'sine', 0.05, 15);
                }

                startMusic() {
                    if (!this.enabled || !this.ctx || this.musicPlaying) return;
                    this.musicPlaying = true;
                    this.musicGain = this.ctx.createGain();
                    this.musicGain.gain.value = 0.03;
                    this.musicGain.connect(this.ctx.destination);
                    const notes = [130.81, 164.81, 196, 220, 261.63, 220, 196, 164.81];
                    let noteIdx = 0;
                    const playNext = () => {
                        if (!this.musicPlaying) return;
                        const osc = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = notes[noteIdx % notes.length];
                        g.gain.setValueAtTime(0.025, this.ctx.currentTime);
                        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.8);
                        osc.connect(g);
                        g.connect(this.musicGain);
                        osc.start(this.ctx.currentTime);
                        osc.stop(this.ctx.currentTime + 1.8);
                        this.musicOscillators.push(osc);
                        noteIdx++;
                        this._musicTimer = setTimeout(playNext, 1200);
                    };
                    playNext();
                }

                stopMusic() {
                    this.musicPlaying = false;
                    if (this._musicTimer) clearTimeout(this._musicTimer);
                    this.musicOscillators.forEach(o => { try { o.stop(); } catch (e) {} });
                    this.musicOscillators = [];
                }
            }

            // --- Particle System ---
            class Particle {
                constructor(x, y, vx, vy, color, life, size = 3) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.color = color;
                    this.life = life;
                    this.maxLife = life;
                    this.size = size;
                    this.alive = true;
                }
                update(dt) {
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;
                    this.vy += 120 * dt; // gravity
                    this.life -= dt;
                    if (this.life <= 0) this.alive = false;
                }
                draw(ctx) {
                    const alpha = Math.max(0, this.life / this.maxLife);
                    const s = this.size * (0.5 + 0.5 * alpha);
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = s * 2;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, s, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            class ParticleSystem {
                constructor() {
                    this.particles = [];
                }
                emit(x, y, count, color, lifeRange = [0.3, 0.8], speedRange = [50, 250], sizeRange = [2, 5]) {
                    for (let i = 0; i < count; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = speedRange[0] + Math.random() * (speedRange[1] - speedRange[0]);
                        const life = lifeRange[0] + Math.random() * (lifeRange[1] - lifeRange[0]);
                        const size = sizeRange[0] + Math.random() * (sizeRange[1] - sizeRange[0]);
                        const vx = Math.cos(angle) * speed;
                        const vy = Math.sin(angle) * speed - 80;
                        this.particles.push(new Particle(x, y, vx, vy, color, life, size));
                    }
                }
                update(dt) {
                    for (const p of this.particles) {
                        if (p.alive) p.update(dt);
                    }
                    this.particles = this.particles.filter(p => p.alive);
                }
                draw(ctx) {
                    for (const p of this.particles) {
                        if (p.alive) p.draw(ctx);
                    }
                }
                clear() {
                    this.particles = [];
                }
            }

            // --- Tile ---
            class Tile {
                constructor(row, col, value) {
                    this.row = row;
                    this.col = col;
                    this.value = value;
                    this.displayX = col;
                    this.displayY = row;
                    this.scale = 1;
                    this.targetScale = 1;
                    this.justCreated = true;
                    this.justMerged = false;
                    this.removed = false;
                }
                setGridPos(r, c) {
                    this.row = r;
                    this.col = c;
                }
                animateTo(r, c) {
                    this.row = r;
                    this.col = c;
                }
                getColor() {
                    const v = this.value;
                    const colors = [
                        { min: 1, max: 2, bg: '#1a2540', glow: '#4a90d9', text: '#aac8f0' },
                        { min: 3, max: 5, bg: '#1a3040', glow: '#3db8c0', text: '#b8f0f0' },
                        { min: 6, max: 10, bg: '#1a3a30', glow: '#3dc070', text: '#b8f0c8' },
                        { min: 11, max: 20, bg: '#2a2a20', glow: '#c0a030', text: '#f0e8b8' },
                        { min: 21, max: 34, bg: '#2a1a20', glow: '#d06040', text: '#f0c8b8' },
                        { min: 35, max: 54, bg: '#2a1030', glow: '#c040d0', text: '#e8c8f0' },
                        { min: 55, max: 80, bg: '#301020', glow: '#e04080', text: '#f0c0d8' },
                        { min: 81, max: 104, bg: '#201030', glow: '#ff60a0', text: '#ffe0f0' },
                        { min: 105, max: 999, bg: '#1a0a20', glow: '#ffd740', text: '#fff8e0' },
                    ];
                    for (const c of colors) {
                        if (v >= c.min && v <= c.max) return c;
                    }
                    return colors[colors.length - 1];
                }
            }

            // --- Game Grid ---
            class Grid {
                constructor(rows, cols) {
                    this.rows = rows;
                    this.cols = cols;
                    this.tiles = [];
                    this.gridMap = null; // 2D array of Tile references
                    this.rebuildMap();
                }

                rebuildMap() {
                    this.gridMap = Array.from({ length: this.rows }, () => Array(this.cols).fill(null));
                    for (const tile of this.tiles) {
                        if (!tile.removed) {
                            this.gridMap[tile.row][tile.col] = tile;
                        }
                    }
                }

                getTile(r, c) {
                    if (r < 0 || r >= this.rows || c < 0 || c >= this.cols) return undefined;
                    return this.gridMap[r][c];
                }

                isEmpty(r, c) {
                    return this.getTile(r, c) === null;
                }

                addTile(tile) {
                    this.tiles.push(tile);
                    this.gridMap[tile.row][tile.col] = tile;
                }

                removeTile(tile) {
                    tile.removed = true;
                    if (this.gridMap[tile.row] && this.gridMap[tile.row][tile.col] === tile) {
                        this.gridMap[tile.row][tile.col] = null;
                    }
                }

                getEmptyCells() {
                    const cells = [];
                    for (let r = 0; r < this.rows; r++) {
                        for (let c = 0; c < this.cols; c++) {
                            if (this.isEmpty(r, c)) cells.push({ row: r, col: c });
                        }
                    }
                    return cells;
                }

                spawnTile(value) {
                    const empty = this.getEmptyCells();
                    if (empty.length === 0) return null;
                    const cell = empty[Math.floor(Math.random() * empty.length)];
                    const tile = new Tile(cell.row, cell.col, value);
                    tile.justCreated = true;
                    tile.scale = 0.01;
                    tile.targetScale = 1;
                    this.addTile(tile);
                    return tile;
                }

                slideTiles(direction) {
                    // direction: 'up','down','left','right'
                    const moves = [];
                    const merges = [];
                    const mergedSet = new Set();

                    const DR = { up: -1, down: 1, left: 0, right: 0 };
                    const DC = { up: 0, down: 0, left: -1, right: 1 };
                    const dr = DR[direction];
                    const dc = DC[direction];

                    // Determine traversal order
                    const rowOrder = direction === 'down' ?
                        Array.from({ length: this.rows }, (_, i) => this.rows - 1 - i) :
                        Array.from({ length: this.rows }, (_, i) => i);
                    const colOrder = direction === 'right' ?
                        Array.from({ length: this.cols }, (_, i) => this.cols - 1 - i) :
                        Array.from({ length: this.cols }, (_, i) => i);

                    // Clear grid map for repositioning
                    this.gridMap = Array.from({ length: this.rows }, () => Array(this.cols).fill(null));

                    const newTiles = [];

                    for (const r of rowOrder) {
                        for (const c of colOrder) {
                            const tile = this.getTileFromList(r, c);
                            if (!tile || tile.removed) continue;

                            let curR = r;
                            let curC = c;
                            let merged = false;

                            // Slide as far as possible
                            while (true) {
                                const nextR = curR + dr;
                                const nextC = curC + dc;
                                if (nextR < 0 || nextR >= this.rows || nextC < 0 || nextC >= this.cols) break;
                                const occupant = this.gridMap[nextR][nextC];
                                if (occupant === null) {
                                    curR = nextR;
                                    curC = nextC;
                                } else if (occupant.value === tile.value && !mergedSet.has(occupant) && !mergedSet.has(
                                        tile)) {
                                    // Merge
                                    mergedSet.add(occupant);
                                    mergedSet.add(tile);
                                    const newValue = tile.value + occupant.value;
                                    const mergedTile = new Tile(nextR, nextC, newValue);
                                    mergedTile.justMerged = true;
                                    mergedTile.justCreated = false;
                                    mergedTile.scale = 1.3;
                                    mergedTile.targetScale = 1;
                                    this.gridMap[nextR][nextC] = mergedTile;
                                    newTiles.push(mergedTile);
                                    merges.push({ tile: mergedTile, fromR: r, fromC: c, otherR: occupant.row,
                                        otherC: occupant.col, value: newValue });
                                    tile.removed = true;
                                    occupant.removed = true;
                                    merged = true;
                                    break;
                                } else {
                                    break;
                                }
                            }

                            if (!merged) {
                                if (curR !== r || curC !== c) {
                                    moves.push({ tile, fromR: r, fromC: c, toR: curR, toC: curC });
                                }
                                tile.setGridPos(curR, curC);
                                this.gridMap[curR][curC] = tile;
                                newTiles.push(tile);
                            }
                        }
                    }

                    // Rebuild tiles list
                    this.tiles = newTiles.filter(t => !t.removed);
                    this.rebuildMap();

                    return { moves, merges, hasChanged: moves.length > 0 || merges.length > 0 };
                }

                getTileFromList(r, c) {
                    for (const t of this.tiles) {
                        if (!t.removed && t.row === r && t.col === c) return t;
                    }
                    return null;
                }

                hasAnyMoves() {
                    if (this.getEmptyCells().length > 0) return true;
                    for (let r = 0; r < this.rows; r++) {
                        for (let c = 0; c < this.cols; c++) {
                            const tile = this.getTile(r, c);
                            if (!tile) continue;
                            const neighbors = [
                                [r - 1, c],
                                [r + 1, c],
                                [r, c - 1],
                                [r, c + 1]
                            ];
                            for (const [nr, nc] of neighbors) {
                                const nt = this.getTile(nr, nc);
                                if (nt && nt.value === tile.value) return true;
                            }
                        }
                    }
                    return false;
                }

                getMaxValue() {
                    let max = 0;
                    for (const t of this.tiles) {
                        if (!t.removed && t.value > max) max = t.value;
                    }
                    return max;
                }

                clear() {
                    this.tiles = [];
                    this.rebuildMap();
                }
            }

            // --- Level Definitions ---
            const LEVELS = [
                { id: 1, name: 'Warm Up', rows: 4, cols: 4, target: 15, spawnValues: [1, 1, 1, 2], spawnChance: [0.6, 0.6,
                        0.6, 0.4
                    ], initialTiles: 3, description: 'Reach 15 to advance' },
                { id: 2, name: 'Getting There', rows: 4, cols: 4, target: 35, spawnValues: [1, 2, 2, 3], spawnChance: [0.4, 0.4,
                        0.4, 0.3
                    ], initialTiles: 4, description: 'Reach 35 to advance' },
                { id: 3, name: 'Halfway', rows: 4, cols: 4, target: 55, spawnValues: [1, 2, 3, 4], spawnChance: [0.35, 0.35, 0.3,
                        0.25
                    ], initialTiles: 5, description: 'Reach 55 to advance' },
                { id: 4, name: 'The Grind', rows: 5, cols: 5, target: 80, spawnValues: [2, 3, 4, 5], spawnChance: [0.35, 0.3, 0.25,
                        0.2
                    ], initialTiles: 5, description: 'Reach 80 to advance' },
                { id: 5, name: 'Final Push', rows: 5, cols: 5, target: 105, spawnValues: [2, 3, 4, 5, 6], spawnChance: [0.3, 0.3,
                        0.25, 0.2, 0.15
                    ], initialTiles: 6, description: 'Create 105 to WIN!' },
            ];

            // --- Main Game ---
            class Game {
                constructor() {
                    this.audio = new AudioManager();
                    this.particles = new ParticleSystem();
                    this.state = 'MENU'; // MENU, PLAYING, PAUSED, LEVEL_COMPLETE, GAME_OVER, WIN
                    this.levelIndex = 0;
                    this.grid = null;
                    this.currentLevel = null;
                    this.score = 0;
                    this.highScore = parseInt(localStorage.getItem('merge105_highscore') || '0');
                    this.bestLevel = parseInt(localStorage.getItem('merge105_bestlevel') || '0');
                    this.moveCount = 0;
                    this.shakeAmount = 0;
                    this.shakeDuration = 0;
                    this.flashAlpha = 0;
                    this.stateTimer = 0;
                    this.levelCompleteTimer = 0;
                    this.tileAnimSpeed = 8; // tiles per second for slide animation
                    this.pendingMoves = [];
                    this.pendingMerges = [];
                    this.animTimer = 0;
                    this.isAnimating = false;
                    this.touchStartX = 0;
                    this.touchStartY = 0;
                    this.touchStartTime = 0;
                    this.swipeThreshold = 30;
                    this.inputLocked = false;

                    // Button areas (scaled to base coords)
                    this.buttons = [];
                    this.hoveredButton = null;

                    this.setupInput();
                }

                setupInput() {
                    // Keyboard
                    window.addEventListener('keydown', (e) => {
                        if (this.state === 'MENU') {
                            if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') {
                                e.preventDefault();
                                this.startGame();
                                return;
                            }
                        }
                        if (this.state === 'PLAYING' && !this.isAnimating && !this.inputLocked) {
                            switch (e.key) {
                                case 'ArrowUp':
                                case 'w':
                                case 'W':
                                    e.preventDefault();
                                    this.doMove('up');
                                    break;
                                case 'ArrowDown':
                                case 's':
                                case 'S':
                                    e.preventDefault();
                                    this.doMove('down');
                                    break;
                                case 'ArrowLeft':
                                case 'a':
                                case 'A':
                                    e.preventDefault();
                                    this.doMove('left');
                                    break;
                                case 'ArrowRight':
                                case 'd':
                                case 'D':
                                    e.preventDefault();
                                    this.doMove('right');
                                    break;
                                case 'p':
                                case 'P':
                                case 'Escape':
                                    e.preventDefault();
                                    this.state = 'PAUSED';
                                    this.audio.playUIClick();
                                    break;
                            }
                        } else if (this.state === 'PAUSED') {
                            if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
                                e.preventDefault();
                                this.state = 'PLAYING';
                                this.audio.playUIClick();
                            }
                        } else if (this.state === 'GAME_OVER' || this.state === 'WIN') {
                            if (e.key === 'Enter' || e.key === ' ' || e.key === 'r' || e.key === 'R') {
                                e.preventDefault();
                                this.startGame();
                            }
                        }
                        if (this.state === 'LEVEL_COMPLETE') {
                            if (e.key === 'Enter' || e.key === ' ') {
                                e.preventDefault();
                                this.advanceLevel();
                            }
                        }
                    });

                    // Touch / Mouse on canvas
                    canvas.addEventListener('pointerdown', (e) => {
                        this.audio.resume();
                        const rect = canvas.getBoundingClientRect();
                        const x = (e.clientX - rect.left) / scale;
                        const y = (e.clientY - rect.top) / scale;
                        this.touchStartX = x;
                        this.touchStartY = y;
                        this.touchStartTime = Date.now();
                        this.pointerDown(x, y);
                    });

                    canvas.addEventListener('pointerup', (e) => {
                        const rect = canvas.getBoundingClientRect();
                        const x = (e.clientX - rect.left) / scale;
                        const y = (e.clientY - rect.top) / scale;
                        const dx = x - this.touchStartX;
                        const dy = y - this.touchStartY;
                        const dt = Date.now() - this.touchStartTime;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist > this.swipeThreshold && dt < 600 && this.state === 'PLAYING' && !this
                            .isAnimating && !this.inputLocked) {
                            if (Math.abs(dx) > Math.abs(dy)) {
                                this.doMove(dx > 0 ? 'right' : 'left');
                            } else {
                                this.doMove(dy > 0 ? 'down' : 'up');
                            }
                        }
                        this.pointerUp(x, y);
                    });

                    canvas.addEventListener('pointermove', (e) => {
                        const rect = canvas.getBoundingClientRect();
                        const x = (e.clientX - rect.left) / scale;
                        const y = (e.clientY - rect.top) / scale;
                        this.pointerMove(x, y);
                    });
                }

                pointerDown(x, y) {
                    this.checkButtonClick(x, y, true);
                }

                pointerUp(x, y) {
                    this.checkButtonClick(x, y, false);
                }

                pointerMove(x, y) {
                    this.hoveredButton = this.findButton(x, y);
                }

                findButton(x, y) {
                    for (const btn of this.buttons) {
                        if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                            return btn;
                        }
                    }
                    return null;
                }

                checkButtonClick(x, y, isDown) {
                    const btn = this.findButton(x, y);
                    if (!btn) return;
                    if (!isDown) {
                        // Click
                        if (btn.action === 'start') {
                            this.audio.resume();
                            this.audio.playUIClick();
                            this.startGame();
                        } else if (btn.action === 'resume') {
                            this.audio.playUIClick();
                            this.state = 'PLAYING';
                        } else if (btn.action === 'restart') {
                            this.audio.playUIClick();
                            this.startGame();
                        } else if (btn.action === 'menu') {
                            this.audio.playUIClick();
                            this.audio.stopMusic();
                            this.state = 'MENU';
                            this.particles.clear();
                        } else if (btn.action === 'next_level') {
                            this.audio.playUIClick();
                            this.advanceLevel();
                        }
                    }
                }

                startGame() {
                    this.audio.resume();
                    this.audio.playUIClick();
                    this.levelIndex = 0;
                    this.score = 0;
                    this.moveCount = 0;
                    this.shakeAmount = 0;
                    this.shakeDuration = 0;
                    this.flashAlpha = 0;
                    this.particles.clear();
                    this.pendingMoves = [];
                    this.pendingMerges = [];
                    this.isAnimating = false;
                    this.inputLocked = false;
                    this.loadLevel(0);
                    this.state = 'PLAYING';
                    this.audio.startMusic();
                }

                loadLevel(index) {
                    if (index >= LEVELS.length) {
                        this.state = 'WIN';
                        this.audio.stopMusic();
                        this.audio.playWin();
                        if (this.levelIndex > this.bestLevel) {
                            this.bestLevel = this.levelIndex;
                            localStorage.setItem('merge105_bestlevel', this.bestLevel);
                        }
                        return;
                    }
                    this.levelIndex = index;
                    this.currentLevel = LEVELS[index];
                    this.grid = new Grid(this.currentLevel.rows, this.currentLevel.cols);
                    this.pendingMoves = [];
                    this.pendingMerges = [];
                    this.isAnimating = false;
                    this.inputLocked = false;
                    // Spawn initial tiles
                    for (let i = 0; i < this.currentLevel.initialTiles; i++) {
                        const val = this.getRandomSpawnValue();
                        const tile = this.grid.spawnTile(val);
                        if (tile) {
                            tile.justCreated = true;
                            tile.scale = 1;
                            tile.targetScale = 1;
                        }
                    }
                    // Reset display positions
                    for (const t of this.grid.tiles) {
                        t.displayX = t.col;
                        t.displayY = t.row;
                    }
                }

                getRandomSpawnValue() {
                    const lvl = this.currentLevel;
                    const r = Math.random();
                    let cumulative = 0;
                    for (let i = 0; i < lvl.spawnValues.length; i++) {
                        cumulative += lvl.spawnChance[i] / lvl.spawnChance.reduce((a, b) => a + b, 0);
                        if (r <= cumulative) return lvl.spawnValues[i];
                    }
                    return lvl.spawnValues[lvl.spawnValues.length - 1];
                }

                doMove(direction) {
                    if (this.isAnimating || this.inputLocked) return;
                    const result = this.grid.slideTiles(direction);
                    if (!result.hasChanged) return;

                    this.audio.playMove();
                    this.moveCount++;
                    this.pendingMoves = result.moves;
                    this.pendingMerges = result.merges;
                    this.isAnimating = true;
                    this.animTimer = 0;
                    this.inputLocked = true;

                    // Initialize display positions for animation
                    for (const m of result.moves) {
                        m.tile.displayX = m.fromC;
                        m.tile.displayY = m.fromR;
                    }
                    for (const m of result.merges) {
                        m.tile.displayX = m.fromC;
                        m.tile.displayY = m.fromR;
                        m.tile.scale = 0.8;
                        m.tile.targetScale = 1.35;
                    }
                }

                finishMove() {
                    // Process merges
                    for (const m of this.pendingMerges) {
                        const tile = m.tile;
                        tile.displayX = tile.col;
                        tile.displayY = tile.row;
                        tile.scale = 1.35;
                        tile.targetScale = 1;
                        tile.justMerged = true;
                        this.score += m.value;
                        // Particles at merge position
                        const px = this.gridToPixelX(tile.col);
                        const py = this.gridToPixelY(tile.row);
                        const color = tile.getColor().glow;
                        this.particles.emit(px, py, 18 + Math.floor(m.value / 5), color, [0.3, 0.9], [60, 300], [2, 7]);
                        this.audio.playMerge(m.value);
                        if (m.value >= 30) {
                            this.shakeAmount = Math.min(12, 3 + m.value / 10);
                            this.shakeDuration = 0.35;
                        }
                        if (m.value >= 60) {
                            this.flashAlpha = 0.35;
                        }
                    }
                    for (const m of this.pendingMoves) {
                        m.tile.displayX = m.tile.col;
                        m.tile.displayY = m.tile.row;
                    }

                    // Check for level complete
                    const maxVal = this.grid.getMaxValue();
                    if (maxVal >= this.currentLevel.target && this.state === 'PLAYING') {
                        this.state = 'LEVEL_COMPLETE';
                        this.levelCompleteTimer = 0;
                        this.audio.playLevelUp();
                        this.shakeAmount = 8;
                        this.shakeDuration = 0.5;
                        this.flashAlpha = 0.4;
                        if (this.levelIndex + 1 > this.bestLevel) {
                            this.bestLevel = this.levelIndex + 1;
                            localStorage.setItem('merge105_bestlevel', this.bestLevel);
                        }
                        if (this.score > this.highScore) {
                            this.highScore = this.score;
                            localStorage.setItem('merge105_highscore', this.highScore);
                        }
                    }

                    // Spawn new tile
                    const spawnVal = this.getRandomSpawnValue();
                    const newTile = this.grid.spawnTile(spawnVal);
                    if (newTile) {
                        newTile.displayX = newTile.col;
                        newTile.displayY = newTile.row;
                        newTile.scale = 0.01;
                        newTile.targetScale = 1;
                        this.audio.playSpawn();
                        const spx = this.gridToPixelX(newTile.col);
                        const spy = this.gridToPixelY(newTile.row);
                        const sc = newTile.getColor().glow;
                        this.particles.emit(spx, spy, 8, sc, [0.2, 0.5], [30, 120], [1.5, 3.5]);
                    }

                    // Check game over
                    if (!this.grid.hasAnyMoves() && this.state === 'PLAYING') {
                        this.state = 'GAME_OVER';
                        this.audio.stopMusic();
                        this.audio.playGameOver();
                        if (this.score > this.highScore) {
                            this.highScore = this.score;
                            localStorage.setItem('merge105_highscore', this.highScore);
                        }
                    }

                    this.pendingMoves = [];
                    this.pendingMerges = [];
                    this.isAnimating = false;
                    this.inputLocked = false;
                }

                advanceLevel() {
                    this.levelIndex++;
                    if (this.levelIndex >= LEVELS.length) {
                        this.state = 'WIN';
                        this.audio.stopMusic();
                        this.audio.playWin();
                        if (this.score > this.highScore) {
                            this.highScore = this.score;
                            localStorage.setItem('merge105_highscore', this.highScore);
                        }
                        if (this.levelIndex > this.bestLevel) {
                            this.bestLevel = this.levelIndex;
                            localStorage.setItem('merge105_bestlevel', this.bestLevel);
                        }
                        return;
                    }
                    this.particles.clear();
                    this.loadLevel(this.levelIndex);
                    this.state = 'PLAYING';
                    this.flashAlpha = 0.25;
                }

                gridToPixelX(col) {
                    const lvl = this.currentLevel;
                    const gridSize = Math.min(320, (canvas.width - 80));
                    const cellSize = gridSize / Math.max(lvl.rows, lvl.cols);
                    const offsetX = (canvas.width - cellSize * lvl.cols) / 2;
                    const offsetY = 140;
                    return offsetX + col * cellSize + cellSize / 2;
                }

                gridToPixelY(row) {
                    const lvl = this.currentLevel;
                    const gridSize = Math.min(320, (canvas.width - 80));
                    const cellSize = gridSize / Math.max(lvl.rows, lvl.cols);
                    const offsetX = (canvas.width - cellSize * lvl.cols) / 2;
                    const offsetY = 140;
                    return offsetY + row * cellSize + cellSize / 2;
                }

                getGridMetrics() {
                    const lvl = this.currentLevel;
                    const gridSize = Math.min(320, (canvas.width - 80));
                    const cellSize = gridSize / Math.max(lvl.rows, lvl.cols);
                    const offsetX = (canvas.width - cellSize * lvl.cols) / 2;
                    const offsetY = 140;
                    return { gridSize, cellSize, offsetX, offsetY, rows: lvl.rows, cols: lvl.cols };
                }

                update(dt) {
                    // Clamp dt
                    const clampedDt = Math.min(dt, 0.1);
                    this.stateTimer += clampedDt;

                    // Update shake
                    if (this.shakeDuration > 0) {
                        this.shakeDuration -= clampedDt;
                        if (this.shakeDuration <= 0) {
                            this.shakeAmount = 0;
                            this.shakeDuration = 0;
                        } else {
                            this.shakeAmount *= Math.exp(-6 * clampedDt);
                        }
                    }

                    // Update flash
                    if (this.flashAlpha > 0) {
                        this.flashAlpha = Math.max(0, this.flashAlpha - clampedDt * 1.5);
                    }

                    // Update particles
                    this.particles.update(clampedDt);

                    // Update tile animations
                    if (this.isAnimating) {
                        this.animTimer += clampedDt;
                        const animDuration = 0.15;
                        const progress = Math.min(1, this.animTimer / animDuration);
                        const eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic

                        for (const m of this.pendingMoves) {
                            m.tile.displayX = m.fromC + (m.toC - m.fromC) * eased;
                            m.tile.displayY = m.fromR + (m.toR - m.fromR) * eased;
                        }
                        for (const m of this.pendingMerges) {
                            m.tile.displayX = m.fromC + (m.tile.col - m.fromC) * eased;
                            m.tile.displayY = m.fromR + (m.tile.row - m.fromR) * eased;
                        }

                        if (progress >= 1) {
                            this.finishMove();
                        }
                    }

                    // Update all tile scales
                    for (const tile of this.grid?.tiles || []) {
                        if (tile.removed) continue;
                        const diff = tile.targetScale - tile.scale;
                        tile.scale += diff * Math.min(1, clampedDt * 14);
                        if (Math.abs(diff) < 0.005) tile.scale = tile.targetScale;
                        if (tile.justMerged && tile.scale < 1.01 && tile.targetScale === 1) {
                            tile.justMerged = false;
                        }
                    }

                    // Level complete timer
                    if (this.state === 'LEVEL_COMPLETE') {
                        this.levelCompleteTimer += clampedDt;
                    }
                }

                draw() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    // Background
                    const bgGrad = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 50, canvas.width / 2,
                        canvas.height / 2, canvas.height);
                    bgGrad.addColorStop(0, '#1a1a3a');
                    bgGrad.addColorStop(0.6, '#0d0d20');
                    bgGrad.addColorStop(1, '#050510');
                    ctx.fillStyle = bgGrad;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Subtle grid dots in background
                    ctx.fillStyle = 'rgba(255,255,255,0.015)';
                    for (let x = 0; x < canvas.width; x += 20) {
                        for (let y = 0; y < canvas.height; y += 20) {
                            ctx.beginPath();
                            ctx.arc(x, y, 0.8, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }

                    // Apply screen shake
                    let shakeX = 0;
                    let shakeY = 0;
                    if (this.shakeAmount > 0.05) {
                        shakeX = (Math.random() - 0.5) * this.shakeAmount * 2;
                        shakeY = (Math.random() - 0.5) * this.shakeAmount * 2;
                    }

                    ctx.save();
                    ctx.translate(shakeX, shakeY);

                    if (this.state === 'MENU') {
                        this.drawMenu();
                    } else {
                        this.drawGameUI();
                        this.drawGrid();
                        this.particles.draw(ctx);
                        this.drawOverlays();
                    }

                    ctx.restore();

                    // Flash overlay (not affected by shake)
                    if (this.flashAlpha > 0.01) {
                        ctx.fillStyle = `rgba(255,255,255,${this.flashAlpha})`;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                }

                drawMenu() {
                    // Title
                    const titleY = 160;
                    ctx.save();
                    // Glow behind title
                    const titleGlow = ctx.createRadialGradient(canvas.width / 2, titleY, 10, canvas.width / 2, titleY, 180);
                    titleGlow.addColorStop(0, 'rgba(255,180,60,0.5)');
                    titleGlow.addColorStop(0.5, 'rgba(255,100,150,0.2)');
                    titleGlow.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = titleGlow;
                    ctx.fillRect(canvas.width / 2 - 200, titleY - 160, 400, 320);

                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#ffd740';
                    ctx.font = 'bold 64px "Segoe UI", system-ui, sans-serif';
                    ctx.shadowColor = '#ff9500';
                    ctx.shadowBlur = 30;
                    ctx.fillText('105', canvas.width / 2, titleY);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ffe8c0';
                    ctx.font = 'bold 18px "Segoe UI", system-ui, sans-serif';
                    ctx.fillText('Number Merge Puzzle', canvas.width / 2, titleY + 52);

                    // Subtitle
                    ctx.fillStyle = '#aaaacc';
                    ctx.font = '14px "Segoe UI", system-ui, sans-serif';
                    ctx.fillText('Swipe to merge tiles • Reach the target', canvas.width / 2, titleY + 90);

                    // High score
                    if (this.highScore > 0) {
                        ctx.fillStyle = '#ffd740';
                        ctx.font = 'bold 15px "Segoe UI", system-ui, sans-serif';
                        ctx.fillText(`Best Score: ${this.highScore}  |  Best Level: ${this.bestLevel}`, canvas.width / 2,
                            titleY + 120);
                    }

                    ctx.restore();

                    // Start button
                    const btnX = canvas.width / 2 - 90;
                    const btnY = 380;
                    const btnW = 180;
                    const btnH = 52;
                    this.buttons = [{ x: btnX, y: btnY, w: btnW, h: btnH, action: 'start' }];

                    const isHovered = this.hoveredButton && this.hoveredButton.action === 'start';
                    const btnGrad = ctx.createLinearGradient(btnX, btnY, btnX, btnY + btnH);
                    btnGrad.addColorStop(0, isHovered ? '#ff8a50' : '#ff6b3d');
                    btnGrad.addColorStop(1, isHovered ? '#e04070' : '#c03060');
                    ctx.fillStyle = btnGrad;
                    ctx.beginPath();
                    ctx.roundRect(btnX, btnY, btnW, btnH, 26);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 20px "Segoe UI", system-ui, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('PLAY', canvas.width / 2, btnY + btnH / 2);

                    // Instructions
                    ctx.fillStyle = '#8888aa';
                    ctx.font = '12px "Segoe UI", system-ui, sans-serif';
                    ctx.fillText('Arrow Keys / WASD / Swipe to move', canvas.width / 2, btnY + btnH + 35);
                    ctx.fillText('Press P to pause', canvas.width / 2, btnY + btnH + 55);
                }

                drawGameUI() {
                    const lvl = this.currentLevel;
                    if (!lvl) return;

                    // Top bar
                    ctx.fillStyle = 'rgba(20,20,40,0.8)';
                    ctx.fillRect(0, 0, canvas.width, 105);
                    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(0, 105);
                    ctx.lineTo(canvas.width, 105);
                    ctx.stroke();

                    // Level info
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 20px "Segoe UI", system-ui, sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText(`Level ${lvl.id}: ${lvl.name}`, 20, 28);

                    ctx.fillStyle = '#ccccdd';
                    ctx.font = '13px "Segoe UI", system-ui, sans-serif';
                    ctx.fillText(lvl.description, 20, 52);

                    // Target display
                    ctx.fillStyle = '#ffd740';
                    ctx.font = 'bold 16px "Segoe UI", system-ui, sans-serif';
                    ctx.textAlign = 'right';
                    ctx.fillText(`Target: ${lvl.target}`, canvas.width - 20, 28);

                    // Score
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 22px "Segoe UI", system-ui, sans-serif';
                    ctx.fillText(`${this.score}`, canvas.width - 20, 56);

                    ctx.fillStyle = '#8888aa';
                    ctx.font = '11px "Segoe UI", system-ui, sans-serif';
                    ctx.fillText(`Moves: ${this.moveCount}`, canvas.width - 20, 78);

                    // Level progress dots
                    const dotY = 90;
                    const dotSpacing = 22;
                    const startX = canvas.width / 2 - ((LEVELS.length - 1) * dotSpacing) / 2;
                    for (let i = 0; i < LEVELS.length; i++) {
                        const dx = startX + i * dotSpacing;
                        ctx.beginPath();
                        ctx.arc(dx, dotY, 6, 0, Math.PI * 2);
                        if (i < this.levelIndex) {
                            ctx.fillStyle = '#ffd740';
                            ctx.fill();
                            ctx.strokeStyle = '#ffd740';
                            ctx.lineWidth = 2;
                            ctx.stroke();
                        } else if (i === this.levelIndex && this.state === 'PLAYING') {
                            ctx.fillStyle = '#ffffff';
                            ctx.fill();
                            ctx.strokeStyle = '#ffd740';
                            ctx.lineWidth = 2.5;
                            ctx.stroke();
                            // Pulse
                            const pulse = 1 + Math.sin(this.stateTimer * 4) * 0.3;
                            ctx.beginPath();
                            ctx.arc(dx, dotY, 10 * pulse, 0, Math.PI * 2);
                            ctx.strokeStyle = 'rgba(255,215,64,0.3)';
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        } else {
                            ctx.fillStyle = 'rgba(255,255,255,0.2)';
                            ctx.fill();
                            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                    }
                }

                drawGrid() {
                    const lvl = this.currentLevel;
                    if (!lvl || !this.grid) return;
                    const { cellSize, offsetX, offsetY, rows, cols } = this.getGridMetrics();
                    const gridW = cellSize * cols;
                    const gridH = cellSize * rows;

                    // Grid background
                    ctx.fillStyle = 'rgba(15,15,35,0.9)';
                    ctx.beginPath();
                    ctx.roundRect(offsetX - 4, offsetY - 4, gridW + 8, gridH + 8, 10);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Cells
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            const cx = offsetX + c * cellSize;
                            const cy = offsetY + r * cellSize;
                            ctx.fillStyle = 'rgba(25,25,50,0.7)';
                            ctx.beginPath();
                            ctx.roundRect(cx + 3, cy + 3, cellSize - 6, cellSize - 6, 6);
                            ctx.fill();
                        }
                    }

                    // Tiles
                    const allTiles = [...(this.grid?.tiles || [])].filter(t => !t.removed);
                    // Sort by value for draw order (smaller on top)
                    allTiles.sort((a, b) => a.value - b.value);

                    for (const tile of allTiles) {
                        const colors = tile.getColor();
                        const tx = offsetX + tile.displayX * cellSize + cellSize / 2;
                        const ty = offsetY + tile.displayY * cellSize + cellSize / 2;
                        const tileSize = (cellSize - 12) * tile.scale;
                        const halfSize = tileSize / 2;

                        ctx.save();
                        // Glow
                        const glowAlpha = tile.justMerged ? 0.7 : 0.3;
                        ctx.shadowColor = colors.glow;
                        ctx.shadowBlur = tile.justMerged ? 22 : 10;
                        ctx.globalAlpha = glowAlpha;
                        ctx.fillStyle = colors.glow;
                        ctx.beginPath();
                        ctx.roundRect(tx - halfSize, ty - halfSize, tileSize, tileSize, 8);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.globalAlpha = 1;

                        // Tile body
                        const bodyGrad = ctx.createLinearGradient(tx - halfSize, ty - halfSize, tx - halfSize, ty + halfSize);
                        bodyGrad.addColorStop(0, colors.bg);
                        bodyGrad.addColorStop(1,
                            `rgba(${parseInt(colors.bg.slice(1,3),16)},${parseInt(colors.bg.slice(3,5),16)},${parseInt(colors.bg.slice(5,7),16)},0.7)`
                            );
                        ctx.fillStyle = bodyGrad;
                        ctx.beginPath();
                        ctx.roundRect(tx - halfSize, ty - halfSize, tileSize, tileSize, 8);
                        ctx.fill();

                        // Border
                        ctx.strokeStyle = colors.glow;
                        ctx.lineWidth = 1.5;
                        ctx.globalAlpha = 0.6;
                        ctx.stroke();
                        ctx.globalAlpha = 1;

                        // Value text
                        const fontSize = tile.value >= 100 ? 22 : tile.value >= 30 ? 20 : tile.value >= 10 ? 18 : 17;
                        ctx.fillStyle = colors.text;
                        ctx.font = `bold ${fontSize}px "Segoe UI", system-ui, sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(tile.value, tx, ty);

                        // Shine
                        const shineGrad = ctx.createLinearGradient(tx - halfSize, ty - halfSize, tx - halfSize, ty);
                        shineGrad.addColorStop(0, 'rgba(255,255,255,0.18)');
                        shineGrad.addColorStop(1, 'rgba(255,255,255,0)');
                        ctx.fillStyle = shineGrad;
                        ctx.beginPath();
                        ctx.roundRect(tx - halfSize + 2, ty - halfSize + 2, tileSize - 4, tileSize / 2 - 2, [6, 6, 0, 0]);
                        ctx.fill();

                        ctx.restore();
                    }
                }

                drawOverlays() {
                    // Pause overlay
                    if (this.state === 'PAUSED') {
                        ctx.fillStyle = 'rgba(0,0,0,0.7)';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 36px "Segoe UI", system-ui, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2 - 40);
                        ctx.font = '16px "Segoe UI", system-ui, sans-serif';
                        ctx.fillText('Press P or tap Resume to continue', canvas.width / 2, canvas.height / 2 + 10);

                        const btnX = canvas.width / 2 - 70;
                        const btnY = canvas.height / 2 + 40;
                        this.buttons = [
                            { x: btnX, y: btnY, w: 140, h: 44, action: 'resume' },
                            { x: btnX, y: btnY + 55, w: 140, h: 44, action: 'restart' },
                            { x: btnX, y: btnY + 110, w: 140, h: 44, action: 'menu' },
                        ];
                        this.drawButton(btnX, btnY, 140, 44, 'Resume', 'resume');
                        this.drawButton(btnX, btnY + 55, 140, 44, 'Restart', 'restart');
                        this.drawButton(btnX, btnY + 110, 140, 44, 'Menu', 'menu');
                    }

                    // Level complete overlay
                    if (this.state === 'LEVEL_COMPLETE') {
                        ctx.fillStyle = 'rgba(0,0,0,0.65)';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        const lvl = this.currentLevel;
                        ctx.fillStyle = '#ffd740';
                        ctx.font = 'bold 32px "Segoe UI", system-ui, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('Level Complete!', canvas.width / 2, canvas.height / 2 - 50);
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 18px "Segoe UI", system-ui, sans-serif';
                        ctx.fillText(`Target ${lvl?.target || '?'} reached!`, canvas.width / 2, canvas.height / 2 - 5);
                        ctx.fillStyle = '#ccccdd';
                        ctx.font = '14px "Segoe UI", system-ui, sans-serif';
                        const nextInfo = this.levelIndex + 1 < LEVELS.length ?
                            `Next: Level ${LEVELS[this.levelIndex + 1].id} - ${LEVELS[this.levelIndex + 1].name}` :
                            'Final level ahead!';
                        ctx.fillText(nextInfo, canvas.width / 2, canvas.height / 2 + 25);

                        const btnX = canvas.width / 2 - 70;
                        const btnY = canvas.height / 2 + 50;
                        this.buttons = [{ x: btnX, y: btnY, w: 140, h: 44, action: 'next_level' }];
                        this.drawButton(btnX, btnY, 140, 44, 'Continue', 'next_level');

                        // Auto-advance after delay
                        if (this.levelCompleteTimer > 2.5 && this.levelIndex + 1 < LEVELS.length) {
                            this.advanceLevel();
                        }
                    }

                    // Game over overlay
                    if (this.state === 'GAME_OVER') {
                        ctx.fillStyle = 'rgba(0,0,0,0.7)';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.fillStyle = '#ff5555';
                        ctx.font = 'bold 32px "Segoe UI", system-ui, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 45);
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 20px "Segoe UI", system-ui, sans-serif';
                        ctx.fillText(`Score: ${this.score}`, canvas.width / 2, canvas.height / 2);
                        if (this.score >= this.highScore && this.score > 0) {
                            ctx.fillStyle = '#ffd740';
                            ctx.font = 'bold 15px "Segoe UI", system-ui, sans-serif';
                            ctx.fillText('★ New High Score! ★', canvas.width / 2, canvas.height / 2 + 30);
                        }
                        const btnX = canvas.width / 2 - 70;
                        const btnY = canvas.height / 2 + 55;
                        this.buttons = [
                            { x: btnX, y: btnY, w: 140, h: 44, action: 'restart' },
                            { x: btnX, y: btnY + 55, w: 140, h: 44, action: 'menu' },
                        ];
                        this.drawButton(btnX, btnY, 140, 44, 'Try Again', 'restart');
                        this.drawButton(btnX, btnY + 55, 140, 44, 'Menu', 'menu');
                    }

                    // Win overlay
                    if (this.state === 'WIN') {
                        ctx.fillStyle = 'rgba(0,0,0,0.7)';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        // Celebration particles continue
                        ctx.fillStyle = '#ffd740';
                        ctx.font = 'bold 38px "Segoe UI", system-ui, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.shadowColor = '#ffd740';
                        ctx.shadowBlur = 25;
                        ctx.fillText('🎉 YOU WIN! 🎉', canvas.width / 2, canvas.height / 2 - 50);
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 22px "Segoe UI", system-ui, sans-serif';
                        ctx.fillText(`Final Score: ${this.score}`, canvas.width / 2, canvas.height / 2);
                        ctx.fillStyle = '#ffd740';
                        ctx.font = 'bold 16px "Segoe UI", system-ui, sans-serif';
                        ctx.fillText('You reached 105!', canvas.width / 2, canvas.height / 2 + 35);
                        const btnX = canvas.width / 2 - 70;
                        const btnY = canvas.height / 2 + 65;
                        this.buttons = [
                            { x: btnX, y: btnY, w: 140, h: 44, action: 'restart' },
                            { x: btnX, y: btnY + 55, w: 140, h: 44, action: 'menu' },
                        ];
                        this.drawButton(btnX, btnY, 140, 44, 'Play Again', 'restart');
                        this.drawButton(btnX, btnY + 55, 140, 44, 'Menu', 'menu');
                    }
                }

                drawButton(x, y, w, h, text, action) {
                    const isHovered = this.hoveredButton && this.hoveredButton.action === action;
                    const grad = ctx.createLinearGradient(x, y, x, y + h);
                    if (action === 'menu') {
                        grad.addColorStop(0, isHovered ? '#555577' : '#3a3a55');
                        grad.addColorStop(1, isHovered ? '#3a3a55' : '#252540');
                    } else {
                        grad.addColorStop(0, isHovered ? '#ff9a60' : '#ff7040');
                        grad.addColorStop(1, isHovered ? '#e05080' : '#c04060');
                    }
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.roundRect(x, y, w, h, 22);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 16px "Segoe UI", system-ui, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(text, x + w / 2, y + h / 2);
                }

                // Main loop
                run() {
                    let lastTime = performance.now();
                    const loop = (time) => {
                        const dt = (time - lastTime) / 1000;
                        lastTime = time;
                        this.update(dt);
                        this.draw();
                        requestAnimationFrame(loop);
                    };
                    requestAnimationFrame(loop);
                }
            }

            // --- Start ---
            const game = new Game();
            game.run();
        })();
    </script>
</body>
</html>
