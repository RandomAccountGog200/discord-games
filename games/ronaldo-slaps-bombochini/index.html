<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ronaldo Slaps Bombochini ⚾</title>
    <style>
        :root {
            --bg: #1a1a2e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        canvas {
            display: block;
            border-radius: 12px;
            box-shadow: 0 0 60px rgba(255, 180, 50, 0.3), 0 0 120px rgba(255, 100, 30, 0.2);
            max-width: 100vw;
            max-height: 100vh;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('game');
            const ctx = canvas.getContext('2d');

            // -- Responsive canvas --
            const W = 500;
            const H = 750;
            let scale = 1;

            function resize() {
                const maxW = Math.min(window.innerWidth * 0.95, 500);
                const maxH = Math.min(window.innerHeight * 0.95, 750);
                scale = Math.min(maxW / W, maxH / H);
                canvas.width = W * scale;
                canvas.height = H * scale;
                canvas.style.width = (W * scale) + 'px';
                canvas.style.height = (H * scale) + 'px';
            }
            window.addEventListener('resize', resize);
            resize();

            // -- Input handling --
            let inputThisFrame = false;
            let inputPosition = { x: W / 2, y: H / 2 };

            function getInputPos(e) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (e.clientX - rect.left) / scale,
                    y: (e.clientY - rect.top) / scale
                };
            }

            canvas.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                inputThisFrame = true;
                inputPosition = getInputPos(e);
            });
            canvas.addEventListener('pointerup', (e) => {
                e.preventDefault();
            });
            canvas.addEventListener('pointermove', (e) => {
                e.preventDefault();
            });
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'KeyJ' || e.code === 'Enter') {
                    e.preventDefault();
                    inputThisFrame = true;
                    inputPosition = { x: W / 2, y: H / 2 };
                }
            });

            // -- Audio system --
            let audioCtx = null;

            function initAudio() {
                if (!audioCtx) {
                    try {
                        audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    } catch (e) {
                        audioCtx = null;
                    }
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            function playSound(freq, type, duration, vol = 0.15, noiseAmount = 0) {
                if (!audioCtx) return;
                try {
                    const t = audioCtx.currentTime;
                    const gain = audioCtx.createGain();
                    gain.gain.setValueAtTime(vol, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                    gain.connect(audioCtx.destination);

                    if (noiseAmount > 0) {
                        const bufferSize = Math.floor(audioCtx.sampleRate * duration);
                        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                        const data = buffer.getChannelData(0);
                        for (let i = 0; i < bufferSize; i++) {
                            data[i] = (Math.random() * 2 - 1) * noiseAmount;
                        }
                        const noise = audioCtx.createBufferSource();
                        noise.buffer = buffer;
                        const bandpass = audioCtx.createBiquadFilter();
                        bandpass.type = 'bandpass';
                        bandpass.frequency.setValueAtTime(freq || 800, t);
                        bandpass.Q.setValueAtTime(1.5, t);
                        noise.connect(bandpass);
                        bandpass.connect(gain);
                        noise.start(t);
                        noise.stop(t + duration);
                    }

                    if (type && noiseAmount < 1) {
                        const osc = audioCtx.createOscillator();
                        osc.type = type;
                        osc.frequency.setValueAtTime(freq, t);
                        osc.frequency.exponentialRampToValueAtTime(freq * 0.3, t + duration);
                        osc.connect(gain);
                        osc.start(t);
                        osc.stop(t + duration);
                    }
                } catch (e) {
                    // Silent fail
                }
            }

            function sfxSlap() { playSound(300, 'sawtooth', 0.2, 0.2, 0.6); }

            function sfxPerfect() {
                playSound(600, 'square', 0.15, 0.25, 0.4);
                setTimeout(() => playSound(900, 'triangle', 0.1, 0.2, 0.3), 80);
            }

            function sfxMiss() { playSound(80, 'sine', 0.35, 0.08, 0.15); }

            function sfxCombo() {
                playSound(500, 'square', 0.1, 0.2, 0.2);
                setTimeout(() => playSound(700, 'triangle', 0.12, 0.2, 0.2), 70);
                setTimeout(() => playSound(1000, 'sine', 0.1, 0.25, 0.1), 140);
            }

            function sfxGameOver() {
                playSound(200, 'sawtooth', 0.3, 0.15, 0.3);
                setTimeout(() => playSound(100, 'sine', 0.5, 0.1, 0.2), 200);
            }

            function sfxClick() { playSound(1000, 'sine', 0.06, 0.03, 0); }

            // -- Game state --
            const STATE = { TITLE: 0, PLAYING: 1, GAMEOVER: 2 };
            let gameState = STATE.TITLE;
            let score = 0;
            let lives = 5;
            let combo = 0;
            let maxCombo = 0;
            let difficulty = 1;
            let gameTime = 0;
            let shakeAmount = 0;

            // -- Ronaldo --
            const ronaldoX = W / 2;
            const ronaldoY = H * 0.78;
            const batPivotX = ronaldoX - 30;
            const batPivotY = ronaldoY - 75;
            const batLength = 140;
            let batAngle = -0.9; // Rest angle (radians, negative = behind)
            const batRestAngle = -0.9;
            const batEndAngle = 0.7;
            let batSwinging = false;
            let swingProgress = 0;
            let swingStartTime = 0;
            const swingDuration = 0.22; // seconds
            let batHitRegistered = false;
            let batTrailParticles = [];

            // -- Bombochini --
            let bombo = null;
            const spawnPositions = [
                { x: W * 0.25, y: H * 0.28 },
                { x: W * 0.50, y: H * 0.20 },
                { x: W * 0.75, y: H * 0.28 },
                { x: W * 0.38, y: H * 0.40 },
                { x: W * 0.62, y: H * 0.40 },
                { x: W * 0.50, y: H * 0.33 },
            ];
            let bomboVisibleTimer = 0;
            let bomboVisibleDuration = 1.8;
            let bomboSpawnCooldown = 0;
            let bomboScale = 1;
            let bomboSlapFlash = 0;
            let bomboJustSlapped = false;

            // -- Particles --
            let particles = [];
            let floatingTexts = [];

            // -- Practice swings on title --
            let titlePracticeTimer = 0;
            let titleAutoSwing = false;
            let titleSwingProgress = 0;
            let titleSwingStart = 0;

            function spawnBombochini() {
                const pos = spawnPositions[Math.floor(Math.random() * spawnPositions.length)];
                bombo = {
                    x: pos.x,
                    y: pos.y,
                    baseX: pos.x,
                    baseY: pos.y,
                    state: 'appearing',
                    scale: 0,
                    targetScale: 1,
                    bobOffset: 0,
                    bobSpeed: 2 + Math.random() * 3,
                    slapMark: 0,
                    eyeBulge: 0,
                };
                bomboVisibleTimer = bomboVisibleDuration;
                bomboScale = 0;
                bomboSlapFlash = 0;
                bomboJustSlapped = false;
            }

            function spawnParticles(x, y, count, color1, color2, speed = 3) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const spd = speed * (0.5 + Math.random());
                    particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * spd,
                        vy: Math.sin(angle) * spd - Math.random() * 4,
                        life: 0.4 + Math.random() * 0.6,
                        maxLife: 0.4 + Math.random() * 0.6,
                        color: Math.random() < 0.5 ? color1 : color2,
                        size: 2 + Math.random() * 5,
                    });
                }
            }

            function spawnFloatingText(x, y, text, color = '#FFD700') {
                floatingTexts.push({
                    x: x,
                    y: y,
                    text: text,
                    life: 0.9,
                    maxLife: 0.9,
                    color: color,
                    vy: -3.5,
                });
            }

            function resetGame() {
                score = 0;
                lives = 5;
                combo = 0;
                maxCombo = 0;
                difficulty = 1;
                gameTime = 0;
                shakeAmount = 0;
                bombo = null;
                bomboVisibleDuration = 1.8;
                bomboSpawnCooldown = 0.6;
                batAngle = batRestAngle;
                batSwinging = false;
                swingProgress = 0;
                batHitRegistered = false;
                particles = [];
                floatingTexts = [];
                batTrailParticles = [];
                bomboJustSlapped = false;
            }

            function startGame() {
                initAudio();
                resetGame();
                gameState = STATE.PLAYING;
                sfxClick();
            }

            function endGame() {
                gameState = STATE.GAMEOVER;
                sfxGameOver();
                if (bombo && bombo.state === 'visible') {
                    spawnParticles(bombo.x, bombo.y, 20, '#ff4444', '#ff8888', 2);
                }
            }

            // -- Drawing functions --
            function drawSky() {
                const grad = ctx.createLinearGradient(0, 0, 0, H * 0.55);
                grad.addColorStop(0, '#4a90d9');
                grad.addColorStop(0.5, '#87CEEB');
                grad.addColorStop(1, '#b8e4f0');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H * 0.58);

                // Clouds
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                drawCloud(60, 50, 0.8);
                drawCloud(320, 30, 0.6);
                drawCloud(200, 90, 0.5);
                drawCloud(400, 65, 0.7);
            }

            function drawCloud(cx, cy, s) {
                ctx.beginPath();
                ctx.arc(cx, cy, 25 * s, 0, Math.PI * 2);
                ctx.arc(cx + 22 * s, cy - 10 * s, 20 * s, 0, Math.PI * 2);
                ctx.arc(cx + 40 * s, cy, 22 * s, 0, Math.PI * 2);
                ctx.arc(cx + 20 * s, cy + 5 * s, 18 * s, 0, Math.PI * 2);
                ctx.fill();
            }

            function drawField() {
                // Outfield grass
                const grassGrad = ctx.createLinearGradient(0, H * 0.5, 0, H);
                grassGrad.addColorStop(0, '#5a9e3f');
                grassGrad.addColorStop(0.3, '#4a8a30');
                grassGrad.addColorStop(1, '#3d6e28');
                ctx.fillStyle = grassGrad;
                ctx.fillRect(0, H * 0.5, W, H * 0.5);

                // Infield dirt
                ctx.fillStyle = '#c4956a';
                ctx.beginPath();
                ctx.moveTo(W / 2, H * 0.52);
                ctx.lineTo(W * 0.15, H * 0.75);
                ctx.lineTo(W / 2, H * 0.95);
                ctx.lineTo(W * 0.85, H * 0.75);
                ctx.closePath();
                ctx.fill();

                // Infield lighter dirt
                ctx.fillStyle = '#d4a878';
                ctx.beginPath();
                ctx.moveTo(W / 2, H * 0.56);
                ctx.lineTo(W * 0.22, H * 0.76);
                ctx.lineTo(W / 2, H * 0.9);
                ctx.lineTo(W * 0.78, H * 0.76);
                ctx.closePath();
                ctx.fill();

                // Foul lines
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.moveTo(W / 2, H * 0.95);
                ctx.lineTo(W * 0.15, H * 0.75);
                ctx.moveTo(W / 2, H * 0.95);
                ctx.lineTo(W * 0.85, H * 0.75);
                ctx.stroke();

                // Home plate area
                ctx.fillStyle = '#f5f5f5';
                ctx.beginPath();
                ctx.moveTo(W / 2, H * 0.91);
                ctx.lineTo(W / 2 - 18, H * 0.85);
                ctx.lineTo(W / 2, H * 0.83);
                ctx.lineTo(W / 2 + 18, H * 0.85);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Batter's box lines
                ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([6, 4]);
                ctx.strokeRect(W / 2 - 30, H * 0.82, 60, 50);
                ctx.setLineDash([]);

                // Grass texture dots
                ctx.fillStyle = 'rgba(100,180,60,0.3)';
                for (let i = 0; i < 60; i++) {
                    const gx = Math.random() * W;
                    const gy = H * 0.5 + Math.random() * H * 0.5;
                    if (gy > H * 0.52 || Math.abs(gx - W / 2) > 50) {
                        ctx.beginPath();
                        ctx.arc(gx, gy, 1.5 + Math.random() * 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            function drawFence() {
                // Outfield fence
                ctx.fillStyle = '#2c5f8a';
                ctx.fillRect(0, H * 0.48, W, 18);
                ctx.fillStyle = '#1e4a6e';
                for (let fx = 0; fx < W; fx += 25) {
                    ctx.fillRect(fx, H * 0.48, 12, 18);
                }
                ctx.fillStyle = '#3a7ab5';
                ctx.fillRect(0, H * 0.48, W, 4);

                // Fence posts
                for (let fx = 0; fx < W; fx += 50) {
                    ctx.fillStyle = '#444';
                    ctx.fillRect(fx - 2, H * 0.46, 4, 30);
                }
            }

            function drawRonaldo() {
                const rx = ronaldoX;
                const ry = ronaldoY;

                ctx.save();

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(rx, ry + 55, 40, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                // Legs
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(rx - 18, ry + 5, 16, 48);
                ctx.fillRect(rx + 2, ry + 5, 16, 48);
                // Socks
                ctx.fillStyle = '#cc0000';
                ctx.fillRect(rx - 18, ry + 35, 16, 18);
                ctx.fillRect(rx + 2, ry + 35, 16, 18);
                // Cleats
                ctx.fillStyle = '#222';
                ctx.fillRect(rx - 20, ry + 48, 20, 10);
                ctx.fillRect(rx, ry + 48, 20, 10);
                ctx.fillStyle = '#333';
                ctx.fillRect(rx - 20, ry + 50, 20, 10);
                ctx.fillRect(rx, ry + 50, 20, 10);

                // Torso / Jersey
                ctx.fillStyle = '#cc0000';
                ctx.beginPath();
                ctx.roundRect(rx - 24, ry - 40, 48, 50, 10);
                ctx.fill();
                // Jersey stripe
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(rx - 24, ry - 25, 48, 6);
                // Number 7
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 22px "Segoe UI", system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('7', rx, ry - 10);
                // Jersey collar
                ctx.fillStyle = '#990000';
                ctx.fillRect(rx - 20, ry - 42, 40, 6);

                // Arms
                // Left arm (behind, holding bat)
                ctx.fillStyle = '#e8c9a0';
                ctx.beginPath();
                ctx.roundRect(rx - 28, ry - 38, 12, 30, 6);
                ctx.fill();
                // Right arm (front)
                ctx.fillStyle = '#e8c9a0';
                ctx.beginPath();
                ctx.roundRect(rx - 10, ry - 36, 12, 28, 6);
                ctx.fill();

                // Hands (at bat pivot)
                ctx.fillStyle = '#e8c9a0';
                ctx.beginPath();
                ctx.arc(batPivotX, batPivotY, 9, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#c9a882';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Head
                ctx.fillStyle = '#e8c9a0';
                ctx.beginPath();
                ctx.arc(rx - 2, ry - 52, 18, 0, Math.PI * 2);
                ctx.fill();

                // Ears
                ctx.fillStyle = '#e8c9a0';
                ctx.beginPath();
                ctx.arc(rx - 18, ry - 50, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(rx + 14, ry - 50, 6, 0, Math.PI * 2);
                ctx.fill();

                // Hair (Ronaldo style - swept back with texture)
                ctx.fillStyle = '#1a1a1a';
                ctx.beginPath();
                ctx.arc(rx - 2, ry - 58, 19, Math.PI, Math.PI * 2.4);
                ctx.arc(rx + 5, ry - 58, 18, Math.PI * 0.7, Math.PI * 1.9);
                ctx.fill();
                // Hair spikes
                ctx.fillStyle = '#111';
                ctx.beginPath();
                ctx.moveTo(rx - 12, ry - 68);
                ctx.lineTo(rx - 6, ry - 74);
                ctx.lineTo(rx, ry - 67);
                ctx.lineTo(rx + 8, ry - 76);
                ctx.lineTo(rx + 14, ry - 68);
                ctx.lineTo(rx + 18, ry - 72);
                ctx.lineTo(rx + 20, ry - 64);
                ctx.closePath();
                ctx.fill();

                // Eyes
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(rx - 7, ry - 56, 5.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(rx + 7, ry - 56, 5.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(rx - 5, ry - 55, 2.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(rx + 9, ry - 55, 2.8, 0, Math.PI * 2);
                ctx.fill();

                // Eyebrows (determined)
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(rx - 13, ry - 62);
                ctx.lineTo(rx - 1, ry - 59);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(rx + 1, ry - 59);
                ctx.lineTo(rx + 13, ry - 62);
                ctx.stroke();

                // Mouth (slight smirk)
                ctx.strokeStyle = '#a07060';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(rx + 2, ry - 44, 7, 0.1, Math.PI * 0.7);
                ctx.stroke();

                // Baseball cap/helmet (since getting ready for baseball)
                ctx.fillStyle = '#1a3a6e';
                ctx.beginPath();
                ctx.arc(rx - 2, ry - 56, 20, Math.PI * 0.85, Math.PI * 2.15);
                ctx.fill();
                ctx.fillStyle = '#15305a';
                ctx.fillRect(rx - 20, ry - 66, 40, 8);
                // Cap brim
                ctx.fillStyle = '#1a3a6e';
                ctx.beginPath();
                ctx.ellipse(rx + 8, ry - 64, 22, 7, -0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#15305a';
                ctx.beginPath();
                ctx.ellipse(rx + 8, ry - 64, 22, 7, -0.3, -0.1, Math.PI + 0.1);
                ctx.fill();

                ctx.restore();
            }

            function drawBat() {
                ctx.save();
                const px = batPivotX;
                const py = batPivotY;
                const angle = batAngle;

                // Bat shadow
                ctx.strokeStyle = 'rgba(0,0,0,0.25)';
                ctx.lineWidth = 12;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(px + 3, py + 3);
                ctx.lineTo(px + 3 + Math.sin(angle) * batLength, py + 3 - Math.cos(angle) * batLength);
                ctx.stroke();

                // Bat handle
                const handleLen = batLength * 0.35;
                const barrelLen = batLength * 0.65;
                const handleEndX = px + Math.sin(angle) * handleLen;
                const handleEndY = py - Math.cos(angle) * handleLen;
                const barrelEndX = px + Math.sin(angle) * batLength;
                const barrelEndY = py - Math.cos(angle) * batLength;

                // Handle (thin)
                ctx.strokeStyle = '#5c3a1e';
                ctx.lineWidth = 7;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(handleEndX, handleEndY);
                ctx.stroke();

                // Handle wrap
                ctx.strokeStyle = '#8b5a2b';
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(handleEndX, handleEndY);
                ctx.stroke();
                ctx.strokeStyle = '#3d2010';
                ctx.lineWidth = 7;
                ctx.setLineDash([4, 6]);
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(handleEndX, handleEndY);
                ctx.stroke();
                ctx.setLineDash([]);

                // Barrel (thick)
                const midX = (handleEndX + barrelEndX) / 2;
                const midY = (handleEndY + barrelEndY) / 2;
                ctx.strokeStyle = '#d4a060';
                ctx.lineWidth = 16;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(handleEndX, handleEndY);
                ctx.lineTo(barrelEndX, barrelEndY);
                ctx.stroke();
                // Barrel highlight
                ctx.strokeStyle = '#e8c080';
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.moveTo(midX - 2, midY - 2);
                ctx.lineTo(barrelEndX - 2, barrelEndY - 2);
                ctx.stroke();
                // Barrel tip
                ctx.fillStyle = '#f0d8a0';
                ctx.beginPath();
                ctx.arc(barrelEndX, barrelEndY, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#e0c080';
                ctx.beginPath();
                ctx.arc(barrelEndX, barrelEndY, 4, 0, Math.PI * 2);
                ctx.fill();

                // Knob at handle base
                ctx.fillStyle = '#3d2010';
                ctx.beginPath();
                ctx.arc(px, py, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            function getBatTipPos() {
                return {
                    x: batPivotX + Math.sin(batAngle) * batLength,
                    y: batPivotY - Math.cos(batAngle) * batLength
                };
            }

            function drawBombochini() {
                if (!bombo || bombo.scale <= 0.01) return;
                const bx = bombo.x + bombo.bobOffset;
                const by = bombo.y;
                const s = bombo.scale;

                ctx.save();
                ctx.translate(bx, by);
                ctx.scale(s, s);

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.beginPath();
                ctx.ellipse(3, 52, 28, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // Body (round, plump)
                const bodyGrad = ctx.createRadialGradient(-5, -10, 5, 0, 0, 35);
                bodyGrad.addColorStop(0, '#ffe4c4');
                bodyGrad.addColorStop(0.6, '#f5c6a0');
                bodyGrad.addColorStop(1, '#d4956b');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.arc(0, 8, 35, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#c08060';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Belly
                ctx.fillStyle = '#ffe8d0';
                ctx.beginPath();
                ctx.arc(0, 12, 24, 0, Math.PI * 2);
                ctx.fill();

                // Little legs
                ctx.fillStyle = '#333';
                ctx.fillRect(-14, 38, 10, 16);
                ctx.fillRect(4, 38, 10, 16);
                ctx.fillStyle = '#222';
                ctx.fillRect(-16, 50, 14, 8);
                ctx.fillRect(2, 50, 14, 8);

                // Arms
                ctx.fillStyle = '#e8c9a0';
                ctx.beginPath();
                ctx.roundRect(-38, -5, 14, 20, 7);
                ctx.fill();
                ctx.beginPath();
                ctx.roundRect(24, -5, 14, 20, 7);
                ctx.fill();
                // Little hands
                ctx.fillStyle = '#e8c9a0';
                ctx.beginPath();
                ctx.arc(-42, 12, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(42, 12, 8, 0, Math.PI * 2);
                ctx.fill();

                // Head
                const headGrad = ctx.createRadialGradient(-3, -20, 3, 0, -18, 24);
                headGrad.addColorStop(0, '#ffe8d0');
                headGrad.addColorStop(1, '#e8c0a0');
                ctx.fillStyle = headGrad;
                ctx.beginPath();
                ctx.arc(0, -16, 24, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#c09070';
                ctx.lineWidth = 1.8;
                ctx.stroke();

                // Ears (big funny ears)
                ctx.fillStyle = '#e8c0a0';
                ctx.beginPath();
                ctx.arc(-22, -18, 9, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(22, -18, 9, 0, Math.PI * 2);
                ctx.fill();

                // Eyes (googly)
                const eyeBulge = bombo.eyeBulge || 0;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(-9, -20, 8 + eyeBulge * 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(9, -20, 8 + eyeBulge * 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#111';
                ctx.beginPath();
                ctx.arc(-7, -19, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(11, -19, 4, 0, Math.PI * 2);
                ctx.fill();
                // Eye shine
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(-6, -21, 1.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(12, -21, 1.8, 0, Math.PI * 2);
                ctx.fill();

                // Big nose
                ctx.fillStyle = '#e87050';
                ctx.beginPath();
                ctx.arc(1, -10, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#f09070';
                ctx.beginPath();
                ctx.arc(-1, -11, 3, 0, Math.PI * 2);
                ctx.fill();

                // Mouth
                ctx.strokeStyle = '#a05040';
                ctx.lineWidth = 2;
                ctx.beginPath();
                if (bombo.slapMark > 0) {
                    // Distorted mouth after slap
                    ctx.arc(2, -2, 10, -0.3, Math.PI * 1.2);
                } else {
                    ctx.arc(1, -2, 8, 0.1, Math.PI * 0.9);
                }
                ctx.stroke();

                // Cheeks
                ctx.fillStyle = 'rgba(255,150,130,0.4)';
                ctx.beginPath();
                ctx.arc(-15, -10, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(15, -10, 6, 0, Math.PI * 2);
                ctx.fill();

                // Little hat
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath();
                ctx.arc(0, -35, 18, Math.PI, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#c0392b';
                ctx.fillRect(-20, -37, 40, 6);
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath();
                ctx.arc(0, -37, 10, 0, Math.PI * 2);
                ctx.fill();

                // Slap mark effect
                if (bombo.slapMark > 0) {
                    ctx.fillStyle = `rgba(255,60,30,${bombo.slapMark * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(3, -5, 14, 0, Math.PI * 2);
                    ctx.fill();
                    // Stars around head
                    ctx.fillStyle = '#FFD700';
                    for (let si = 0; si < 5; si++) {
                        const sa = (si / 5) * Math.PI * 2 + bombo.slapMark * 4;
                        const sr = 30 + bombo.slapMark * 15;
                        const sx = Math.cos(sa) * sr;
                        const sy = Math.sin(sa) * sr - 15;
                        drawSmallStar(sx, sy, 4 + bombo.slapMark * 3);
                    }
                }

                ctx.restore();
            }

            function drawSmallStar(x, y, size) {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (i * Math.PI * 2) / 5 - Math.PI / 2;
                    const outerR = size;
                    const innerR = size * 0.4;
                    const ox = x + Math.cos(angle) * outerR;
                    const oy = y + Math.sin(angle) * outerR;
                    if (i === 0) ctx.moveTo(ox, oy);
                    else ctx.lineTo(ox, oy);
                    const ix = x + Math.cos(angle + Math.PI / 5) * innerR;
                    const iy = y + Math.sin(angle + Math.PI / 5) * innerR;
                    ctx.lineTo(ix, iy);
                }
                ctx.closePath();
                ctx.fill();
            }

            function drawParticles() {
                for (const p of particles) {
                    const alpha = p.life / p.maxLife;
                    ctx.fillStyle = p.color.replace(')', `,${alpha})`).replace('rgb',
                        'rgba');
                    if (p.color.startsWith('#')) {
                        ctx.globalAlpha = alpha;
                        ctx.fillStyle = p.color;
                    }
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            function drawFloatingTexts() {
                for (const ft of floatingTexts) {
                    const alpha = ft.life / ft.maxLife;
                    const scale = 1 + (1 - alpha) * 0.5;
                    ctx.fillStyle = ft.color.replace(')', `,${alpha})`).replace('rgb',
                        'rgba');
                    if (ft.color.startsWith('#')) {
                        ctx.globalAlpha = alpha;
                        ctx.fillStyle = ft.color;
                    }
                    ctx.font = `bold ${Math.floor(18 * scale)}px "Segoe UI", system-ui, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText(ft.text, ft.x, ft.y);
                }
                ctx.globalAlpha = 1;
            }

            function drawHUD() {
                // Score
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 28px "Segoe UI", system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 6;
                ctx.fillText(`Score: ${score}`, W / 2, 42);
                ctx.shadowBlur = 0;

                // Lives
                ctx.textAlign = 'right';
                ctx.font = '22px "Segoe UI", system-ui, sans-serif';
                let heartsStr = '';
                for (let i = 0; i < lives; i++) heartsStr += '❤️';
                for (let i = lives; i < 5; i++) heartsStr += '🖤';
                ctx.fillText(heartsStr, W - 15, 75);

                // Combo
                if (combo >= 2) {
                    ctx.textAlign = 'left';
                    ctx.fillStyle = '#FFD700';
                    ctx.font = 'bold 20px "Segoe UI", system-ui, sans-serif';
                    ctx.fillText(`🔥 Combo x${combo}`, 15, 75);
                }

                // Difficulty indicator
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = '12px "Segoe UI", system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`Speed: ${difficulty}x`, W / 2, 90);
            }

            function drawTitleScreen() {
                // Dim overlay
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.fillRect(0, 0, W, H);

                // Title card
                const cardX = W / 2 - 180;
                const cardY = H * 0.22;
                const cardW = 360;
                const cardH = 240;

                ctx.fillStyle = 'rgba(20,20,40,0.85)';
                ctx.beginPath();
                ctx.roundRect(cardX, cardY, cardW, cardH, 20);
                ctx.fill();
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Title
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 26px "Segoe UI", system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('⚾ RONALDO SLAPS', W / 2, cardY + 50);
                ctx.fillText('BOMBOCHINI ⚾', W / 2, cardY + 82);

                // Subtitle
                ctx.fillStyle = '#fff';
                ctx.font = '15px "Segoe UI", system-ui, sans-serif';
                ctx.fillText('Getting ready for baseball...', W / 2, cardY + 115);
                ctx.fillText('but Bombochini shows up!', W / 2, cardY + 138);

                // Instructions
                ctx.fillStyle = '#ccc';
                ctx.font = '16px "Segoe UI", system-ui, sans-serif';
                ctx.fillText('🖱️ Tap or Click to swing the bat!', W / 2, cardY + 180);
                ctx.fillText('⌨️ Press SPACE to swing', W / 2, cardY + 205);

                // Start prompt
                const pulse = Math.sin(Date.now() / 600) * 0.4 + 0.6;
                ctx.fillStyle = `rgba(255,215,0,${0.7 + pulse * 0.3})`;
                ctx.font = 'bold 22px "Segoe UI", system-ui, sans-serif';
                ctx.fillText('TAP TO START', W / 2, cardY + cardH + 50);

                // Little Ronaldo preview
                const previewRx = W / 2;
                const previewRy = H * 0.68;
                ctx.fillStyle = '#e8c9a0';
                ctx.beginPath();
                ctx.arc(previewRx, previewRy - 12, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1a1a1a';
                ctx.beginPath();
                ctx.arc(previewRx, previewRy - 16, 15, Math.PI, Math.PI * 2.3);
                ctx.fill();
                ctx.fillStyle = '#cc0000';
                ctx.fillRect(previewRx - 18, previewRy, 36, 30);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px "Segoe UI", system-ui, sans-serif';
                ctx.fillText('7', previewRx, previewRy + 20);
                // Mini bat
                ctx.strokeStyle = '#8b5a2b';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(previewRx - 15, previewRy - 5);
                ctx.lineTo(previewRx + 40, previewRy - 30);
                ctx.stroke();
            }

            function drawGameOverScreen() {
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(0, 0, W, H);

                const cardX = W / 2 - 170;
                const cardY = H * 0.25;
                const cardW = 340;
                const cardH = 280;

                ctx.fillStyle = 'rgba(20,20,40,0.9)';
                ctx.beginPath();
                ctx.roundRect(cardX, cardY, cardW, cardH, 20);
                ctx.fill();
                ctx.strokeStyle = '#ff5555';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = '#ff6666';
                ctx.font = 'bold 30px "Segoe UI", system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER!', W / 2, cardY + 45);

                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 22px "Segoe UI", system-ui, sans-serif';
                ctx.fillText(`Final Score: ${score}`, W / 2, cardY + 85);

                ctx.fillStyle = '#fff';
                ctx.font = '18px "Segoe UI", system-ui, sans-serif';
                ctx.fillText(`Max Combo: ${maxCombo}x`, W / 2, cardY + 115);

                // Rating
                let rating = 'Nice try! 😅';
                if (score >= 200) rating = 'Bombochini Destroyer! 💥';
                else if (score >= 120) rating = 'SIUUU! Great slapping! 🐐';
                else if (score >= 60) rating = 'Solid slaps! 👏';
                else if (score >= 20) rating = 'Getting warmed up! 🔥';
                ctx.fillStyle = '#ffcc00';
                ctx.font = 'bold 20px "Segoe UI", system-ui, sans-serif';
                ctx.fillText(rating, W / 2, cardY + 150);

                // Stats
                ctx.fillStyle = '#ccc';
                ctx.font = '14px "Segoe UI", system-ui, sans-serif';
                ctx.fillText(`Bombochinis slapped: ${score > 0 ? Math.floor(score / 10) : 0}`, W / 2, cardY + 180);
                ctx.fillText(`Difficulty reached: ${difficulty}x`, W / 2, cardY + 200);

                const pulse = Math.sin(Date.now() / 600) * 0.4 + 0.6;
                ctx.fillStyle = `rgba(255,215,0,${0.7 + pulse * 0.3})`;
                ctx.font = 'bold 20px "Segoe UI", system-ui, sans-serif';
                ctx.fillText('TAP TO PLAY AGAIN', W / 2, cardY + cardH + 45);
            }

            // -- Update functions --
            function updateBat(dt) {
                if (batSwinging) {
                    const elapsed = (performance.now() / 1000) - swingStartTime;
                    swingProgress = Math.min(elapsed / swingDuration, 1);
                    // Easing - fast through the middle
                    const eased = swingProgress < 0.5 ?
                        2 * swingProgress * swingProgress :
                        -1 + (4 - 2 * swingProgress) * swingProgress;
                    batAngle = batRestAngle + (batEndAngle - batRestAngle) * eased;

                    // Trail particles
                    if (swingProgress > 0.15 && swingProgress < 0.75) {
                        const tip = getBatTipPos();
                        if (Math.random() < 0.6) {
                            batTrailParticles.push({
                                x: tip.x + (Math.random() - 0.5) * 10,
                                y: tip.y + (Math.random() - 0.5) * 10,
                                life: 0.15,
                                maxLife: 0.15,
                                size: 2 + Math.random() * 3,
                            });
                        }
                    }

                    // Check hit during active swing phase
                    if (!batHitRegistered && swingProgress > 0.25 && swingProgress < 0.65 && bombo && bombo.state ===
                        'visible' && bombo.scale > 0.5) {
                        const tip = getBatTipPos();
                        const dx = tip.x - bombo.x;
                        const dy = tip.y - bombo.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 55) {
                            // HIT!
                            batHitRegistered = true;
                            onBombochiniSlapped();
                        }
                    }

                    if (swingProgress >= 1) {
                        batSwinging = false;
                        batAngle = batRestAngle;
                        swingProgress = 0;
                        batHitRegistered = false;
                        batTrailParticles = [];
                    }
                }

                // Update trail particles
                for (let i = batTrailParticles.length - 1; i >= 0; i--) {
                    batTrailParticles[i].life -= dt;
                    if (batTrailParticles[i].life <= 0) batTrailParticles.splice(i, 1);
                }
            }

            function onBombochiniSlapped() {
                const reactionTime = bomboVisibleDuration - bomboVisibleTimer;
                let points = 10;
                let hitQuality = '';

                if (reactionTime < 0.3) {
                    points = 50;
                    hitQuality = 'PERFECT! ⚡';
                    sfxPerfect();
                    spawnParticles(bombo.x, bombo.y, 35, '#FFD700', '#FFA500', 6);
                    shakeAmount = 8;
                } else if (reactionTime < 0.7) {
                    points = 25;
                    hitQuality = 'GREAT! 👏';
                    sfxPerfect();
                    spawnParticles(bombo.x, bombo.y, 22, '#FFD700', '#ff8844', 4);
                    shakeAmount = 4;
                } else {
                    hitQuality = 'SLAP! 💥';
                    sfxSlap();
                    spawnParticles(bombo.x, bombo.y, 15, '#ff8844', '#ffcc00', 3);
                    shakeAmount = 2;
                }

                combo++;
                if (combo > maxCombo) maxCombo = combo;
                const comboBonus = Math.min(combo - 1, 10);
                points += comboBonus * 5;
                score += points;

                if (combo >= 3 && combo % 3 === 0) {
                    sfxCombo();
                    spawnFloatingText(bombo.x, bombo.y - 30, `${combo}x COMBO! 🔥`, '#FF4500');
                }

                spawnFloatingText(bombo.x, bombo.y - 15, `+${points} ${hitQuality}`, '#FFD700');

                bombo.state = 'slapped';
                bombo.slapMark = 1;
                bombo.eyeBulge = 1;
                bomboJustSlapped = true;
                bombo.scale = 1.3;
                bombo.targetScale = 0;

                // Increase difficulty
                difficulty = 1 + Math.floor(score / 50);
                bomboVisibleDuration = Math.max(0.5, 1.8 - difficulty * 0.12);
            }

            function updateBombochini(dt) {
                if (!bombo) return;

                // Update scale
                bombo.scale += (bombo.targetScale - bombo.scale) * 8 * dt;
                if (Math.abs(bombo.scale - bombo.targetScale) < 0.01) bombo.scale = bombo.targetScale;

                // Bob animation
                bombo.bobOffset = Math.sin(gameTime * bombo.bobSpeed) * 8 * bombo.scale;

                // Slap mark fade
                if (bombo.slapMark > 0) {
                    bombo.slapMark -= dt * 3;
                    if (bombo.slapMark < 0) bombo.slapMark = 0;
                }
                if (bombo.eyeBulge > 0) {
                    bombo.eyeBulge -= dt * 5;
                    if (bombo.eyeBulge < 0) bombo.eyeBulge = 0;
                }

                if (bombo.state === 'appearing') {
                    bombo.targetScale = 1;
                    if (bombo.scale > 0.9) {
                        bombo.state = 'visible';
                        bombo.scale = 1;
                    }
                } else if (bombo.state === 'visible') {
                    bomboVisibleTimer -= dt;
                    if (bomboVisibleTimer <= 0) {
                        bombo.state = 'disappearing';
                        bombo.targetScale = 0;
                    }
                } else if (bombo.state === 'disappearing') {
                    if (bombo.scale < 0.05) {
                        bombo = null;
                        if (!bomboJustSlapped && gameState === STATE.PLAYING) {
                            // Missed!
                            lives--;
                            combo = 0;
                            sfxMiss();
                            spawnFloatingText(W / 2, H * 0.5, 'MISS! 😢', '#ff4444');
                            shakeAmount = 3;
                            if (lives <= 0) {
                                endGame();
                            }
                        }
                        bomboJustSlapped = false;
                        bomboSpawnCooldown = Math.max(0.3, 0.9 - difficulty * 0.05);
                    }
                } else if (bombo.state === 'slapped') {
                    bombo.targetScale = 0;
                    if (bombo.scale < 0.06) {
                        bombo = null;
                        bomboJustSlapped = false;
                        bomboSpawnCooldown = Math.max(0.2, 0.6 - difficulty * 0.04);
                    }
                }
            }

            function updateParticles(dt) {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 2 * dt; // Gravity
                    p.life -= dt;
                    if (p.life <= 0) particles.splice(i, 1);
                }
                for (let i = floatingTexts.length - 1; i >= 0; i--) {
                    const ft = floatingTexts[i];
                    ft.y += ft.vy;
                    ft.life -= dt;
                    if (ft.life <= 0) floatingTexts.splice(i, 1);
                }
            }

            function update(dt) {
                if (gameState !== STATE.PLAYING) {
                    // Still update particles on other screens
                    updateParticles(dt);
                    if (gameState === STATE.TITLE) {
                        titlePracticeTimer += dt;
                        if (titlePracticeTimer > 2.5 && !titleAutoSwing) {
                            titleAutoSwing = true;
                            titleSwingStart = performance.now() / 1000;
                            titleSwingProgress = 0;
                        }
                        if (titleAutoSwing) {
                            const elapsed = (performance.now() / 1000) - titleSwingStart;
                            titleSwingProgress = Math.min(elapsed / swingDuration, 1);
                            const eased = titleSwingProgress < 0.5 ?
                                2 * titleSwingProgress * titleSwingProgress :
                                -1 + (4 - 2 * titleSwingProgress) * titleSwingProgress;
                            batAngle = batRestAngle + (batEndAngle - batRestAngle) * eased;
                            if (titleSwingProgress >= 1) {
                                batAngle = batRestAngle;
                                titleAutoSwing = false;
                                titlePracticeTimer = 0;
                            }
                        }
                    }
                    return;
                }

                gameTime += dt;

                // Clamp dt
                const clampedDt = Math.min(dt, 0.1);

                // Shake decay
                if (shakeAmount > 0) shakeAmount -= clampedDt * 20;
                if (shakeAmount < 0) shakeAmount = 0;

                updateBat(clampedDt);
                updateBombochini(clampedDt);
                updateParticles(clampedDt);

                // Spawn new Bombochini
                if (!bombo) {
                    bomboSpawnCooldown -= clampedDt;
                    if (bomboSpawnCooldown <= 0) {
                        spawnBombochini();
                        batHitRegistered = false;
                    }
                }
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);

                // Apply screen shake
                let shakeX = 0;
                let shakeY = 0;
                if (shakeAmount > 0.1) {
                    shakeX = (Math.random() - 0.5) * shakeAmount * 2;
                    shakeY = (Math.random() - 0.5) * shakeAmount * 2;
                }

                ctx.save();
                ctx.translate(shakeX, shakeY);

                drawSky();
                drawFence();
                drawField();

                // Draw bat trail particles
                for (const tp of batTrailParticles) {
                    const alpha = tp.life / tp.maxLife;
                    ctx.fillStyle = `rgba(255,220,150,${alpha})`;
                    ctx.beginPath();
                    ctx.arc(tp.x, tp.y, tp.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                drawRonaldo();
                drawBat();
                drawBombochini();
                drawParticles();
                drawFloatingTexts();
                drawHUD();

                ctx.restore();

                // Overlay screens (not affected by shake)
                if (gameState === STATE.TITLE) {
                    drawTitleScreen();
                } else if (gameState === STATE.GAMEOVER) {
                    drawGameOverScreen();
                }

                // Tap indicator during gameplay
                if (gameState === STATE.PLAYING && !batSwinging && bombo && bombo.state === 'visible') {
                    const pulse = Math.sin(Date.now() / 400) * 0.3 + 0.7;
                    ctx.fillStyle = `rgba(255,255,255,${pulse})`;
                    ctx.font = 'bold 15px "Segoe UI", system-ui, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('👆 SWING NOW!', W / 2, H * 0.17);
                }
            }

            function gameLoop(timestamp) {
                const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
                lastTimestamp = timestamp;

                // Handle input
                if (inputThisFrame) {
                    inputThisFrame = false;
                    initAudio();
                    if (gameState === STATE.TITLE) {
                        startGame();
                    } else if (gameState === STATE.GAMEOVER) {
                        startGame();
                    } else if (gameState === STATE.PLAYING && !batSwinging) {
                        // Swing!
                        batSwinging = true;
                        swingStartTime = timestamp / 1000;
                        swingProgress = 0;
                        batHitRegistered = false;
                        batTrailParticles = [];
                    }
                }

                update(dt);
                draw();

                requestAnimationFrame(gameLoop);
            }

            let lastTimestamp = performance.now();

            // Initialize for title screen
            resetGame();
            gameState = STATE.TITLE;

            // Draw initial frame
            draw();

            // Start game loop
            requestAnimationFrame(gameLoop);

            // Polyfill roundRect if needed
            if (!ctx.roundRect) {
                ctx.roundRect = function(x, y, w, h, r) {
                    if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
                    ctx.beginPath();
                    ctx.moveTo(x + r.tl, y);
                    ctx.lineTo(x + w - r.tr, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
                    ctx.lineTo(x + w, y + h - r.br);
                    ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
                    ctx.lineTo(x + r.bl, y + h);
                    ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
                    ctx.lineTo(x, y + r.tl);
                    ctx.quadraticCurveTo(x, y, x + r.tl, y);
                    ctx.closePath();
                };
            }

            console.log('⚾ Ronaldo Slaps Bombochini - Ready! Tap to play!');
        })();
    </script>
