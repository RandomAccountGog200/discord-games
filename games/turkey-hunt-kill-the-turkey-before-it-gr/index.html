<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Turkey Hunt - Kill the Turkey Before It Grows!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a0a00;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        canvas {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            cursor: crosshair;
            border-radius: 4px;
            box-shadow: 0 0 40px rgba(255, 140, 0, 0.3), 0 0 80px rgba(139, 69, 19, 0.2);
            image-rendering: auto;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('game');
            const ctx = canvas.getContext('2d');

            const VW = 800;
            const VH = 600;
            const KNIFE_SPEED = 650;
            const KNIFE_COOLDOWN = 0.38;
            const PLAYER_SPEED = 280;
            const TURKEY_WANDER_SPEED = 100;
            const TURKEY_SEEK_SPEED = 160;
            const TURKEY_FLEE_SPEED = 240;
            const TURKEY_FLEE_DURATION = 1.3;
            const WORM_SPAWN_INTERVAL_BASE = 2.8;
            const MAX_WORMS_BASE = 5;
            const TURKEY_BASE_HP = 55;
            const KNIFE_DAMAGE = 28;
            const TURKEY_SCALE_PER_WORM = 0.13;
            const TURKEY_MAX_SCALE = 3.4;
            const PLAYER_Y = 490;
            const PLAYER_MIN_X = 40;
            const PLAYER_MAX_X = 760;
            const TURKEY_MIN_Y = 60;
            const TURKEY_MAX_Y = 370;
            const TURKEY_MIN_X = 60;
            const TURKEY_MAX_X = 740;

            let scale = 1;
            let offsetX = 0;
            let offsetY = 0;
            let canvasWidth = VW;
            let canvasHeight = VH;

            function resize() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                const aspect = VW / VH;
                if (w / h > aspect) {
                    canvasHeight = Math.min(h, VH * 1.5);
                    canvasWidth = canvasHeight * aspect;
                } else {
                    canvasWidth = Math.min(w, VW * 1.5);
                    canvasHeight = canvasWidth / aspect;
                }
                canvas.style.width = canvasWidth + 'px';
                canvas.style.height = canvasHeight + 'px';
                canvas.width = VW;
                canvas.height = VH;
                scale = Math.min(canvasWidth / VW, canvasHeight / VH);
                offsetX = (canvasWidth - VW * scale) / 2;
                offsetY = (canvasHeight - VH * scale) / 2;
            }
            window.addEventListener('resize', resize);
            resize();

            // ─── AUDIO ENGINE ────────────────────────────
            class AudioEngine {
                constructor() {
                    this.ctx = null;
                    this.initialized = false;
                    this.musicGain = null;
                    this.musicOscillators = [];
                    this.musicTimeout = null;
                }
                ensure() {
                    if (!this.initialized) {
                        try {
                            this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                            this.initialized = true;
                        } catch (e) {
                            return false;
                        }
                    }
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                    return true;
                }
                playTone(freq, duration, type = 'sine', vol = 0.15, rampDown = true) {
                    if (!this.ensure()) return;
                    const t = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, t);
                    gain.gain.setValueAtTime(vol, t);
                    if (rampDown) {
                        gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                    }
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(t);
                    osc.stop(t + duration);
                }
                playNoise(duration, vol = 0.08, filterFreq = 2000) {
                    if (!this.ensure()) return;
                    const t = this.ctx.currentTime;
                    const bufferSize = Math.floor(this.ctx.sampleRate * duration);
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = (Math.random() * 2 - 1);
                    }
                    const source = this.ctx.createBufferSource();
                    source.buffer = buffer;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(filterFreq, t);
                    filter.Q.setValueAtTime(2, t);
                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(vol, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                    source.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    source.start(t);
                    source.stop(t + duration);
                }
                whoosh() {
                    if (!this.ensure()) return;
                    const t = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(600, t);
                    osc.frequency.exponentialRampToValueAtTime(200, t + 0.15);
                    gain.gain.setValueAtTime(0.06, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(t);
                    osc.stop(t + 0.18);
                    this.playNoise(0.1, 0.03, 3000);
                }
                impact() {
                    if (!this.ensure()) return;
                    const t = this.ctx.currentTime;
                    this.playTone(80, 0.12, 'triangle', 0.2, true);
                    this.playTone(50, 0.18, 'sine', 0.25, true);
                    this.playNoise(0.08, 0.06, 800);
                }
                gobble() {
                    if (!this.ensure()) return;
                    const t = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, t);
                    osc.frequency.setValueAtTime(350, t + 0.04);
                    osc.frequency.setValueAtTime(280, t + 0.08);
                    osc.frequency.setValueAtTime(320, t + 0.12);
                    osc.frequency.setValueAtTime(260, t + 0.16);
                    gain.gain.setValueAtTime(0.08, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(t);
                    osc.stop(t + 0.22);
                }
                slurp() {
                    if (!this.ensure()) return;
                    const t = this.ctx.currentTime;
                    this.playTone(500, 0.08, 'sine', 0.06, true);
                    this.playTone(700, 0.06, 'sine', 0.05, true);
                    this.playNoise(0.06, 0.03, 1500);
                }
                waveComplete() {
                    if (!this.ensure()) return;
                    const notes = [523, 659, 784, 1047];
                    notes.forEach((freq, i) => {
                        setTimeout(() => {
                            this.playTone(freq, 0.2, 'triangle', 0.1, true);
                        }, i * 100);
                    });
                }
                gameOver() {
                    if (!this.ensure()) return;
                    const notes = [400, 350, 300, 200, 150];
                    notes.forEach((freq, i) => {
                        setTimeout(() => {
                            this.playTone(freq, 0.25, 'sawtooth', 0.1, true);
                        }, i * 120);
                    });
                }
                clickSound() {
                    this.playTone(800, 0.04, 'square', 0.04, true);
                }
                startMusic() {
                    if (!this.ensure() || this.musicTimeout) return;
                    this.musicGain = this.ctx.createGain();
                    this.musicGain.gain.setValueAtTime(0.025, this.ctx.currentTime);
                    this.musicGain.connect(this.ctx.destination);
                    this.playMusicLoop();
                }
                playMusicLoop() {
                    if (!this.initialized || !this.musicGain) return;
                    const notes = [262, 330, 392, 330, 294, 330, 262, 220, 262, 294, 330, 392, 440, 392, 330, 294];
                    const noteLen = 0.35;
                    const totalLen = notes.length * noteLen;
                    const playNote = (index) => {
                        if (!this.musicGain || !this.initialized) return;
                        const t = this.ctx.currentTime;
                        const osc = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(notes[index], t);
                        g.gain.setValueAtTime(0.06, t);
                        g.gain.exponentialRampToValueAtTime(0.001, t + noteLen * 0.7);
                        osc.connect(g);
                        g.connect(this.musicGain);
                        osc.start(t);
                        osc.stop(t + noteLen * 0.75);
                        this.musicOscillators.push(osc);
                        if (this.musicOscillators.length > 30) {
                            this.musicOscillators.shift();
                        }
                    };
                    const schedule = () => {
                        if (!this.musicGain) return;
                        for (let i = 0; i < notes.length; i++) {
                            const delay = i * noteLen * 1000;
                            this.musicTimeout = setTimeout(() => playNote(i), delay);
                        }
                        this.musicTimeout = setTimeout(() => {
                            if (this.musicGain) schedule();
                        }, totalLen * 1000);
                    };
                    schedule();
                }
                stopMusic() {
                    if (this.musicTimeout) {
                        clearTimeout(this.musicTimeout);
                        this.musicTimeout = null;
                    }
                    this.musicOscillators.forEach(o => {
                        try { o.stop(); } catch (e) {}
                    });
                    this.musicOscillators = [];
                    if (this.musicGain) {
                        this.musicGain.gain.setValueAtTime(0, this.ctx ? this.ctx.currentTime : 0);
                        this.musicGain = null;
                    }
                }
            }
            const audio = new AudioEngine();

            // ─── PARTICLE SYSTEM ────────────────────────
            class Particle {
                constructor(x, y, vx, vy, life, color, size = 3) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.life = life;
                    this.maxLife = life;
                    this.color = color;
                    this.size = size;
                    this.alive = true;
                }
                update(dt) {
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;
                    this.vy += 200 * dt;
                    this.life -= dt;
                    if (this.life <= 0) this.alive = false;
                }
                draw(ctx) {
                    const alpha = Math.max(0, this.life / this.maxLife);
                    const s = this.size * (0.5 + 0.5 * alpha);
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, s, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }
            class ParticleSystem {
                constructor() { this.particles = []; }
                emit(x, y, count, color, spread = 150, life = 0.6, size = 3) {
                    for (let i = 0; i < count; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = Math.random() * spread;
                        const vx = Math.cos(angle) * speed;
                        const vy = Math.sin(angle) * speed - Math.random() * 100;
                        this.particles.push(new Particle(x, y, vx, vy, life + Math.random() * 0.3, color, size + Math
                            .random() * 3));
                    }
                }
                update(dt) {
                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        this.particles[i].update(dt);
                        if (!this.particles[i].alive) this.particles.splice(i, 1);
                    }
                }
                draw(ctx) {
                    for (const p of this.particles) p.draw(ctx);
                }
                clear() { this.particles = []; }
            }

            // ─── PLAYER ──────────────────────────────────
            class Player {
                constructor() {
                    this.x = VW / 2;
                    this.y = PLAYER_Y;
                    this.width = 28;
                    this.height = 40;
                    this.knifeCooldown = 0;
                    this.aimX = VW / 2;
                    this.aimY = 200;
                    this.isAiming = false;
                    this.hasKnife = true;
                }
                update(dt) {
                    if (this.knifeCooldown > 0) {
                        this.knifeCooldown -= dt;
                        if (this.knifeCooldown <= 0) {
                            this.hasKnife = true;
                            this.knifeCooldown = 0;
                        }
                    }
                    this.x = Math.max(PLAYER_MIN_X, Math.min(PLAYER_MAX_X, this.x));
                }
                moveLeft(dt) { this.x -= PLAYER_SPEED * dt; }
                moveRight(dt) { this.x += PLAYER_SPEED * dt; }
                canThrow() { return this.hasKnife && this.knifeCooldown <= 0; }
                throwKnife() {
                    if (!this.canThrow()) return null;
                    this.hasKnife = false;
                    this.knifeCooldown = KNIFE_COOLDOWN;
                    const dx = this.aimX - this.x;
                    const dy = this.aimY - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 1) return null;
                    const vx = (dx / dist) * KNIFE_SPEED;
                    const vy = (dy / dist) * KNIFE_SPEED;
                    audio.whoosh();
                    return new Knife(this.x, this.y - 8, vx, vy);
                }
                draw(ctx) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    // Body
                    ctx.fillStyle = '#4A7C5C';
                    ctx.fillRect(-10, -16, 20, 28);
                    // Shirt detail
                    ctx.fillStyle = '#5D9B6F';
                    ctx.fillRect(-9, -14, 18, 24);
                    // Belt
                    ctx.fillStyle = '#3D2B1F';
                    ctx.fillRect(-11, 8, 22, 4);
                    // Head
                    ctx.fillStyle = '#F4C59E';
                    ctx.beginPath();
                    ctx.arc(0, -20, 11, 0, Math.PI * 2);
                    ctx.fill();
                    // Hat
                    ctx.fillStyle = '#5C3A1E';
                    ctx.fillRect(-14, -32, 28, 6);
                    ctx.fillRect(-8, -40, 16, 10);
                    // Eyes
                    ctx.fillStyle = '#1a1a1a';
                    ctx.beginPath();
                    ctx.arc(-4, -21, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(4, -21, 2, 0, Math.PI * 2);
                    ctx.fill();
                    // Arm with knife
                    if (this.hasKnife) {
                        ctx.save();
                        const ang = Math.atan2(this.aimY - this.y, this.aimX - this.x);
                        ctx.rotate(ang);
                        ctx.fillStyle = '#F4C59E';
                        ctx.fillRect(6, -3, 18, 6);
                        // Knife in hand
                        ctx.fillStyle = '#C0C0C0';
                        ctx.fillRect(20, -2, 16, 3);
                        ctx.fillStyle = '#808080';
                        ctx.fillRect(34, -3, 4, 5);
                        ctx.fillStyle = '#5C3A1E';
                        ctx.fillRect(16, -2, 6, 3);
                        ctx.restore();
                    } else {
                        ctx.fillStyle = '#F4C59E';
                        ctx.fillRect(6, -4, 14, 6);
                    }
                    // Legs
                    ctx.fillStyle = '#3D2B1F';
                    ctx.fillRect(-7, 10, 6, 12);
                    ctx.fillRect(1, 10, 6, 12);
                    // Boots
                    ctx.fillStyle = '#2A1A0A';
                    ctx.fillRect(-9, 20, 10, 4);
                    ctx.fillRect(-1, 20, 10, 4);
                    ctx.restore();
                }
            }

            // ─── KNIFE ───────────────────────────────────
            class Knife {
                constructor(x, y, vx, vy) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.alive = true;
                    this.rotation = Math.atan2(vy, vx);
                    this.spinSpeed = 20;
                    this.trail = [];
                }
                update(dt) {
                    this.trail.push({ x: this.x, y: this.y, life: 0.08 });
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;
                    this.rotation += this.spinSpeed * dt;
                    for (let i = this.trail.length - 1; i >= 0; i--) {
                        this.trail[i].life -= dt;
                        if (this.trail[i].life <= 0) this.trail.splice(i, 1);
                    }
                    if (this.x < -50 || this.x > VW + 50 || this.y < -50 || this.y > VH + 50) {
                        this.alive = false;
                    }
                }
                draw(ctx) {
                    for (const t of this.trail) {
                        const alpha = t.life / 0.08;
                        ctx.globalAlpha = alpha * 0.5;
                        ctx.fillStyle = '#FFD700';
                        ctx.beginPath();
                        ctx.arc(t.x, t.y, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.fillStyle = '#C0C0C0';
                    ctx.fillRect(-14, -1.5, 20, 3);
                    ctx.fillStyle = '#E8E8E8';
                    ctx.fillRect(-14, -0.5, 20, 1);
                    ctx.fillStyle = '#808080';
                    ctx.beginPath();
                    ctx.moveTo(-16, -2);
                    ctx.lineTo(-20, 0);
                    ctx.lineTo(-16, 2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#5C3A1E';
                    ctx.fillRect(4, -3, 10, 5);
                    ctx.fillStyle = '#8B6914';
                    ctx.fillRect(6, -2, 6, 3);
                    ctx.fillStyle = '#FFD700';
                    ctx.fillRect(2, -3, 3, 1);
                    ctx.fillRect(2, -3, 1, 5);
                    ctx.restore();
                }
                getBounds() {
                    return { x: this.x, y: this.y, radius: 10 };
                }
            }

            // ─── WORM ────────────────────────────────────
            class Worm {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.baseX = x;
                    this.baseY = y;
                    this.wiggleTime = Math.random() * Math.PI * 2;
                    this.wiggleSpeed = 3 + Math.random() * 4;
                    this.wiggleAmp = 6 + Math.random() * 8;
                    this.alive = true;
                    this.radius = 8;
                }
                update(dt) {
                    this.wiggleTime += this.wiggleSpeed * dt;
                    this.x = this.baseX + Math.cos(this.wiggleTime) * this.wiggleAmp;
                    this.y = this.baseY + Math.sin(this.wiggleTime * 1.3) * this.wiggleAmp * 0.6;
                }
                draw(ctx) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.fillStyle = '#FF6B8A';
                    for (let i = 0; i < 5; i++) {
                        const sx = (i - 2) * 5;
                        const sy = Math.sin(this.wiggleTime + i * 0.7) * 3;
                        ctx.beginPath();
                        ctx.arc(sx, sy, 4.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.fillStyle = '#FF8FBF';
                    ctx.beginPath();
                    ctx.arc(0, 0, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#1a1a1a';
                    ctx.beginPath();
                    ctx.arc(-7, 0, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(7, 0, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
                getBounds() { return { x: this.x, y: this.y, radius: this.radius }; }
            }

            // ─── TURKEY ──────────────────────────────────
            class Turkey {
                constructor(baseScale = 1.0) {
                    this.x = VW / 2 + (Math.random() - 0.5) * 300;
                    this.y = 180 + Math.random() * 150;
                    this.baseScale = baseScale;
                    this.scale = baseScale;
                    this.wormsEaten = 0;
                    this.maxHP = Math.floor(TURKEY_BASE_HP * baseScale);
                    this.hp = this.maxHP;
                    this.state = 'WANDERING';
                    this.vx = (Math.random() - 0.5) * TURKEY_WANDER_SPEED;
                    this.vy = (Math.random() - 0.5) * TURKEY_WANDER_SPEED * 0.5;
                    this.wanderTarget = { x: this.x, y: this.y };
                    this.wanderTimer = 0;
                    this.fleeTimer = 0;
                    this.eatTimer = 0;
                    this.alive = true;
                    this.hitFlash = 0;
                    this.gobbleTimer = 2 + Math.random() * 4;
                }
                update(dt, worms, playerX, playerY) {
                    if (!this.alive) return;
                    if (this.hitFlash > 0) this.hitFlash -= dt;
                    this.gobbleTimer -= dt;
                    if (this.gobbleTimer <= 0) {
                        this.gobbleTimer = 3 + Math.random() * 5;
                        audio.gobble();
                    }
                    if (this.state === 'FLEEING') {
                        this.fleeTimer -= dt;
                        if (this.fleeTimer <= 0) {
                            this.state = 'WANDERING';
                            this.wanderTimer = 0;
                        } else {
                            const dx = this.x - playerX;
                            const dy = this.y - playerY;
                            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                            const speed = TURKEY_FLEE_SPEED;
                            this.vx += (dx / dist) * speed * 3 * dt;
                            this.vy += (dy / dist) * speed * 3 * dt;
                        }
                    } else if (this.state === 'EATING') {
                        this.eatTimer -= dt;
                        if (this.eatTimer <= 0) this.state = 'WANDERING';
                        this.vx *= 0.9;
                        this.vy *= 0.9;
                    } else {
                        let nearestWorm = null;
                        let nearestDist = 200;
                        for (const w of worms) {
                            if (!w.alive) continue;
                            const dx = w.x - this.x;
                            const dy = w.y - this.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < nearestDist) {
                                nearestDist = dist;
                                nearestWorm = w;
                            }
                        }
                        if (nearestWorm) {
                            this.state = 'SEEKING';
                            const dx = nearestWorm.x - this.x;
                            const dy = nearestWorm.y - this.y;
                            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                            const speed = TURKEY_SEEK_SPEED;
                            this.vx += (dx / dist) * speed * 2 * dt;
                            this.vy += (dy / dist) * speed * 2 * dt;
                            if (dist < 18 * this.scale) {
                                nearestWorm.alive = false;
                                this.eatWorm();
                            }
                        } else {
                            this.state = 'WANDERING';
                            this.wanderTimer -= dt;
                            if (this.wanderTimer <= 0) {
                                this.wanderTarget = {
                                    x: TURKEY_MIN_X + Math.random() * (TURKEY_MAX_X - TURKEY_MIN_X),
                                    y: TURKEY_MIN_Y + Math.random() * (TURKEY_MAX_Y - TURKEY_MIN_Y)
                                };
                                this.wanderTimer = 1.5 + Math.random() * 2;
                            }
                            const dx = this.wanderTarget.x - this.x;
                            const dy = this.wanderTarget.y - this.y;
                            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                            const speed = TURKEY_WANDER_SPEED;
                            if (dist > 20) {
                                this.vx += (dx / dist) * speed * 1.5 * dt;
                                this.vy += (dy / dist) * speed * 1.5 * dt;
                            }
                        }
                    }
                    const friction = 3;
                    this.vx -= this.vx * friction * dt;
                    this.vy -= this.vy * friction * dt;
                    const maxSpeed = this.state === 'FLEEING' ? TURKEY_FLEE_SPEED :
                        this.state === 'SEEKING' ? TURKEY_SEEK_SPEED : TURKEY_WANDER_SPEED;
                    const spd = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    if (spd > maxSpeed) {
                        this.vx = (this.vx / spd) * maxSpeed;
                        this.vy = (this.vy / spd) * maxSpeed;

                        const dy = w.y - this.y;

                eatWorm() {

                    this.maxHP = Math.floor(TURKEY_BASE_HP * this.scale);

                draw(ctx) {

                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    ctx.ellipse(14 * s, -8 * s, 7 * s, 10 * s, 0.2, 0, Math.PI * 2);

            // ─── GAME STATE ──────────────────────────────
            const STATE = { TITLE: 'title', PLAYING: 'playing', PAUSED: 'paused', WAVE_COMPLETE: 'waveComplete',

                            const ty = (touch.clientY - rect.top) / scale;

                    } while (attempts < 20 && this.turkey && this.turkey.alive &&
                        Math.sqrt((wx - this.turkey.x) ** 2 + (wy - this.turkey.y) ** 2) < 60);

                        this.screenShakeY = 0;

                    if (this.keys['a'] || this.keys['A'] || this.keys['ArrowLeft'] || this.touchLeft) {

                    }
                    if (this.keys['d'] || this.keys['D'] || this.keys['ArrowRight'] || this.touchRight) {
                        this.player.moveRight(dt);

                    this.player.update(dt);
                    this.player.aimX = this.mouseX;
                    this.player.aimY = this.mouseY;
                    // Worm spawning
                    this.wormSpawnTimer -= dt;
                    if (this.wormSpawnTimer <= 0 && this.worms.filter(w => w.alive).length < this.getMaxWorms()) {

                        // Turkey has been alive a while
                    }

                    this.particles.emit(this.turkey.x, this.turkey.y, 20, '#FF6B6B', 180, 0.5, 3);

                            const extDist = 600;
                            const ex = this.player.x + (dx / dist) * extDist;
                            const ey = this.player.y - 8 + (dy / dist) * extDist;
                            ctx.lineTo(ex, ey);
                            ctx.stroke();
                            ctx.setLineDash([]);
                            // Small target dot
                            ctx.fillStyle = 'rgba(255,255,255,0.6)';
                            ctx.beginPath();
                            ctx.arc(this.mouseX, this.mouseY, 4, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                    // Mobile movement buttons
                    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                        ctx.fillStyle = 'rgba(255,255,255,0.25)';
                        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                        ctx.lineWidth = 2;
                        // Left button
                        ctx.beginPath();
                        ctx.roundRect(20, 530, 90, 50, 12);
                        ctx.fill();
                        ctx.stroke();
                        ctx.fillStyle = 'rgba(255,255,255,0.8)';
                        ctx.font = 'bold 22px Georgia';
                        ctx.textAlign = 'center';
                        ctx.fillText('◀', 65, 563);
                        // Right button
                        ctx.fillStyle = 'rgba(255,255,255,0.25)';
                        ctx.beginPath();
                        ctx.roundRect(VW - 110, 530, 90, 50, 12);
                        ctx.fill();
                        ctx.stroke();
                        ctx.fillStyle = 'rgba(255,255,255,0.8)';
                        ctx.fillText('▶', VW - 65, 563);
                    }
                }
                drawTitleScreen(ctx) {
                    this.drawBackground(ctx);
                    // Darken
                    ctx.fillStyle = 'rgba(0,0,0,0.55)';
                    ctx.fillRect(0, 0, VW, VH);
                    // Title
                    ctx.fillStyle = '#FFD700';
                    ctx.font = 'bold 48px Georgia';
                    ctx.textAlign = 'center';
                    ctx.fillText('🦃 TURKEY HUNT 🔪', VW / 2, 140);
                    ctx.strokeStyle = '#8B4513';
                    ctx.lineWidth = 3;
                    ctx.strokeText('🦃 TURKEY HUNT 🔪', VW / 2, 140);
                    // Subtitle
                    ctx.fillStyle = '#FFF';
                    ctx.font = '18px Georgia';
                    ctx.fillText('Kill the turkey before it eats worms and grows!', VW / 2, 185);
                    // Instructions
                    ctx.fillStyle = '#EEE';
                    ctx.font = '15px Georgia';
                    const instY = 240;
                    ctx.fillText('🎯 Click / Tap to throw knives at the turkey', VW / 2, instY);
                    ctx.fillText('🏃 A/D or Arrow Keys to move (mobile: bottom buttons)', VW / 2, instY + 28);
                    ctx.fillText('🪱 Turkey eats worms and gets BIGGER & TOUGHER', VW / 2, instY + 56);
                    ctx.fillText('💀 If the turkey grows too large — GAME OVER!', VW / 2, instY + 84);
                    // Start button
                    const btnX = VW / 2 - 100;
                    const btnY = 370;
                    const pulse = Math.sin(Date.now() / 600) * 3;
                    ctx.fillStyle = '#FF6B35';
                    ctx.beginPath();
                    ctx.roundRect(btnX - 2, btnY - 2, 204, 54, 14);
                    ctx.fill();
                    ctx.fillStyle = '#FF8C42';
                    ctx.beginPath();
                    ctx.roundRect(btnX, btnY + pulse, 200, 50, 12);
                    ctx.fill();
                    ctx.fillStyle = '#FFF';
                    ctx.font = 'bold 22px Georgia';
                    ctx.fillText('HUNT THE TURKEY!', VW / 2, btnY + 32 + pulse);
                    // High score
                    ctx.fillStyle = '#FFD700';
                    ctx.font = 'bold 16px Georgia';
                    ctx.fillText('🏆 HIGH SCORE: ' + this.highScore, VW / 2, 470);
                    ctx.fillStyle = '#CCC';
                    ctx.font = '13px Georgia';
                    ctx.fillText('Press SPACE or click to start', VW / 2, 510);
                }
                drawPauseScreen(ctx) {
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(0, 0, VW, VH);
                    ctx.fillStyle = '#FFD700';
                    ctx.font = 'bold 40px Georgia';
                    ctx.textAlign = 'center';
                    ctx.fillText('⏸ PAUSED', VW / 2, VH / 2 - 20);
                    ctx.fillStyle = '#FFF';
                    ctx.font = '18px Georgia';
                    ctx.fillText('Press P or ESC to resume', VW / 2, VH / 2 + 30);
                }
                drawGameOverScreen(ctx) {
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(0, 0, VW, VH);
                    ctx.fillStyle = '#FF4444';
                    ctx.font = 'bold 44px Georgia';
                    ctx.textAlign = 'center';
                    ctx.fillText('GAME OVER', VW / 2, 160);
                    ctx.strokeStyle = '#8B0000';
                    ctx.lineWidth = 3;
                    ctx.strokeText('GAME OVER', VW / 2, 160);
                    ctx.fillStyle = '#FFF';
                    ctx.font = '20px Georgia';
                    ctx.fillText('The turkey grew too powerful!', VW / 2, 210);
                    ctx.fillText('Final Score: ' + this.score, VW / 2, 250);
                    ctx.fillText('Wave Reached: ' + this.wave, VW / 2, 280);
                    if (this.score >= this.highScore && this.score > 0) {
                        ctx.fillStyle = '#FFD700';
                        ctx.font = 'bold 22px Georgia';
                        ctx.fillText('🏆 NEW HIGH SCORE! 🏆', VW / 2, 325);
                    }
                    ctx.fillStyle = '#FFD700';
                    ctx.font = 'bold 16px Georgia';
                    ctx.fillText('HIGH SCORE: ' + this.highScore, VW / 2, 365);
                    const btnX = VW / 2 - 90;
                    const btnY = 410;
                    ctx.fillStyle = '#FF6B35';
                    ctx.beginPath();
                    ctx.roundRect(btnX, btnY, 180, 48, 12);
                    ctx.fill();
                    ctx.fillStyle = '#FFF';
                    ctx.font = 'bold 20px Georgia';
                    ctx.fillText('PLAY AGAIN', VW / 2, btnY + 32);
                    ctx.fillStyle = '#CCC';
                    ctx.font = '13px Georgia';
                    ctx.fillText('Click or press SPACE to retry', VW / 2, 490);
                }
                drawWaveCompleteScreen(ctx) {
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(0, 0, VW, VH);
                    ctx.fillStyle = '#FFD700';
                    ctx.font = 'bold 38px Georgia';
                    ctx.textAlign = 'center';
                    ctx.fillText('🎉 WAVE ' + this.wave + ' COMPLETE! 🎉', VW / 2, 220);
                    ctx.fillStyle = '#FFF';
                    ctx.font = '20px Georgia';
                    ctx.fillText('Score: ' + this.score, VW / 2, 270);
                    ctx.fillText('Next wave in ' + Math.ceil(this.waveCompleteTimer) + '...', VW / 2, 310);
                    ctx.fillStyle = '#CCC';
                    ctx.font = '14px Georgia';
                    ctx.fillText('Click to skip', VW / 2, 350);
                }
                render() {
                    ctx.clearRect(0, 0, VW, VH);
                    ctx.save();
                    if (this.screenShake > 0.01) {
                        ctx.translate(this.screenShakeX, this.screenShakeY);
                    }
                    if (this.state === STATE.TITLE) {
                        this.drawTitleScreen(ctx);
                        ctx.restore();
                        return;
                    }
                    this.drawBackground(ctx);
                    // Draw worms
                    for (const w of this.worms) {
                        if (w.alive) w.draw(ctx);
                    }
                    // Draw turkey
                    if (this.turkey && this.turkey.alive) {
                        this.turkey.draw(ctx);
                    }
                    // Draw knives
                    for (const k of this.knives) {
                        if (k.alive) k.draw(ctx);
                    }
                    // Draw particles
                    this.particles.draw(ctx);
                    // Draw player
                    this.player.draw(ctx);
                    // Draw UI
                    this.drawUI(ctx);
                    ctx.restore();
                    // Overlay screens (no shake)
                    if (this.state === STATE.PAUSED) this.drawPauseScreen(ctx);
                    if (this.state === STATE.GAME_OVER) this.drawGameOverScreen(ctx);
                    if (this.state === STATE.WAVE_COMPLETE) this.drawWaveCompleteScreen(ctx);
                }
            }

            // ─── MAIN LOOP ───────────────────────────────
            const game = new Game();
            let lastTime = performance.now();

            function gameLoop(timestamp) {
                let dt = (timestamp - lastTime) / 1000;
                if (dt > 0.15) dt = 0.15;
                if (dt <= 0) dt = 0.016;
                lastTime = timestamp;
                game.update(dt);
                game.render();
                requestAnimationFrame(gameLoop);
            }
            requestAnimationFrame(gameLoop);

            // ─── POLYFILL roundRect ──────────────────────
            if (!ctx.roundRect) {
                ctx.roundRect = function(x, y, w, h, r) {
                    if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
                    ctx.beginPath();
                    ctx.moveTo(x + r.tl, y);
                    ctx.lineTo(x + w - r.tr, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
                    ctx.lineTo(x + w, y + h - r.br);
                    ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
                    ctx.lineTo(x + r.bl, y + h);
                    ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
                    ctx.lineTo(x, y + r.tl);
                    ctx.quadraticCurveTo(x, y, x + r.tl, y);
                    ctx.closePath();
                };
            }
        })();
    </script>
</body>
