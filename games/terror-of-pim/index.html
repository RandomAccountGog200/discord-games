            displayCanvas.addEventListener('mouseleave', () => { game.mouseDown = false; });
            displayCanvas.addEventListener('contextmenu', (e) => e.preventDefault());

            displayCanvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                game.audio.resume();
                for (const touch of e.changedTouches) {
                    const rect = displayCanvas.getBoundingClientRect();
                    const tx = (touch.clientX - rect.left) / scale;
                    const ty = (touch.clientY - rect.top) / scale;
                    if (tx < VW * 0.4 && !game.joystickActive) {
                        game.joystickActive = true;
                        game.joystickId = touch.identifier;
                        game.joystickBaseX = tx;
                        game.joystickBaseY = ty;
                        game.joystickDir = { x: 0, y: 0 };
                    } else if (tx >= VW * 0.4 && game.touchAimId === null) {
                        game.touchAimId = touch.identifier;
                        game.touchAimX = tx + game.camX;
                        game.touchAimY = ty + game.camY;
                        game.player.usingMouse = false;
                        game.mouseDown = true;
                    }
                }
                if (e.changedTouches.length === 1) {
                    const touch = e.changedTouches[0];
                    game.handleClick(touch.clientX, touch.clientY);
                }
            }, { passive: false });
            displayCanvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (const touch of e.changedTouches) {
                    const rect = displayCanvas.getBoundingClientRect();
                    const tx = (touch.clientX - rect.left) / scale;
                    const ty = (touch.clientY - rect.top) / scale;
                    if (touch.identifier === game.joystickId && game.joystickActive) {
                        const dx = tx - game.joystickBaseX;
                        const dy = ty - game.joystickBaseY;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const maxDist = 35;
                        if (dist > maxDist) {
                            game.joystickDir = { x: dx / dist, y: dy / dist };
                        } else if (dist > 8) {
                            game.joystickDir = { x: dx / maxDist, y: dy / maxDist };
                        } else {
                            game.joystickDir = { x: 0, y: 0 };
                        }
                    }
                    if (touch.identifier === game.touchAimId) {
                        game.touchAimX = tx + game.camX;
                        game.touchAimY = ty + game.camY;
                    }
                }
            }, { passive: false });
            displayCanvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                for (const touch of e.changedTouches) {
                    if (touch.identifier === game.joystickId) {
                        game.joystickActive = false;
                        game.joystickId = null;
                        game.joystickDir = null;
                    }
                    if (touch.identifier === game.touchAimId) {
                        game.touchAimId = null;
                        game.mouseDown = false;
                    }
                }
            }, { passive: false });
            displayCanvas.addEventListener('touchcancel', (e) => {
                game.joystickActive = false;
                game.joystickId = null;
                game.joystickDir = null;
                game.touchAimId = null;
                game.mouseDown = false;
            });

            window.addEventListener('resize', () => {
                resize();
                renderToScreen();
            });

            // Initialize
            resize();
            game.audio.init();
            requestAnimationFrame(gameLoop);

            console.log('🔥 TERROR OF PIM - Ready');
            console.log('🕹️ WASD/Arrows: Move | Mouse: Aim & Shoot | Space: Dash | P/ESC: Pause');
            console.log('📱 Mobile: Left side joystick | Right side tap to shoot');
        })();
    </script>
</body>
</html>
