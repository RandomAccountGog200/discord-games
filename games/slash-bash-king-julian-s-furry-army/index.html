<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SLASH & BASH: King Julian's Furry Army</title>
    <style>
        :root {
            --bg: #1a0a2e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        canvas {
            display: block;
            border-radius: 4px;
            box-shadow: 0 0 60px rgba(255, 140, 0, 0.25), 0 0 120px rgba(255, 60, 0, 0.12);
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('c');
            const ctx = canvas.getContext('2d');

            // ────────────────────────────────────
            // CONSTANTS & CONFIG
            // ────────────────────────────────────
            const GAME_W = 1000;
            const GAME_H = 700;
            const PLAYER_SPEED = 320;
            const PLAYER_DASH_SPEED = 900;
            const PLAYER_DASH_DURATION = 0.18;
            const PLAYER_DASH_COOLDOWN = 0.7;
            const PLAYER_MAX_HP = 6;
            const PLAYER_INVINCIBILITY = 0.6;
            const SLASH_RANGE = 85;
            const SLASH_ARC = 2.2; // radians (~126°)
            const SLASH_DURATION = 0.2;
            const SLASH_COOLDOWN = 0.35;
            const SLASH_DAMAGE = 1;
            const SLASH_KNOCKBACK = 280;
            const ENEMY_CONTACT_DAMAGE = 1;
            const ENEMY_CONTACT_COOLDOWN = 0.5;

            // ────────────────────────────────────
            // AUDIO MANAGER
            // ────────────────────────────────────
            class AudioManager {
                constructor() {
                    this.ctx = null;
                    this.musicBeat = 0;
                    this.musicTimer = 0;
                    this.bpm = 110;
                    this.bossBpm = 140;
                    this.isBossMusic = false;
                    this.targetBpm = 110;
                    this.currentBpm = 110;
                }
                init() {
                    try {
                        this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                    } catch (e) {
                        this.ctx = null;
                    }
                }
                resume() {
                    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
                }
                playTone(freq, duration, type = 'square', vol = 0.08, pan = 0) {
                    if (!this.ctx) return;
                    const t = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const panner = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, t);
                    osc.frequency.exponentialRampToValueAtTime(freq * 0.3, t + duration);
                    gain.gain.setValueAtTime(vol, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                    if (panner && pan !== 0) {
                        panner.pan.setValueAtTime(pan, t);
                        osc.connect(panner);
                        panner.connect(gain);
                    } else {
                        osc.connect(gain);
                    }
                    gain.connect(this.ctx.destination);
                    osc.start(t);
                    osc.stop(t + duration);
                }
                playNoise(duration, vol = 0.06, filterFreq = 3000) {
                    if (!this.ctx) return;
                    const t = this.ctx.currentTime;
                    const bufSize = Math.floor(this.ctx.sampleRate * duration);
                    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
                    const data = buf.getChannelData(0);
                    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
                    const src = this.ctx.createBufferSource();
                    src.buffer = buf;
                    const gain = this.ctx.createGain();
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(filterFreq, t);
                    filter.Q.setValueAtTime(0.8, t);
                    gain.gain.setValueAtTime(vol, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                    src.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    src.start(t);
                }
                slashSound() {
                    this.playNoise(0.1, 0.09, 2000);
                    this.playTone(180, 0.08, 'sawtooth', 0.05);
                }
                hitSound() {
                    this.playNoise(0.06, 0.1, 1500);
                    this.playTone(60, 0.07, 'triangle', 0.12);
                }
                enemyHitSound() {
                    this.playNoise(0.05, 0.07, 2500);
                    this.playTone(300, 0.06, 'square', 0.04);
                }
                deathSound() {
                    this.playNoise(0.2, 0.11, 800);
                    this.playTone(40, 0.25, 'sawtooth', 0.1);
                    this.playTone(120, 0.15, 'triangle', 0.06);
                }
                bossHitSound() {
                    this.playNoise(0.12, 0.14, 600);
                    this.playTone(35, 0.2, 'sawtooth', 0.18);
                    this.playTone(80, 0.1, 'square', 0.08);
                }
                dashSound() {
                    this.playNoise(0.08, 0.05, 4000);
                    this.playTone(500, 0.06, 'sine', 0.04);
                }
                uiClickSound() {
                    this.playTone(800, 0.04, 'sine', 0.06);
                    this.playTone(1000, 0.03, 'sine', 0.04);
                }
                pickupSound() {
                    this.playTone(600, 0.08, 'sine', 0.07);
                    this.playTone(900, 0.06, 'sine', 0.05);
                }
                bossAppearSound() {
                    this.playTone(25, 0.5, 'sawtooth', 0.2);
                    this.playNoise(0.3, 0.15, 300);
                    setTimeout(() => this.playTone(40, 0.3, 'square', 0.15), 150);
                }
                updateMusic(dt, isBoss) {
                    if (!this.ctx) return;
                    this.targetBpm = isBoss ? this.bossBpm : this.bpm;
                    this.currentBpm += (this.targetBpm - this.currentBpm) * dt * 3;
                    this.isBossMusic = isBoss;
                    this.musicTimer += dt;
                    const beatInterval = 60 / this.currentBpm;
                    if (this.musicTimer >= beatInterval) {
                        this.musicTimer -= beatInterval;
                        this.musicBeat++;
                        this.playTone(isBoss ? 35 : 45, 0.05, 'sine', isBoss ? 0.07 : 0.04);
                        if (this.musicBeat % 2 === 0) {
                            this.playNoise(0.04, 0.03, 6000);
                        }
                        if (this.musicBeat % 4 === 0 && isBoss) {
                            this.playTone(55, 0.08, 'triangle', 0.06);
                        }
                    }
                }
            }

            // ────────────────────────────────────
            // PARTICLE SYSTEM
            // ────────────────────────────────────
            class Particle {
                constructor(x, y, vx, vy, life, color, size = 3, shrink = true) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.life = life;
                    this.maxLife = life;
                    this.color = color;
                    this.size = size;
                    this.shrink = shrink;
                    this.alive = true;
                }
                update(dt) {
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;
                    this.life -= dt;
                    if (this.life <= 0) this.alive = false;
                }
                draw(ctx) {
                    const alpha = Math.max(0, this.life / this.maxLife);
                    const sz = this.shrink ? this.size * alpha : this.size;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, sz, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }
            class ParticleSystem {
                constructor() { this.particles = []; }
                emit(x, y, count, color, lifeRange = [0.2, 0.5], speedRange = [60, 200], sizeRange = [1.5, 4]) {
                    for (let i = 0; i < count; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = speedRange[0] + Math.random() * (speedRange[1] - speedRange[0]);
                        const life = lifeRange[0] + Math.random() * (lifeRange[1] - lifeRange[0]);
                        const size = sizeRange[0] + Math.random() * (sizeRange[1] - sizeRange[0]);
                        this.particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, life, color, size));
                    }
                }
                emitDirectional(x, y, angle, spread, count, color, lifeRange, speedRange, sizeRange) {
                    for (let i = 0; i < count; i++) {
                        const a = angle + (Math.random() - 0.5) * spread;
                        const speed = speedRange[0] + Math.random() * (speedRange[1] - speedRange[0]);
                        const life = lifeRange[0] + Math.random() * (lifeRange[1] - lifeRange[0]);
                        const size = sizeRange[0] + Math.random() * (sizeRange[1] - sizeRange[0]);
                        this.particles.push(new Particle(x, y, Math.cos(a) * speed, Math.sin(a) * speed, life, color, size));
                    }
                }
                update(dt) {
                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        this.particles[i].update(dt);
                        if (!this.particles[i].alive) this.particles.splice(i, 1);
                    }
                }
                draw(ctx) {
                    for (const p of this.particles) p.draw(ctx);
                }
                clear() { this.particles.length = 0; }
            }

            // ────────────────────────────────────
            // PLAYER
            // ────────────────────────────────────
            class Player {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.vx = 0;
                    this.vy = 0;
                    this.radius = 18;
                    this.hp = PLAYER_MAX_HP;
                    this.maxHp = PLAYER_MAX_HP;
                    this.angle = 0; // facing direction
                    this.slashing = false;
                    this.slashTimer = 0;
                    this.slashCooldown = 0;
                    this.slashAngle = 0;
                    this.dashing = false;
                    this.dashTimer = 0;
                    this.dashCooldown = 0;
                    this.dashAngle = 0;
                    this.invincible = 0;
                    this.alive = true;
                    this.comboCount = 0;
                    this.comboTimer = 0;
                    this.flashTimer = 0;
                }
                update(dt, keys, mouseWorldX, mouseWorldY, mobileAttack, mobileDash, mobileJoystick) {
                    if (!this.alive) return;
                    // Timers
                    if (this.invincible > 0) this.invincible -= dt;
                    if (this.slashCooldown > 0) this.slashCooldown -= dt;
                    if (this.slashTimer > 0) {
                        this.slashTimer -= dt;
                        if (this.slashTimer <= 0) this.slashing = false;
                    }
                    if (this.dashCooldown > 0) this.dashCooldown -= dt;
                    if (this.flashTimer > 0) this.flashTimer -= dt;
                    if (this.comboTimer > 0) {
                        this.comboTimer -= dt;
                        if (this.comboTimer <= 0) this.comboCount = 0;
                    }

                    // Movement
                    let moveX = 0,
                        moveY = 0;
                    let usingJoystick = false;
                    if (mobileJoystick && mobileJoystick.active) {
                        moveX = mobileJoystick.dx;
                        moveY = mobileJoystick.dy;
                        const mag = Math.sqrt(moveX * moveX + moveY * moveY);
                        if (mag > 1) { moveX /= mag;
                            moveY /= mag; }
                        usingJoystick = true;
                    } else {
                        if (keys['KeyW'] || keys['ArrowUp']) moveY -= 1;
                        if (keys['KeyS'] || keys['ArrowDown']) moveY += 1;
                        if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
                        if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;
                    }

                    // Aim direction
                    if (usingJoystick && (Math.abs(moveX) > 0.1 || Math.abs(moveY) > 0.1)) {
                        this.angle = Math.atan2(moveY, moveX);
                    } else if (!usingJoystick && mouseWorldX !== null) {
                        this.angle = Math.atan2(mouseWorldY - this.y, mouseWorldX - this.x);
                    }

                    // Dash
                    const wantDash = (keys['Space'] || keys['ShiftLeft'] || keys['ShiftRight'] || mobileDash) && this
                        .dashCooldown <= 0 && !this.dashing;
                    if (wantDash) {
                        this.dashing = true;
                        this.dashTimer = PLAYER_DASH_DURATION;
                        this.dashCooldown = PLAYER_DASH_COOLDOWN;
                        this.dashAngle = this.angle;
                        this.invincible = Math.max(this.invincible, PLAYER_DASH_DURATION + 0.05);
                        audio.dashSound();
                        particles.emitDirectional(this.x, this.y, this.dashAngle + Math.PI, 0.8, 8, '#aaccff', [0.15, 0.3], [
                            30, 100
                        ], [1, 3]);
                    }

                    if (this.dashing) {
                        this.dashTimer -= dt;
                        this.vx = Math.cos(this.dashAngle) * PLAYER_DASH_SPEED;
                        this.vy = Math.sin(this.dashAngle) * PLAYER_DASH_SPEED;
                        if (this.dashTimer <= 0) {
                            this.dashing = false;
                            this.vx = 0;
                            this.vy = 0;
                        }
                    } else {
                        const spd = PLAYER_SPEED;
                        const mag = Math.sqrt(moveX * moveX + moveY * moveY);
                        if (mag > 1) { moveX /= mag;
                            moveY /= mag; }
                        this.vx = moveX * spd;
                        this.vy = moveY * spd;
                    }

                    this.x += this.vx * dt;
                    this.y += this.vy * dt;

                    // Clamp to arena
                    const margin = this.radius;
                    this.x = Math.max(margin, Math.min(GAME_W - margin, this.x));
                    this.y = Math.max(margin, Math.min(GAME_H - margin, this.y));

                    // Slash
                    const wantSlash = (keys['KeyJ'] || keys['KeyK'] || (mouseButtons[0]) || mobileAttack) && this
                        .slashCooldown <= 0 && !this.slashing;
                    if (wantSlash) {
                        this.slashing = true;
                        this.slashTimer = SLASH_DURATION;
                        this.slashCooldown = SLASH_COOLDOWN;
                        this.slashAngle = this.angle;
                        audio.slashSound();
                        particles.emitDirectional(this.x + Math.cos(this.angle) * 25, this.y + Math.sin(this.angle) * 25,
                            this.angle, SLASH_ARC * 0.7, 6, '#ffffff', [0.08, 0.18], [100, 300], [1, 3]);
                    }
                }
                takeDamage(amount) {
                    if (this.invincible > 0 || !this.alive) return false;
                    this.hp -= amount;
                    this.invincible = PLAYER_INVINCIBILITY;
                    this.flashTimer = 0.15;
                    this.comboCount = 0;
                    this.comboTimer = 0;
                    shake.add(8, 0.25);
                    audio.hitSound();
                    particles.emit(this.x, this.y, 15, '#ff4444', [0.2, 0.45], [40, 180], [2, 6]);
                    if (this.hp <= 0) {
                        this.hp = 0;
                        this.alive = false;
                        particles.emit(this.x, this.y, 40, '#ff2222', [0.3, 0.7], [60, 300], [2, 8]);
                        particles.emit(this.x, this.y, 20, '#ffaa00', [0.4, 0.8], [40, 200], [3, 7]);
                        audio.deathSound();
                        shake.add(16, 0.5);
                    }
                    return true;
                }
                heal(amount) {
                    this.hp = Math.min(this.maxHp, this.hp + amount);
                    audio.pickupSound();
                    particles.emit(this.x, this.y, 10, '#44ff44', [0.3, 0.5], [20, 80], [2, 5]);
                }
                getWorldSlashArc() {
                    if (!this.slashing) return null;
                    const progress = 1 - (this.slashTimer / SLASH_DURATION);
                    const halfArc = SLASH_ARC / 2;
                    const sweepAngle = -halfArc + progress * SLASH_ARC;
                    return {
                        cx: this.x,
                        cy: this.y,
                        radius: SLASH_RANGE,
                        centerAngle: this.slashAngle,
                        sweepStart: this.slashAngle - halfArc,
                        sweepEnd: this.slashAngle + sweepAngle,
                        currentSweep: sweepAngle,
                    };
                }
                draw(ctx) {
                    if (!this.alive) return;
                    const flashOn = this.flashTimer > 0 && Math.floor(this.flashTimer * 30) % 2 === 0;
                    const alpha = (this.invincible > 0 && !this.dashing && Math.floor(this.invincible * 20) % 2 === 0) ? 0.35 :
                        1;

                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.translate(this.x, this.y);

                    // Body
                    const bodyColor = flashOn ? '#ffffff' : '#4488cc';
                    ctx.fillStyle = bodyColor;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#2266aa';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();

                    // Inner armor highlight
                    ctx.fillStyle = 'rgba(255,255,255,0.25)';
                    ctx.beginPath();
                    ctx.arc(-3, -4, this.radius * 0.5, 0, Math.PI * 2);
                    ctx.fill();

                    // Sword
                    const swordLen = 30;
                    const swordBaseX = Math.cos(this.angle) * 10;
                    const swordBaseY = Math.sin(this.angle) * 10;
                    const tipX = swordBaseX + Math.cos(this.angle) * swordLen;
                    const tipY = swordBaseY + Math.sin(this.angle) * swordLen;

                    if (this.slashing) {
                        const progress = 1 - (this.slashTimer / SLASH_DURATION);
                        const sweepAngle = -SLASH_ARC / 2 + progress * SLASH_ARC;
                        const slashMid = this.slashAngle + sweepAngle;
                        const stx = swordBaseX + Math.cos(slashMid) * swordLen;
                        const sty = swordBaseY + Math.sin(slashMid) * swordLen;
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 3;
                        ctx.shadowColor = '#ffffff';
                        ctx.shadowBlur = 12;
                        ctx.beginPath();
                        ctx.moveTo(swordBaseX, swordBaseY);
                        ctx.lineTo(stx, sty);
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                        // Slash arc glow
                        ctx.strokeStyle = 'rgba(255,255,200,0.5)';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.arc(0, 0, SLASH_RANGE, this.slashAngle - SLASH_ARC / 2, this.slashAngle + sweepAngle);
                        ctx.stroke();
                    } else {
                        ctx.strokeStyle = '#ddeeff';
                        ctx.lineWidth = 3;
                        ctx.shadowColor = '#aaccff';
                        ctx.shadowBlur = 6;
                        ctx.beginPath();
                        ctx.moveTo(swordBaseX, swordBaseY);
                        ctx.lineTo(tipX, tipY);
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                        // Sword tip glow
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(tipX, tipY, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.restore();
                }
            }

            // ────────────────────────────────────
            // ENEMY TYPES
            // ────────────────────────────────────
            class Enemy {
                constructor(x, y, type) {
                    this.x = x;
                    this.y = y;
                    this.type = type;
                    this.alive = true;
                    this.contactCooldown = 0;
                    this.flashTimer = 0;
                    this.stunTimer = 0;
                    if (type === 'small') {
                        this.radius = 14;
                        this.hp = 2;
                        this.maxHp = 2;
                        this.speed = 130 + Math.random() * 80;
                        this.color = ['#ff8888', '#ffaa66', '#ff66aa', '#ff9966', '#ff7799'][Math.floor(Math.random() * 5)];
                        this.earColor = this.color.replace('ff', 'ee').replace('88', 'aa');
                        this.scoreValue = 100;
                    } else if (type === 'big') {
                        this.radius = 24;
                        this.hp = 5;
                        this.maxHp = 5;
                        this.speed = 70 + Math.random() * 50;
                        this.color = ['#cc44aa', '#aa44cc', '#9944bb', '#bb5599', '#cc3388'][Math.floor(Math.random() * 5)];
                        this.earColor = '#dd88cc';
                        this.scoreValue = 250;
                    } else {
                        this.radius = 16;
                        this.hp = 3;
                        this.maxHp = 3;
                        this.speed = 100 + Math.random() * 60;
                        this.color = '#ff9944';
                        this.earColor = '#ffbb77';
                        this.scoreValue = 150;
                    }
                    this.wanderAngle = Math.random() * Math.PI * 2;
                    this.wanderTimer = 0;
                }
                update(dt, playerX, playerY, pillars) {
                    if (!this.alive) return;
                    if (this.contactCooldown > 0) this.contactCooldown -= dt;
                    if (this.flashTimer > 0) this.flashTimer -= dt;
                    if (this.stunTimer > 0) {
                        this.stunTimer -= dt;
                        return;
                    }
                    // Chase player with slight wander
                    const dx = playerX - this.x;
                    const dy = playerY - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    this.wanderTimer -= dt;
                    if (this.wanderTimer <= 0) {
                        this.wanderAngle += (Math.random() - 0.5) * 1.2;
                        this.wanderTimer = 0.4 + Math.random() * 0.6;
                    }
                    const wanderX = Math.cos(this.wanderAngle) * 0.25;
                    const wanderY = Math.sin(this.wanderAngle) * 0.25;
                    const nx = dx / dist + wanderX;
                    const ny = dy / dist + wanderY;
                    const mag = Math.sqrt(nx * nx + ny * ny);
                    this.x += (nx / mag) * this.speed * dt;
                    this.y += (ny / mag) * this.speed * dt;

                    // Avoid pillars
                    for (const p of pillars) {
                        const pdx = this.x - p.x;
                        const pdy = this.y - p.y;
                        const pdist = Math.sqrt(pdx * pdx + pdy * pdy);
                        const minDist = this.radius + p.radius + 4;
                        if (pdist < minDist && pdist > 0) {
                            const pushX = (pdx / pdist) * (minDist - pdist);
                            const pushY = (pdy / pdist) * (minDist - pdist);
                            this.x += pushX;
                            this.y += pushY;
                        }
                    }

                    // Clamp
                    this.x = Math.max(this.radius, Math.min(GAME_W - this.radius, this.x));
                    this.y = Math.max(this.radius, Math.min(GAME_H - this.radius, this.y));
                }
                takeDamage(amount, knockbackAngle, knockbackForce) {
                    this.hp -= amount;
                    this.flashTimer = 0.1;
                    this.stunTimer = 0.12;
                    this.x += Math.cos(knockbackAngle) * knockbackForce;
                    this.y += Math.sin(knockbackAngle) * knockbackForce;
                    audio.enemyHitSound();
                    particles.emit(this.x, this.y, 6, '#ffffff', [0.1, 0.25], [30, 130], [1, 3]);
                    particles.emit(this.x, this.y, 4, this.color, [0.15, 0.35], [20, 100], [1.5, 4]);
                    if (this.hp <= 0) {
                        this.alive = false;
                        particles.emit(this.x, this.y, 15, this.color, [0.25, 0.55], [50, 220], [2, 6]);
                        particles.emit(this.x, this.y, 8, '#ffffff', [0.15, 0.35], [30, 150], [1, 3]);
                        // Chance to drop health
                        if (Math.random() < 0.18) {
                            pickups.push(new Pickup(this.x, this.y, 'health'));
                        }
                    }
                }
                draw(ctx) {
                    if (!this.alive) return;
                    const flashOn = this.flashTimer > 0 && Math.floor(this.flashTimer * 40) % 2 === 0;
                    ctx.save();
                    ctx.translate(this.x, this.y);

                    // Shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.beginPath();
                    ctx.ellipse(0, this.radius * 0.7, this.radius * 0.8, this.radius * 0.3, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Body
                    const col = flashOn ? '#ffffff' : this.color;
                    ctx.fillStyle = col;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Fluffy outline
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    for (let i = 0; i < 6; i++) {
                        const fa = (i / 6) * Math.PI * 2;
                        const fx = Math.cos(fa) * this.radius * 0.7;
                        const fy = Math.sin(fa) * this.radius * 0.7;
                        ctx.beginPath();
                        ctx.arc(fx, fy, this.radius * 0.35, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Ears
                    ctx.fillStyle = this.earColor;
                    for (let s = -1; s <= 1; s += 2) {
                        const earX = s * this.radius * 0.55;
                        const earY = -this.radius * 0.7;
                        ctx.beginPath();
                        ctx.arc(earX, earY, this.radius * 0.4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(255,200,200,0.5)';
                        ctx.beginPath();
                        ctx.arc(earX, earY, this.radius * 0.2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = this.earColor;
                    }

                    // Eyes
                    const eyeY = -this.radius * 0.2;
                    for (let s = -1; s <= 1; s += 2) {
                        const ex = s * this.radius * 0.35;
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(ex, eyeY, this.radius * 0.28, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#111111';
                        ctx.beginPath();
                        ctx.arc(ex + s * 1.5, eyeY, this.radius * 0.14, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Cute mouth
                    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(0, eyeY + this.radius * 0.25, this.radius * 0.2, 0, Math.PI);
                    ctx.stroke();

                    // Tail
                    if (this.type === 'big') {
                        ctx.strokeStyle = this.color;
                        ctx.lineWidth = 5;
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(0, this.radius * 0.5);
                        ctx.quadraticCurveTo(this.radius * 1.2, this.radius * 0.3, this.radius * 0.8, -this.radius * 0.4);
                        ctx.stroke();
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(this.radius * 0.8, -this.radius * 0.4, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.restore();
                }
            }

            // ────────────────────────────────────
            // BOSS - KING JULIAN
            // ────────────────────────────────────
            class Boss {
                constructor(x, y, tier = 1) {
                    this.x = x;
                    this.y = y;
                    this.radius = 32;
                    this.hp = 30 + tier * 15;
                    this.maxHp = this.hp;
                    this.alive = true;
                    this.tier = tier;
                    this.speed = 90 + tier * 15;
                    this.phase2 = false;
                    this.attackTimer = 0;
                    this.attackCooldown = 1.5;
                    this.currentAttack = 'idle';
                    this.attackData = {};
                    this.flashTimer = 0;
                    this.stunTimer = 0;
                    this.entranceTimer = 1.2;
                    this.tailWag = 0;
                    this.summonedMinions = [];
                }
                update(dt, playerX, playerY, pillars, enemyList) {
                    if (!this.alive) return;
                    if (this.entranceTimer > 0) {
                        this.entranceTimer -= dt;
                        return;
                    }
                    if (this.flashTimer > 0) this.flashTimer -= dt;
                    if (this.stunTimer > 0) {
                        this.stunTimer -= dt;
                        this.attackTimer -= dt;
                        return;
                    }
                    if (this.hp <= this.maxHp * 0.5 && !this.phase2) {
                        this.phase2 = true;
                        this.attackCooldown = 1.0;
                        this.speed += 30;
                        shake.add(10, 0.4);
                        audio.bossAppearSound();
                        particles.emit(this.x, this.y, 30, '#ff6600', [0.3, 0.7], [60, 250], [3, 8]);
                    }
                    this.attackTimer -= dt;
                    this.tailWag += dt * 8;

                    if (this.attackTimer <= 0 && this.currentAttack === 'idle') {
                        this.chooseAttack(playerX, playerY);
                    }

                    this.executeAttack(dt, playerX, playerY, pillars, enemyList);

                    // Move toward player when idle
                    if (this.currentAttack === 'idle') {
                        const dx = playerX - this.x;
                        const dy = playerY - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                        if (dist > 120) {
                            this.x += (dx / dist) * this.speed * dt;
                            this.y += (dy / dist) * this.speed * dt;
                        }
                    }
                    this.x = Math.max(this.radius, Math.min(GAME_W - this.radius, this.x));
                    this.y = Math.max(this.radius, Math.min(GAME_H - this.radius, this.y));
                }
                chooseAttack(px, py) {
                    const attacks = ['tailSpin', 'crownToss', 'summon'];
                    if (this.phase2) attacks.push('groundSlam', 'charge');
                    const choice = attacks[Math.floor(Math.random() * attacks.length)];
                    this.currentAttack = choice;
                    this.attackTimer = 0.6;
                    this.attackData = { phase: 'telegraph', timer: 0.5, tx: px, ty: py };
                }
                executeAttack(dt, px, py, pillars, enemyList) {
                    if (this.currentAttack === 'idle') return;
                    const ad = this.attackData;
                    ad.timer -= dt;
                    if (ad.phase === 'telegraph' && ad.timer <= 0) {
                        ad.phase = 'active';
                        if (this.currentAttack === 'tailSpin') {
                            ad.spinTimer = 0.8;
                            ad.spinSpeed = 12;
                            audio.playTone(50, 0.3, 'sawtooth', 0.1);
                        } else if (this.currentAttack === 'crownToss') {
                            ad.crownX = this.x;
                            ad.crownY = this.y;
                            ad.crownAngle = Math.atan2(py - this.y, px - this.x);
                            ad.crownDist = 0;
                            ad.crownMaxDist = 350;
                            ad.crownSpeed = 500;
                            ad.crownReturn = false;
                            audio.playTone(80, 0.2, 'triangle', 0.08);
                        } else if (this.currentAttack === 'summon') {
                            for (let i = 0; i < (this.phase2 ? 4 : 2); i++) {
                                const sx = this.x + (Math.random() - 0.5) * 150;
                                const sy = this.y + (Math.random() - 0.5) * 150;
                                const e = new Enemy(Math.max(20, Math.min(GAME_W - 20, sx)), Math.max(20, Math.min(GAME_H -
                                    20, sy)), 'small');
                                enemyList.push(e);
                            }
                            this.currentAttack = 'idle';
                            this.attackCooldown = this.phase2 ? 0.9 : 1.5;
                            this.attackTimer = this.attackCooldown;
                        } else if (this.currentAttack === 'groundSlam') {
                            ad.slamTimer = 0.35;
                            ad.slamX = px;
                            ad.slamY = py;
                            audio.playTone(30, 0.4, 'sawtooth', 0.15);
                        } else if (this.currentAttack === 'charge') {
                            ad.chargeDir = Math.atan2(py - this.y, px - this.x);
                            ad.chargeSpeed = 500;
                            ad.chargeTimer = 0.5;
                            ad.chargesLeft = 2;
                            audio.playTone(45, 0.25, 'square', 0.1);
                        }
                    }
                    if (ad.phase === 'active') {
                        if (this.currentAttack === 'tailSpin') {
                            ad.spinTimer -= dt;
                            this.x += Math.cos(ad.spinSpeed * ad.spinTimer) * 200 * dt;
                            this.y += Math.sin(ad.spinSpeed * ad.spinTimer) * 200 * dt;
                            // Damage nearby
                            if (ad.spinTimer > 0 && Math.floor(ad.spinTimer * 20) % 3 === 0) {
                                particles.emit(this.x, this.y, 4, '#ffaa00', [0.1, 0.2], [30, 100], [2, 4]);
                            }
                            if (ad.spinTimer <= 0) { this.finishAttack(); }
                        } else if (this.currentAttack === 'crownToss') {
                            if (!ad.crownReturn) {
                                ad.crownDist += ad.crownSpeed * dt;
                                ad.crownX = this.x + Math.cos(ad.crownAngle) * ad.crownDist;
                                ad.crownY = this.y + Math.sin(ad.crownAngle) * ad.crownDist;
                                if (ad.crownDist >= ad.crownMaxDist) ad.crownReturn = true;
                            } else {
                                ad.crownDist -= ad.crownSpeed * 1.3 * dt;
                                ad.crownX = this.x + Math.cos(ad.crownAngle) * ad.crownDist;
                                ad.crownY = this.y + Math.sin(ad.crownAngle) * ad.crownDist;
                                if (ad.crownDist <= 0) { this.finishAttack(); }
                            }
                            particles.emit(ad.crownX, ad.crownY, 1, '#ffdd00', [0.08, 0.15], [5, 20], [2, 3]);
                        } else if (this.currentAttack === 'groundSlam') {
                            ad.slamTimer -= dt;
                            if (ad.slamTimer <= 0 && !ad.slamDone) {
                                ad.slamDone = true;
                                this.x = ad.slamX;
                                this.y = ad.slamY;
                                shake.add(14, 0.45);
                                audio.playTone(20, 0.5, 'sawtooth', 0.25);
                                particles.emit(this.x, this.y, 40, '#ff8800', [0.3, 0.6], [80, 350], [3, 10]);
                                // Shockwave ring
                                for (let i = 0; i < 20; i++) {
                                    const a = (i / 20) * Math.PI * 2;
                                    particles.emitDirectional(this.x, this.y, a, 0.05, 2, '#ffcc00', [0.2, 0.4], [150, 300], [2,
                                        5
                                    ]);
                                }
                                this.finishAttack();
                            }
                        } else if (this.currentAttack === 'charge') {
                            ad.chargeTimer -= dt;
                            this.x += Math.cos(ad.chargeDir) * ad.chargeSpeed * dt;
                            this.y += Math.sin(ad.chargeDir) * ad.chargeSpeed * dt;
                            particles.emit(this.x, this.y, 2, '#ff4400', [0.1, 0.2], [10, 40], [2, 4]);
                            if (ad.chargeTimer <= 0) {
                                ad.chargesLeft--;
                                if (ad.chargesLeft > 0) {
                                    ad.chargeDir = Math.atan2(py - this.y, px - this.x);
                                    ad.chargeTimer = 0.5;
                                    audio.playTone(45, 0.2, 'square', 0.08);
                                } else {
                                    this.finishAttack();
                                }
                            }
                        }
                    }
                }
                finishAttack() {
                    this.currentAttack = 'idle';
                    this.attackCooldown = this.phase2 ? 0.8 : 1.4;
                    this.attackTimer = this.attackCooldown;
                    this.attackData = {};
                }
                takeDamage(amount, knockbackAngle, knockbackForce) {
                    this.hp -= amount;
                    this.flashTimer = 0.08;
                    this.stunTimer = 0.08;
                    this.x += Math.cos(knockbackAngle) * knockbackForce * 0.4;
                    this.y += Math.sin(knockbackAngle) * knockbackForce * 0.4;
                    audio.bossHitSound();
                    shake.add(5, 0.2);
                    particles.emit(this.x, this.y, 10, '#ffffff', [0.1, 0.3], [40, 180], [2, 5]);
                    particles.emit(this.x, this.y, 15, '#ffaa00', [0.2, 0.5], [50, 200], [3, 7]);
                    if (this.hp <= 0) {
                        this.alive = false;
                        particles.emit(this.x, this.y, 60, '#ff6600', [0.4, 1.0], [80, 400], [3, 12]);
                        particles.emit(this.x, this.y, 40, '#ffff00', [0.5, 1.2], [60, 350], [4, 10]);
                        particles.emit(this.x, this.y, 30, '#ffffff', [0.3, 0.8], [40, 250], [2, 6]);
                        shake.add(20, 0.7);
                        audio.deathSound();
                        audio.playTone(60, 0.5, 'triangle', 0.15);
                    }
                }
                draw(ctx) {
                    if (!this.alive) return;
                    const flashOn = this.flashTimer > 0;
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    const entProgress = this.entranceTimer > 0 ? 1 - (this.entranceTimer / 1.2) : 1;
                    const scale = Math.min(1, entProgress * 1.1);
                    ctx.scale(scale, scale);

                    // Shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.4)';
                    ctx.beginPath();
                    ctx.ellipse(0, this.radius * 0.8, this.radius * 0.9, this.radius * 0.3, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Body (lemur-like)
                    const bodyCol = flashOn ? '#ffffff' : '#b8a090';
                    ctx.fillStyle = bodyCol;
                    ctx.beginPath();
                    ctx.arc(0, -4, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#8a7060';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // Belly
                    ctx.fillStyle = '#e8d8c8';
                    ctx.beginPath();
                    ctx.arc(0, 2, this.radius * 0.6, 0, Math.PI * 2);
                    ctx.fill();

                    // Crown
                    const crownY = -this.radius - 10;
                    ctx.fillStyle = '#ffcc00';
                    ctx.beginPath();
                    ctx.moveTo(-16, crownY + 18);
                    ctx.lineTo(-14, crownY);
                    ctx.lineTo(-6, crownY + 10);
                    ctx.lineTo(0, crownY - 4);
                    ctx.lineTo(6, crownY + 10);
                    ctx.lineTo(14, crownY);
                    ctx.lineTo(16, crownY + 18);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = '#cc9900';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    // Crown jewels
                    ctx.fillStyle = '#ff3333';
                    ctx.beginPath();
                    ctx.arc(0, crownY + 2, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#3366ff';
                    ctx.beginPath();
                    ctx.arc(-7, crownY + 6, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(7, crownY + 6, 2.5, 0, Math.PI * 2);
                    ctx.fill();

                    // Big lemur eyes
                    const eyeY = -this.radius * 0.15;
                    for (let s = -1; s <= 1; s += 2) {
                        const ex = s * this.radius * 0.38;
                        ctx.fillStyle = '#ffffcc';
                        ctx.beginPath();
                        ctx.arc(ex, eyeY, this.radius * 0.32, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#cc8800';
                        ctx.beginPath();
                        ctx.arc(ex, eyeY, this.radius * 0.18, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#000000';
                        ctx.beginPath();
                        ctx.arc(ex + s * 2, eyeY, this.radius * 0.08, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Snout
                    ctx.fillStyle = '#d4c0b0';
                    ctx.beginPath();
                    ctx.arc(0, eyeY + this.radius * 0.3, this.radius * 0.25, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(0, eyeY + this.radius * 0.26, 3, 0, Math.PI * 2);
                    ctx.fill();

                    // Ringed tail
                    const tailSegments = 8;
                    const tailBaseY = this.radius * 0.6;
                    ctx.lineWidth = 7;
                    ctx.lineCap = 'round';
                    for (let i = 0; i < tailSegments; i++) {
                        const t = i / tailSegments;
                        const sx = Math.sin(t * 3 + this.tailWag) * 25;
                        const sy = tailBaseY + t * 45;
                        const ex = Math.sin((t + 1 / tailSegments) * 3 + this.tailWag) * 25;
                        const ey = tailBaseY + (t + 1 / tailSegments) * 45;
                        ctx.strokeStyle = i % 2 === 0 ? '#3a3a3a' : '#e8e8e8';
                        ctx.beginPath();
                        ctx.moveTo(sx, sy);
                        ctx.lineTo(ex, ey);
                        ctx.stroke();
                    }
                    const tailTipX = Math.sin(3 + this.tailWag) * 25;
                    const tailTipY = tailBaseY + 45;
                    ctx.fillStyle = '#3a3a3a';
                    ctx.beginPath();
                    ctx.arc(tailTipX, tailTipY, 5, 0, Math.PI * 2);
                    ctx.fill();

                    // Cape
                    ctx.fillStyle = 'rgba(180,40,40,0.7)';
                    ctx.beginPath();
                    ctx.moveTo(-this.radius * 0.6, -this.radius * 0.5);
                    ctx.quadraticCurveTo(-this.radius * 1.1, this.radius * 0.5, -this.radius * 0.4, this.radius * 1.1);
                    ctx.lineTo(this.radius * 0.4, this.radius * 1.1);
                    ctx.quadraticCurveTo(this.radius * 1.1, this.radius * 0.5, this.radius * 0.6, -this.radius * 0.5);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(220,60,60,0.5)';
                    ctx.beginPath();
                    ctx.arc(0, this.radius * 0.2, this.radius * 0.75, 0, Math.PI);
                    ctx.fill();

                    ctx.restore();

                    // Draw crown toss projectile
                    if (this.currentAttack === 'crownToss' && this.attackData.phase === 'active' && this.attackData
                        .crownX !== undefined) {
                        const cx = this.attackData.crownX;
                        const cy = this.attackData.crownY;
                        ctx.fillStyle = '#ffdd00';
                        ctx.beginPath();
                        ctx.arc(cx, cy, 10, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#ff8800';
                        ctx.lineWidth = 3;
                        ctx.stroke();
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(cx, cy, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                getAttackHitboxes() {
                    const boxes = [];
                    if (this.currentAttack === 'tailSpin' && this.attackData.phase === 'active' && this.attackData
                        .spinTimer > 0) {
                        boxes.push({ cx: this.x, cy: this.y, radius: this.radius + 20, damage: 2, knockback: 200 });
                    }
                    if (this.currentAttack === 'crownToss' && this.attackData.phase === 'active' && this.attackData
                        .crownX !== undefined && this.attackData.crownDist > 5) {
                        boxes.push({ cx: this.attackData.crownX, cy: this.attackData.crownY, radius: 14, damage: 1,
                            knockback: 150 });
                    }
                    if (this.currentAttack === 'groundSlam' && this.attackData.slamDone && this.attackData.slamTimer > -0.3) {
                        boxes.push({ cx: this.x, cy: this.y, radius: 120, damage: 2, knockback: 300 });
                    }
                    if (this.currentAttack === 'charge' && this.attackData.phase === 'active' && this.attackData
                        .chargeTimer > 0) {
                        boxes.push({ cx: this.x, cy: this.y, radius: this.radius + 8, damage: 1, knockback: 180 });
                    }
                    return boxes;
                }
                getContactDamage() {
                    if (this.currentAttack === 'charge' && this.attackData.phase === 'active') return 2;
                    return 1;
                }
            }

            // ────────────────────────────────────
            // PICKUP
            // ────────────────────────────────────
            class Pickup {
                constructor(x, y, type) {
                    this.x = x;
                    this.y = y;
                    this.type = type;
                    this.alive = true;
                    this.life = 8;
                    this.bobOffset = 0;
                }
                update(dt) {
                    this.life -= dt;
                    this.bobOffset += dt * 3;
                    if (this.life <= 0) this.alive = false;
                }
                draw(ctx) {
                    const alpha = Math.min(1, this.life / 1.5);
                    ctx.globalAlpha = alpha;
                    const by = this.y + Math.sin(this.bobOffset) * 5;
                    if (this.type === 'health') {
                        ctx.fillStyle = '#44ff44';
                        ctx.beginPath();
                        ctx.arc(this.x, by, 10, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(this.x - 2, by - 6, 4, 12);
                        ctx.fillRect(this.x - 6, by - 2, 12, 4);
                    }
                    ctx.globalAlpha = 1;
                }
            }

            // ────────────────────────────────────
            // SCREEN SHAKE
            // ────────────────────────────────────
            class ScreenShake {
                constructor() {
                    this.intensity = 0;
                    this.duration = 0;
                    this.timer = 0;
                }
                add(intensity, duration) {
                    this.intensity = Math.max(this.intensity, intensity);
                    this.duration = Math.max(this.duration, duration);
                    this.timer = duration;
                }
                update(dt) {
                    if (this.timer > 0) {
                        this.timer -= dt;
                        if (this.timer <= 0) {
                            this.intensity = 0;
                            this.duration = 0;
                        } else {
                            this.intensity = this.intensity * (this.timer / this.duration);
                        }
                    }
                }
                getOffset() {
                    if (this.timer <= 0) return { x: 0, y: 0 };
                    const i = this.intensity;
                    return {
                        x: (Math.random() - 0.5) * i * 2,
                        y: (Math.random() - 0.5) * i * 2,
                    };
                }
            }
