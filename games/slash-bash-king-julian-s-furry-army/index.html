            // ────────────────────────────────────
            // INITIALIZATION
            // ────────────────────────────────────
            function resizeCanvas() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                const aspect = GAME_W / GAME_H;
                let cw, ch;
                if (w / h > aspect) {
                    ch = h;
                    cw = h * aspect;
                } else {
                    cw = w;
                    ch = w / aspect;
                }
                canvas.width = Math.floor(cw);
                canvas.height = Math.floor(ch);
                scale = cw / GAME_W;
                offsetX = 0;
                offsetY = (h - ch) / 2;
            }

            function createPillars() {
                pillars = [];
                const positions = [
                    { x: 200, y: 180 }, { x: 800, y: 180 }, { x: 200, y: 520 }, { x: 800, y: 520 },
                    { x: 500, y: 140 }, { x: 500, y: 560 }, { x: 140, y: 350 }, { x: 860, y: 350 },
                ];
                for (const pos of positions) {
                    pillars.push({ x: pos.x, y: pos.y, radius: 28 });
                }
            }

            function spawnWave() {
                enemies = [];
                boss = null;
                pickups = [];
                waveIntroTimer = 1.8;
                gameState = STATE.WAVE_INTRO;
                const isBossWave = waveNumber % 5 === 0;
                if (isBossWave) {
                    boss = new Boss(GAME_W / 2, GAME_H / 2, Math.floor(waveNumber / 5));
                    waveEnemiesRemaining = 1;
                } else {
                    const difficulty = waveNumber;
                    const smallCount = 3 + Math.floor(difficulty * 1.5);
                    const bigCount = Math.floor(difficulty * 0.6);
                    for (let i = 0; i < smallCount; i++) {
                        const ex = 60 + Math.random() * (GAME_W - 120);
                        const ey = 60 + Math.random() * (GAME_H - 120);
                        enemies.push(new Enemy(ex, ey, 'small'));
                    }
                    for (let i = 0; i < bigCount; i++) {
                        const ex = 60 + Math.random() * (GAME_W - 120);
                        const ey = 60 + Math.random() * (GAME_H - 120);
                        enemies.push(new Enemy(ex, ey, 'big'));
                    }
                    waveEnemiesRemaining = enemies.length;
                }
            }

            function resetGame() {
                player = new Player(GAME_W / 2, GAME_H / 2);
                enemies = [];
                boss = null;
                pickups = [];
                waveNumber = 1;
                score = 0;
                comboMultiplier = 1;
                hitStopTimer = 0;
                particles.clear();
                shake = new ScreenShake();
                createPillars();
                spawnWave();
                gameState = STATE.WAVE_INTRO;
                waveIntroTimer = 1.8;
            }

            function loadHighScore() {
                try {
                    const hs = localStorage.getItem('slashbash_hs');
                    if (hs) highScore = parseInt(hs, 10) || 0;
                } catch (e) { highScore = 0; }
            }

            function saveHighScore() {
                if (score > highScore) {
                    highScore = score;
                    try { localStorage.setItem('slashbash_hs', highScore); } catch (e) {}
                }
            }

            // ────────────────────────────────────
            // HIT-STOP & COLLISION HELPERS
            // ────────────────────────────────────
            function addHitStop(amount) {
                hitStopTimer = Math.max(hitStopTimer, amount);
            }

            function circleCollision(x1, y1, r1, x2, y2, r2) {
                const dx = x2 - x1;
                const dy = y2 - y1;
                const dist = Math.sqrt(dx * dx + dy * dy);
                return dist < r1 + r2;
            }

            function pointInArc(px, py, cx, cy, radius, startAngle, endAngle) {
                const dx = px - cx;
                const dy = py - cy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > radius) return false;
                let angle = Math.atan2(dy, dx);
                // Normalize angles
                while (angle < startAngle) angle += Math.PI * 2;
                while (angle > startAngle + Math.PI * 2) angle -= Math.PI * 2;
                if (endAngle > startAngle) return angle >= startAngle && angle <= endAngle;
                return angle >= startAngle || angle <= endAngle;
            }

            // ────────────────────────────────────
            // AUDIO & SHAKE INSTANCES
            // ────────────────────────────────────
            audio = new AudioManager();
            shake = new ScreenShake();
            particles = new ParticleSystem();
            loadHighScore();
            createPillars();
            player = new Player(GAME_W / 2, GAME_H / 2);

            // ────────────────────────────────────
            // INPUT HANDLING
            // ────────────────────────────────────
            window.addEventListener('keydown', e => {
                keys[e.code] = true;
                if (e.code === 'KeyP' && gameState === STATE.PLAYING) {
                    gameState = STATE.PAUSED;
                    audio.uiClickSound();
                } else if (e.code === 'KeyP' && gameState === STATE.PAUSED) {
                    gameState = STATE.PLAYING;
                    audio.uiClickSound();
                }
                if (e.code === 'Space') e.preventDefault();
            });
            window.addEventListener('keyup', e => { keys[e.code] = false; });
            window.addEventListener('mousedown', e => {
                mouseButtons[e.button] = true;
                audio.resume();
                if (gameState === STATE.TITLE) handleTitleClick(e);
                if (gameState === STATE.GAME_OVER || gameState === STATE.VICTORY) handleGameOverClick(e);
                if (gameState === STATE.PAUSED) handlePauseClick(e);
            });
            window.addEventListener('mouseup', e => { mouseButtons[e.button] = false; });
            window.addEventListener('mousemove', e => {
                mouseScreenX = e.clientX;
                mouseScreenY = e.clientY;
                const rect = canvas.getBoundingClientRect();
                const sx = (e.clientX - rect.left) / scale;
                const sy = (e.clientY - rect.top - offsetY) / scale;
                mouseWorldX = sx;
                mouseWorldY = sy;
            });

            function handleTitleClick(e) {
                const rect = canvas.getBoundingClientRect();
                const sx = (e.clientX - rect.left) / scale;
                const sy = (e.clientY - rect.top - offsetY) / scale;
                // Play button area
                const btnX = GAME_W / 2 - 100;
                const btnY = GAME_H / 2 + 50;
                const btnW = 200;
                const btnH = 55;
                if (sx >= btnX && sx <= btnX + btnW && sy >= btnY && sy <= btnY + btnH) {
                    audio.resume();
                    audio.init();
                    audio.uiClickSound();
                    resetGame();
                    gameState = STATE.WAVE_INTRO;
                }
            }

            function handleGameOverClick(e) {
                const rect = canvas.getBoundingClientRect();
                const sx = (e.clientX - rect.left) / scale;
                const sy = (e.clientY - rect.top - offsetY) / scale;
                const btnX = GAME_W / 2 - 100;
                const btnY = GAME_H / 2 + 70;
                if (sx >= btnX && sx <= btnX + 200 && sy >= btnY && sy <= btnY + 50) {
                    audio.uiClickSound();
                    resetGame();
                }
            }

            function handlePauseClick(e) {
                const rect = canvas.getBoundingClientRect();
                const sx = (e.clientX - rect.left) / scale;
                const sy = (e.clientY - rect.top - offsetY) / scale;
                const btnX = GAME_W / 2 - 80;
                const btnY = GAME_H / 2 + 10;
                if (sx >= btnX && sx <= btnX + 160 && sy >= btnY && sy <= btnY + 45) {
                    audio.uiClickSound();
                    gameState = STATE.PLAYING;
                }
            }

            // Touch handling
            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                audio.resume();
                const rect = canvas.getBoundingClientRect();
                for (const touch of e.changedTouches) {
                    const sx = (touch.clientX - rect.left) / scale;
                    const sy = (touch.clientY - rect.top - offsetY) / scale;
                    const screenX = touch.clientX - rect.left;
                    const screenY = touch.clientY - rect.top;
                    // Left third: joystick
                    if (screenX < canvas.width * 0.35) {
                        mobileJoystick.active = true;
                        mobileJoystick.baseX = sx;
                        mobileJoystick.baseY = sy;
                        mobileJoystick.dx = 0;
                        mobileJoystick.dy = 0;
                        mobileJoystick.touchId = touch.identifier;
                    }
                    // Right third: buttons
                    else if (screenX > canvas.width * 0.55 && screenY > canvas.height * 0.45) {
                        if (screenY < canvas.height * 0.7 && attackTouchId === null) {
                            mobileAttackActive = true;
                            attackTouchId = touch.identifier;
                        } else if (screenY >= canvas.height * 0.7 && dashTouchId === null) {
                            mobileDashActive = true;
                            dashTouchId = touch.identifier;
                        }
                    }
                }
                // Handle title/gameover taps
                if (gameState === STATE.TITLE) {
                    const sx = (e.changedTouches[0].clientX - rect.left) / scale;
                    const sy = (e.changedTouches[0].clientY - rect.top - offsetY) / scale;
                    const btnX = GAME_W / 2 - 100;
                    const btnY = GAME_H / 2 + 50;
                    if (sx >= btnX && sx <= btnX + 200 && sy >= btnY && sy <= btnY + 55) {
                        audio.init();
                        audio.uiClickSound();
                        resetGame();
                        gameState = STATE.WAVE_INTRO;
                    }
                }
                if (gameState === STATE.GAME_OVER || gameState === STATE.VICTORY) {
                    const sx = (e.changedTouches[0].clientX - rect.left) / scale;
                    const sy = (e.changedTouches[0].clientY - rect.top - offsetY) / scale;
                    const btnX = GAME_W / 2 - 100;
                    const btnY = GAME_H / 2 + 70;
                    if (sx >= btnX && sx <= btnX + 200 && sy >= btnY && sy <= btnY + 50) {
                        audio.uiClickSound();
                        resetGame();
                    }
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                for (const touch of e.changedTouches) {
                    const sx = (touch.clientX - rect.left) / scale;
                    const sy = (touch.clientY - rect.top - offsetY) / scale;
                    if (mobileJoystick.active && touch.identifier === mobileJoystick.touchId) {
                        const dx = sx - mobileJoystick.baseX;
                        const dy = sy - mobileJoystick.baseY;
                        const mag = Math.sqrt(dx * dx + dy * dy);
                        const maxDist = 50;
                        if (mag > maxDist) {
                            mobileJoystick.dx = (dx / mag);
                            mobileJoystick.dy = (dy / mag);
                        } else {
                            mobileJoystick.dx = dx / maxDist;
                            mobileJoystick.dy = dy / maxDist;
                        }
                    }
                }
            }, { passive: false });

            canvas.addEventListener('touchend', e => {
                e.preventDefault();
                for (const touch of e.changedTouches) {
                    if (mobileJoystick.active && touch.identifier === mobileJoystick.touchId) {
                        mobileJoystick.active = false;
                        mobileJoystick.dx = 0;
                        mobileJoystick.dy = 0;
                        mobileJoystick.touchId = null;
                    }
                    if (touch.identifier === attackTouchId) {
                        mobileAttackActive = false;
                        attackTouchId = null;
                    }
                    if (touch.identifier === dashTouchId) {
                        mobileDashActive = false;
                        dashTouchId = null;
                    }
                }
            }, { passive: false });

            // ────────────────────────────────────
            // UPDATE
            // ────────────────────────────────────
            function update(dt) {
                // Clamp dt
                if (dt > 0.1) dt = 0.1;
                if (dt <= 0) return;

                // Hit-stop
                if (hitStopTimer > 0) {
                    hitStopTimer -= dt;
                    if (hitStopTimer > 0) {
                        // Still update particles and shake during hit-stop for visual continuity
                        particles.update(dt * 0.3);
                        shake.update(dt);
                        return;
                    }
                }

                shake.update(dt);
                audio.updateMusic(dt, boss !== null && boss.alive);

                if (gameState === STATE.WAVE_INTRO) {
                    waveIntroTimer -= dt;
                    if (waveIntroTimer <= 0) {
                        gameState = STATE.PLAYING;
                    }
                    particles.update(dt);
                    return;
                }

                if (gameState !== STATE.PLAYING) {
                    particles.update(dt);
                    return;
                }

                // Update player
                player.update(dt, keys, mouseWorldX, mouseWorldY, mobileAttackActive, mobileDashActive, mobileJoystick);

                // Update enemies
                const allEnemies = [...enemies];
                if (boss && boss.alive && boss.entranceTimer <= 0) allEnemies.push(boss);

                for (const enemy of enemies) {
                    enemy.update(dt, player.x, player.y, pillars);
                }
                if (boss && boss.alive) {
                    boss.update(dt, player.x, player.y, pillars, enemies);
                }

                // Update pickups
                for (const pickup of pickups) pickup.update(dt);
                pickups = pickups.filter(p => p.alive);

                // Check player slash hits
                if (player.slashing && player.slashTimer > 0) {
                    const arc = player.getWorldSlashArc();
                    if (arc) {
                        const allTargets = [...enemies];
                        if (boss && boss.alive && boss.entranceTimer <= 0) allTargets.push(boss);
                        for (const target of allTargets) {
                            if (!target.alive) continue;
                            if (target._slashedThisSwing) continue;
                            const dx = target.x - player.x;
                            const dy = target.y - player.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < SLASH_RANGE + target.radius) {
                                const angle = Math.atan2(dy, dx);
                                let diff = angle - arc.centerAngle;
                                while (diff > Math.PI) diff -= Math.PI * 2;
                                while (diff < -Math.PI) diff += Math.PI * 2;
                                if (Math.abs(diff) <= SLASH_ARC / 2 + 0.1) {
                                    target._slashedThisSwing = true;
                                    const kbAngle = angle;
                                    const kbForce = SLASH_KNOCKBACK;
                                    const dmg = SLASH_DAMAGE;
                                    if (target instanceof Boss) {
                                        target.takeDamage(dmg, kbAngle, kbForce * 0.5);
                                        addHitStop(0.06);
                                        shake.add(6, 0.18);
                                    } else {
                                        target.takeDamage(dmg, kbAngle, kbForce);
                                        addHitStop(0.04);
                                        player.comboCount++;
                                        player.comboTimer = 2.0;
                                        comboMultiplier = 1 + Math.floor(player.comboCount / 5) * 0.5;
                                        score += Math.floor(target.scoreValue * comboMultiplier);
                                    }
                                }
                            }
                        }
                    }
                }

                // Reset slash tracking
                if (!player.slashing) {
                    const allTargets = [...enemies];
                    if (boss && boss.alive) allTargets.push(boss);
                    for (const t of allTargets) t._slashedThisSwing = false;
                }

                // Check boss attack hitboxes on player
                if (boss && boss.alive && boss.entranceTimer <= 0 && player.alive && player.invincible <= 0) {
                    const hitboxes = boss.getAttackHitboxes();
                    for (const hb of hitboxes) {
                        if (circleCollision(player.x, player.y, player.radius, hb.cx, hb.cy, hb.radius)) {
                            player.takeDamage(hb.damage);
                            const kbA = Math.atan2(player.y - hb.cy, player.x - hb.cx);
                            player.x += Math.cos(kbA) * hb.knockback * 0.05;
                            player.y += Math.sin(kbA) * hb.knockback * 0.05;
                            addHitStop(0.05);
                            break;
                        }
                    }
                }

                // Enemy contact damage
                if (player.alive && player.invincible <= 0) {
                    for (const enemy of enemies) {
                        if (!enemy.alive || enemy.contactCooldown > 0) continue;
                        if (circleCollision(player.x, player.y, player.radius, enemy.x, enemy.y, enemy.radius)) {
                            player.takeDamage(ENEMY_CONTACT_DAMAGE);
                            enemy.contactCooldown = ENEMY_CONTACT_COOLDOWN;
                            const kbA = Math.atan2(player.y - enemy.y, player.x - enemy.x);
                            player.x += Math.cos(kbA) * 60;
                            player.y += Math.sin(kbA) * 60;
                            addHitStop(0.03);
                            break;
                        }
                    }
                    if (boss && boss.alive && boss.entranceTimer <= 0 && player.alive && player.invincible <= 0) {
                        if (circleCollision(player.x, player.y, player.radius, boss.x, boss.y, boss.radius)) {
                            const dmg = boss.getContactDamage();
                            player.takeDamage(dmg);
                            const kbA = Math.atan2(player.y - boss.y, player.x - boss.x);
                            player.x += Math.cos(kbA) * 80;
                            player.y += Math.sin(kbA) * 80;
                            addHitStop(0.04);
                        }
                    }
                }

                // Pickup collision
                for (const pickup of pickups) {
                    if (!pickup.alive) continue;
                    if (circleCollision(player.x, player.y, player.radius + 8, pickup.x, pickup.y, 10)) {
                        if (pickup.type === 'health') player.heal(1);
                        pickup.alive = false;
                    }
                }

                // Check wave completion
                const livingEnemies = enemies.filter(e => e.alive).length;
                const bossAlive = boss && boss.alive;
                if (!bossAlive && livingEnemies === 0 && waveEnemiesRemaining <= 0 && gameState === STATE.PLAYING) {
                    // Check if boss was just defeated
                    if (boss && !boss.alive && boss._justDied === undefined) {
                        boss._justDied = true;
                        score += 2000 * Math.floor(waveNumber / 5);
                        saveHighScore();
                        gameState = STATE.VICTORY;
                        return;
                    }
                    if (!boss || !boss.alive) {
                        waveNumber++;
                        saveHighScore();
                        spawnWave();
                    }
                }
                if (bossAlive && livingEnemies === 0 && waveEnemiesRemaining > 0 && boss.entranceTimer <= 0) {
                    waveEnemiesRemaining = 0;
                }

                // Update wave enemy count
                if (!bossAlive) {
                    waveEnemiesRemaining = livingEnemies;
                }

                // Player death
                if (!player.alive && gameState === STATE.PLAYING) {
                    gameState = STATE.GAME_OVER;
                    saveHighScore();
                }

                particles.update(dt);
                pickups = pickups.filter(p => p.alive);
            }

            // ────────────────────────────────────
            // RENDER
            // ────────────────────────────────────
            function drawArenaFloor() {
                // Base floor
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, GAME_W, GAME_H);

                // Grid
                ctx.strokeStyle = 'rgba(255,255,255,0.03)';
                ctx.lineWidth = 1;
                const gridSize = 40;
                for (let x = gridSize; x < GAME_W; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, GAME_H);
                    ctx.stroke();
                }
                for (let y = gridSize; y < GAME_H; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(GAME_W, y);
                    ctx.stroke();
                }

                // Subtle radial glow in center
                const glowGrad = ctx.createRadialGradient(GAME_W / 2, GAME_H / 2, 50, GAME_W / 2, GAME_H / 2, 500);
                glowGrad.addColorStop(0, 'rgba(40,30,60,0.4)');
                glowGrad.addColorStop(1, 'rgba(10,5,20,0)');
                ctx.fillStyle = glowGrad;
                ctx.fillRect(0, 0, GAME_W, GAME_H);
            }

            function drawPillars() {
                for (const p of pillars) {
                    // Shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.4)';
                    ctx.beginPath();
                    ctx.arc(p.x + 3, p.y + 3, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    // Pillar body
                    const grad = ctx.createLinearGradient(p.x - p.radius, p.y, p.x + p.radius, p.y);
                    grad.addColorStop(0, '#5a5a6e');
                    grad.addColorStop(0.4, '#8a8a9e');
                    grad.addColorStop(0.6, '#7a7a8e');
                    grad.addColorStop(1, '#4a4a5e');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#3a3a4e';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    // Highlight
                    ctx.fillStyle = 'rgba(255,255,255,0.1)';
                    ctx.beginPath();
                    ctx.arc(p.x - 5, p.y - 5, p.radius * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawHUD() {
                // Health bar
                const hbX = 30;
                const hbY = 25;
                const hbW = 180;
                const hbH = 16;
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(hbX - 2, hbY - 2, hbW + 4, hbH + 4);
                ctx.fillStyle = '#331111';
                ctx.fillRect(hbX, hbY, hbW, hbH);
                const hpRatio = player.hp / player.maxHp;
                const hpGrad = ctx.createLinearGradient(hbX, 0, hbX + hbW, 0);
                hpGrad.addColorStop(0, '#ff3344');
                hpGrad.addColorStop(1, '#ff6644');
                ctx.fillStyle = hpGrad;
                ctx.fillRect(hbX, hbY, hbW * hpRatio, hbH);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(hbX, hbY, hbW, hbH);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText(`HP: ${player.hp}/${player.maxHp}`, hbX + hbW / 2, hbY + hbH - 3);

                // Score
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px system-ui';
                ctx.textAlign = 'right';
                ctx.fillText(`SCORE: ${score}`, GAME_W - 30, 35);

                // Combo
                if (comboMultiplier > 1 && player.comboTimer > 0) {
                    ctx.fillStyle = '#ffcc00';
                    ctx.font = 'bold 16px system-ui';
                    ctx.textAlign = 'right';
                    ctx.fillText(`COMBO x${comboMultiplier.toFixed(1)}`, GAME_W - 30, 58);
                }

                // Wave
                ctx.fillStyle = '#cccccc';
                ctx.font = 'bold 14px system-ui';
                ctx.textAlign = 'right';
                ctx.fillText(`WAVE ${waveNumber}`, GAME_W - 30, GAME_H - 20);

                // Boss HP bar
                if (boss && boss.alive && boss.entranceTimer <= 0) {
                    const bhbW = 300;
                    const bhbH = 20;
                    const bhbX = GAME_W / 2 - bhbW / 2;
                    const bhbY = 60;
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(bhbX - 3, bhbY - 3, bhbW + 6, bhbH + 6);
                    ctx.fillStyle = '#331100';
                    ctx.fillRect(bhbX, bhbY, bhbW, bhbH);
                    const bhpRatio = boss.hp / boss.maxHp;
                    const bhpGrad = ctx.createLinearGradient(bhbX, 0, bhbX + bhbW, 0);
                    bhpGrad.addColorStop(0, '#ff4400');
                    bhpGrad.addColorStop(0.5, '#ff8800');
                    bhpGrad.addColorStop(1, '#ff4400');
                    ctx.fillStyle = bhpGrad;
                    ctx.fillRect(bhbX, bhbY, bhbW * bhpRatio, bhbH);
                    ctx.strokeStyle = '#ffcc00';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(bhbX, bhbY, bhbW, bhbH);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 12px system-ui';
                    ctx.textAlign = 'center';
                    ctx.fillText('👑 KING JULIAN 👑', GAME_W / 2, bhbY - 8);
                }
            }

            function drawMobileControls() {
                // Joystick base
                const joyX = 100;
                const joyY = GAME_H - 130;
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                ctx.arc(joyX, joyY, 50, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();
                // Joystick knob
                const knobX = joyX + mobileJoystick.dx * 35;
                const knobY = joyY + mobileJoystick.dy * 35;
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath();
                ctx.arc(knobX, knobY, 22, 0, Math.PI * 2);
                ctx.fill();

                // Attack button
                const atkX = GAME_W - 100;
                const atkY = GAME_H - 150;
                ctx.fillStyle = mobileAttackActive ? 'rgba(255,100,60,0.6)' : 'rgba(255,150,100,0.3)';
                ctx.beginPath();
                ctx.arc(atkX, atkY, 38, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('SLASH', atkX, atkY + 5);

                // Dash button
                const dashX = GAME_W - 100;
                const dashY = GAME_H - 60;
                ctx.fillStyle = mobileDashActive ? 'rgba(100,180,255,0.6)' : 'rgba(150,200,255,0.3)';
                ctx.beginPath();
                ctx.arc(dashX, dashY, 30, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px system-ui';
                ctx.fillText('DASH', dashX, dashY + 4);
            }

            function drawTitleScreen() {
                drawArenaFloor();
                drawPillars();
                // Animated background particles
                particles.update(0.016);
                particles.draw(ctx);
                if (particles.particles.length < 40) {
                    particles.emit(GAME_W / 2 + (Math.random() - 0.5) * 400, GAME_H / 2 + (Math.random() - 0.5) * 300,
                        1, ['#ff8844', '#ffaa66', '#ffcc88', '#ff6688'][Math.floor(Math.random() * 4)],
                        [0.8, 1.5], [5, 25], [2, 5]);
                }

                // Title
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 52px system-ui';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#ff6600';
                ctx.shadowBlur = 30;
                ctx.fillText('SLASH & BASH', GAME_W / 2, GAME_H / 2 - 90);
                ctx.shadowBlur = 15;
                ctx.fillText('SLASH & BASH', GAME_W / 2, GAME_H / 2 - 90);
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#ffcc44';
                ctx.font = 'bold 22px system-ui';
                ctx.fillText("King Julian's Furry Army", GAME_W / 2, GAME_H / 2 - 45);

                ctx.fillStyle = '#ff8844';
                ctx.font = 'italic 18px system-ui';
                ctx.fillText('GOODNESS GRACIOUS!', GAME_W / 2, GAME_H / 2 - 18);

                // Play button
                const btnX = GAME_W / 2 - 100;
                const btnY = GAME_H / 2 + 50;
                const btnGrad = ctx.createLinearGradient(btnX, btnY, btnX, btnY + 55);
                btnGrad.addColorStop(0, '#ff6622');
                btnGrad.addColorStop(1, '#cc3300');
                ctx.fillStyle = btnGrad;
                ctx.beginPath();
                ctx.roundRect(btnX, btnY, 200, 55, 12);
                ctx.fill();
                ctx.strokeStyle = '#ffaa66';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 22px system-ui';
                ctx.fillText('⚔️  PLAY  ⚔️', GAME_W / 2, btnY + 37);

                // High score
                ctx.fillStyle = '#cccccc';
                ctx.font = '14px system-ui';
                ctx.fillText(`High Score: ${highScore}`, GAME_W / 2, btnY + 80);

                // Controls info
                ctx.fillStyle = '#888888';
                ctx.font = '12px system-ui';
                ctx.fillText('WASD = Move | Mouse = Aim | Click/Space = Slash | Shift = Dash', GAME_W / 2, GAME_H - 30);
                ctx.fillText('Mobile: Left joystick + Right buttons', GAME_W / 2, GAME_H - 12);
            }

            function drawPauseScreen() {
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(0, 0, GAME_W, GAME_H);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 40px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSED', GAME_W / 2, GAME_H / 2 - 30);
                const btnX = GAME_W / 2 - 80;
                const btnY = GAME_H / 2 + 10;
                ctx.fillStyle = '#4488cc';
                ctx.beginPath();
                ctx.roundRect(btnX, btnY, 160, 45, 10);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px system-ui';
                ctx.fillText('RESUME', GAME_W / 2, btnY + 30);
            }

            function drawGameOverScreen() {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, GAME_W, GAME_H);
                ctx.fillStyle = '#ff4444';
                ctx.font = 'bold 48px system-ui';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 20;
                ctx.fillText('GAME OVER', GAME_W / 2, GAME_H / 2 - 50);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.font = '20px system-ui';
                ctx.fillText(`Score: ${score}   |   Wave: ${waveNumber}`, GAME_W / 2, GAME_H / 2);
                ctx.fillText(`High Score: ${highScore}`, GAME_W / 2, GAME_H / 2 + 28);
                const btnX = GAME_W / 2 - 100;
                const btnY = GAME_H / 2 + 70;
                ctx.fillStyle = '#ff6622';
                ctx.beginPath();
                ctx.roundRect(btnX, btnY, 200, 50, 10);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px system-ui';
                ctx.fillText('PLAY AGAIN', GAME_W / 2, btnY + 33);
            }

            function drawVictoryScreen() {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, GAME_W, GAME_H);
                ctx.fillStyle = '#ffcc00';
                ctx.font = 'bold 44px system-ui';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#ff8800';
                ctx.shadowBlur = 25;
                ctx.fillText('👑 KING JULIAN DEFEATED! 👑', GAME_W / 2, GAME_H / 2 - 45);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.font = '20px system-ui';
                ctx.fillText(`Score: ${score}   |   Wave: ${waveNumber}`, GAME_W / 2, GAME_H / 2 + 5);
                ctx.fillText(`High Score: ${highScore}`, GAME_W / 2, GAME_H / 2 + 33);
                const btnX = GAME_W / 2 - 100;
                const btnY = GAME_H / 2 + 70;
                ctx.fillStyle = '#ffaa00';
                ctx.beginPath();
                ctx.roundRect(btnX, btnY, 200, 50, 10);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px system-ui';
                ctx.fillText('CONTINUE', GAME_W / 2, btnY + 33);
            }

            function drawWaveIntro() {
                const alpha = Math.min(1, waveIntroTimer / 0.5);
                ctx.fillStyle = `rgba(0,0,0,${0.5 * alpha})`;
                ctx.fillRect(0, 0, GAME_W, GAME_H);
                const isBossWave = waveNumber % 5 === 0;
                ctx.fillStyle = isBossWave ? '#ff4400' : '#ffffff';
                ctx.globalAlpha = alpha;
                ctx.font = `bold ${isBossWave ? 38 : 32}px system-ui`;
                ctx.textAlign = 'center';
                if (isBossWave) {
                    ctx.fillText('⚠️  BOSS WAVE  ⚠️', GAME_W / 2, GAME_H / 2 - 10);
                    ctx.fillStyle = '#ffcc00';
                    ctx.font = 'bold 20px system-ui';
                    ctx.fillText('KING JULIAN APPROACHES!', GAME_W / 2, GAME_H / 2 + 30);
                    ctx.fillText('GOODNESS GRACIOUS!', GAME_W / 2, GAME_H / 2 + 55);
                } else {
                    ctx.fillText(`WAVE ${waveNumber}`, GAME_W / 2, GAME_H / 2);
                }
                ctx.globalAlpha = 1;
            }

            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Apply shake
                const shakeOff = shake.getOffset();
                ctx.save();
                ctx.translate(offsetX + shakeOff.x * scale, offsetY + shakeOff.y * scale);
                ctx.scale(scale, scale);

                // Clip to game area
                ctx.beginPath();
                ctx.rect(0, 0, GAME_W, GAME_H);
                ctx.clip();

                if (gameState === STATE.TITLE) {
                    drawTitleScreen();
                    ctx.restore();
                    return;
                }

                drawArenaFloor();
                drawPillars();

                // Draw pickups
                for (const pickup of pickups) pickup.draw(ctx);

                // Draw enemies
                for (const enemy of enemies) enemy.draw(ctx);

                // Draw boss
                if (boss && boss.alive) boss.draw(ctx);

                // Draw player
                player.draw(ctx);

                // Draw particles
                particles.draw(ctx);

                // Draw HUD
                drawHUD();

                // Draw mobile controls
                const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
                if (isMobile && gameState === STATE.PLAYING) {
                    drawMobileControls();
                }

                // Overlay screens
                if (gameState === STATE.PAUSED) drawPauseScreen();
                if (gameState === STATE.GAME_OVER) drawGameOverScreen();
                if (gameState === STATE.VICTORY) drawVictoryScreen();
                if (gameState === STATE.WAVE_INTRO) drawWaveIntro();

                ctx.restore();
            }

            // ────────────────────────────────────
            // GAME LOOP
            // ────────────────────────────────────
            let lastTime = performance.now();

            function gameLoop(timestamp) {
                let dt = (timestamp - lastTime) / 1000;
                if (dt <= 0) dt = 0.001;
                if (dt > 0.15) dt = 0.15;
                lastTime = timestamp;

                update(dt);
                render();
                requestAnimationFrame(gameLoop);
            }

            // ────────────────────────────────────
            // STARTUP
            // ────────────────────────────────────
            function init() {
                resizeCanvas();
                audio.init();
                gameState = STATE.TITLE;
                player = new Player(GAME_W / 2, GAME_H / 2);
                particles.clear();
                enemies = [];
                boss = null;
                pickups = [];
                waveNumber = 1;
                score = 0;
                comboMultiplier = 1;
                shake = new ScreenShake();
                createPillars();
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }

            window.addEventListener('resize', resizeCanvas);
            init();
        })();
    </script>
</body>
</html>
