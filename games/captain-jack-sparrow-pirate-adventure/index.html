                    const activeIds = new Set();
                    for (let touch of touches) activeIds.add(touch.identifier);
                    if (this.touchJoystick.active && !activeIds.has(this.touchJoystick.id)) {
                        this.touchJoystick.active = false;
                        this.touchJoystick.id = null;
                        this.keys['d'] = this.keys['a'] = this.keys['s'] = this.keys['w'] = false;
                        this.keys['arrowright'] = this.keys['arrowleft'] = this.keys['arrowdown'] = this.keys[
                            'arrowup'] = false;
                    }
                    if (this.touchFire.active && !activeIds.has(this.touchFire.id)) {
                        this.touchFire.active = false;
                        this.touchFire.id = null;
                        this.keys['fire'] = false;
                    }
                }

                drawTouchControls() {
                    if (this.state !== 'playing' || this.paused) return;
                    if (this.touchJoystick.active) {
                        const jx = this.touchJoystick.startX;
                        const jy = this.touchJoystick.startY;
                        const dx = this.touchJoystick.currX - jx;
                        const dy = this.touchJoystick.currY - jy;
                        ctx.fillStyle = 'rgba(255,255,255,0.2)';
                        ctx.beginPath();
                        ctx.arc(jx, jy, 44, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        const knobDist = Math.min(30, Math.sqrt(dx * dx + dy * dy));
                        const knobAngle = Math.atan2(dy, dx);
                        const kx = jx + Math.cos(knobAngle) * knobDist;
                        const ky = jy + Math.sin(knobAngle) * knobDist;
                        ctx.fillStyle = 'rgba(255,255,255,0.6)';
                        ctx.beginPath();
                        ctx.arc(kx, ky, 16, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    const fireX = BASE_W - 60;
                    const fireY = BASE_H - 80;
                    ctx.fillStyle = this.touchFire.active ? 'rgba(255,100,50,0.5)' : 'rgba(255,255,255,0.25)';
                    ctx.beginPath();
                    ctx.arc(fireX, fireY, 32, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,200,150,0.7)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 14px Georgia';
                    ctx.textAlign = 'center';
                    ctx.fillText('FIRE', fireX, fireY + 5);
                }
            }

            // ────────────────────────────────────
            // MAIN GAME LOOP
            // ────────────────────────────────────
            const game = new Game();
            let lastTime = performance.now();

            function gameLoop(timestamp) {
                let dt = (timestamp - lastTime) / 1000;
                if (dt > 0.2) dt = 0.2;
                if (dt <= 0) dt = 0.016;
                lastTime = timestamp;

                game.update(dt);
                resizeCanvas();
                game.draw();
                if (game.state === 'playing') {
                    game.drawTouchControls();
                }

                requestAnimationFrame(gameLoop);
            }

            // ────────────────────────────────────
            // INPUT HANDLING
            // ────────────────────────────────────
            window.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                game.keys[key] = true;
                if (key === 'p') {
                    if (game.state === 'playing') {
                        game.paused = !game.paused;
                        if (game.paused) audio.stopMusic();
                        else audio.startMusic();
                    }
                }
                if (key === ' ' || key === 'spacebar') {
                    game.keys['space'] = true;
                    e.preventDefault();
                }
                if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(key)) {
                    e.preventDefault();
                }
            });

            window.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();
                game.keys[key] = false;
                if (key === ' ') game.keys['space'] = false;
            });

            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const mx = (e.clientX - rect.left) / canvasW * BASE_W;
                const my = (e.clientY - rect.top) / canvasH * BASE_H;
                game.handleClick(mx, my);
            });

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                game.handleTouchStart(e.touches);
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                game.handleTouchMove(e.touches);
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                game.handleTouchEnd(e.touches);
            }, { passive: false });

            canvas.addEventListener('touchcancel', (e) => {
                game.handleTouchEnd(e.touches);
            });

            // ────────────────────────────────────
            // INITIALIZATION
            // ────────────────────────────────────
            game.init();
            game.state = 'menu';
            game.transitionAlpha = 1;
            game.transitionDir = -1;
            game.cameraX = WORLD_W / 2;
            game.cameraY = WORLD_H / 2;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);

            console.log('🏴‍☠️ Captain Jack Sparrow - The Black Pearl awaits!');
            console.log('Click to set sail, or use WASD + Space to play.');
            console.log('Collect treasure, sink enemy ships, and survive the seven seas!');
        })();
    </script>
</body>
</html>
