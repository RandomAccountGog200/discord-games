<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destroy Milo's Girlfriends 8</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="hud"></div>
  <div id="menu">
    <h1>Destroy Milo's Girlfriends 8</h1>
    <p>Milo has too many girlfriends. Stop him by destroying them!</p>
    <button id="startBtn">Start Game</button>
    <button id="howBtn">How to Play</button>
    <p>High Score: <span id="highScore">0</span></p>
  </div>
  <div id="gameOver">
    <h1>Game Over</h1>
    <p>You didn't stop Milo.</p>
    <p>Score: <span id="finalScore">0</span></p>
    <p>High Score: <span id="highScoreFinal">0</span></p>
    <button id="restartBtn">Play Again</button>
    <button id="menuBtn">Menu</button>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
