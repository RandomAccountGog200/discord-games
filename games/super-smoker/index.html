                    ctx.shadowBlur = 30;
                    ctx.font = 'bold 48px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('GAME OVER', this.worldW / 2, this.worldH / 2 - 40);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 22px monospace';
                    ctx.fillText('SCORE: ' + this.score, this.worldW / 2, this.worldH / 2 + 15);
                    if (this.score >= this.highScore) {
                        ctx.fillStyle = '#ffcc00';
                        ctx.font = 'bold 18px monospace';
                        ctx.fillText('★ NEW HIGH SCORE! ★', this.worldW / 2, this.worldH / 2 + 45);
                    } else {
                        ctx.fillStyle = '#aaa';
                        ctx.font = '16px monospace';
                        ctx.fillText('HIGH SCORE: ' + this.highScore, this.worldW / 2, this.worldH / 2 + 45);
                    }
                    ctx.fillStyle = '#ddd';
                    ctx.font = '15px monospace';
                    ctx.fillText('Press SPACE or tap to continue', this.worldW / 2, this.worldH / 2 + 80);
                }
                _renderTitle(shakeX, shakeY) {
                    const grad = ctx.createRadialGradient(this.worldW / 2, this.worldH / 2, 30, this.worldW / 2, this
                        .worldH / 2, this.worldW);
                    grad.addColorStop(0, '#1c1028');
                    grad.addColorStop(1, '#050510');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, this.worldW, this.worldH);
                    for (const p of this.titleParticles) {
                        const a = Math.max(0, p.life / p.maxLife);
                        ctx.save();
                        ctx.globalAlpha = a * 0.5;
                        ctx.fillStyle = p.color;
                        ctx.shadowColor = p.color;
                        ctx.shadowBlur = p.size * 2;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                    const titleY = this.worldH * 0.32;
                    ctx.save();
                    ctx.shadowColor = '#ff6600';
                    ctx.shadowBlur = 40 + Math.sin(this.time * 2) * 15;
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 56px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('SUPER', this.worldW / 2, titleY - 15);
                    ctx.fillStyle = '#ff6600';
                    ctx.shadowColor = '#ff4400';
                    ctx.shadowBlur = 50 + Math.sin(this.time * 2.3) * 18;
                    ctx.fillText('SMOKER', this.worldW / 2, titleY + 45);
                    ctx.shadowBlur = 0;
                    ctx.restore();
                    const pulse = 1 + Math.sin(this.time * 3) * 0.15;
                    ctx.fillStyle = '#fff';
                    ctx.font = `bold ${Math.floor(18*pulse)}px monospace`;
                    ctx.textAlign = 'center';
                    ctx.fillText('Press SPACE or tap to start', this.worldW / 2, this.worldH * 0.6);
                    ctx.fillStyle = '#aaa';
                    ctx.font = '13px monospace';
                    ctx.fillText('WASD/Arrows = Move | Mouse = Aim & Shoot', this.worldW / 2, this.worldH * 0.68);
                    ctx.fillText('Mobile: Left joystick + Right fire button', this.worldW / 2, this.worldH * 0.73);
                    ctx.fillText('High Score: ' + this.highScore, this.worldW / 2, this.worldH * 0.8);
                    ctx.fillStyle = '#888';
                    ctx.font = '11px monospace';
                    ctx.fillText('P or ESC to pause during game', this.worldW / 2, this.worldH * 0.87);
                }
            }

            // --- Initialize and Run ---
            const game = new Game();
            let lastTime = performance.now();

            function gameLoop(timestamp) {
                let dt = (timestamp - lastTime) / 1000;
                lastTime = timestamp;
                if (dt > 0.15) dt = 0.15;
                if (dt <= 0) dt = 0.016;
                game.update(dt);
                game.render();
                requestAnimationFrame(gameLoop);
            }
            resizeCanvas();
            game.worldW = GAME_WIDTH;
            game.worldH = GAME_HEIGHT;
            requestAnimationFrame(gameLoop);
            console.log('🔥 Super Smoker ready!');
            console.log('   Desktop: WASD/Arrows + Mouse click to shoot');
            console.log('   Mobile: Left joystick + Right fire button');
            console.log('   P or ESC to pause');
            console.log('   High Score: ' + game.highScore);
        })();
    </script>
</body>
</html>
