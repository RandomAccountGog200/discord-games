                joystickThumb.style.transform = 'translate(-50%,-50%)';
                inputX = 0;
                inputY = 0;
            });

            actionBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                actionDown = true;
                actionBtn.style.background = 'rgba(255,120,60,0.9)';
                actionBtn.style.boxShadow = '0 0 40px rgba(255,100,30,0.8)';
                if (game.state === STATE.MENU) {
                    audio.init();
                    audio.playMenuClick();
                    game.startGame();
                }
                if (game.state === STATE.GAMEOVER) {
                    audio.init();
                    audio.playMenuClick();
                    game.startGame();
                }
            }, { passive: false });
            actionBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                actionDown = false;
                actionBtn.style.background = 'rgba(255,60,40,0.7)';
                actionBtn.style.boxShadow = '0 0 30px rgba(255,60,40,0.5)';
            }, { passive: false });
            actionBtn.addEventListener('touchcancel', () => {
                actionDown = false;
                actionBtn.style.background = 'rgba(255,60,40,0.7)';
                actionBtn.style.boxShadow = '0 0 30px rgba(255,60,40,0.5)';
            });

            // Canvas touch for menu/gameover clicks
            canvas.addEventListener('touchstart', (e) => {
                if (e.target === canvas && (game.state === STATE.MENU || game.state === STATE.GAMEOVER || game
                        .state === STATE.PAUSED)) {
                    const pos = getWorldPos(e.changedTouches[0]);
                    game.handleClick(pos.x, pos.y);
                }
            });

            // ──────────────────────────────────────
            // GAME LOOP
            // ──────────────────────────────────────
            let lastTime = performance.now();
            let accumulator = 0;
            const fixedDt = 1 / 60;

            function gameLoop(timestamp) {
                requestAnimationFrame(gameLoop);
                let rawDt = (timestamp - lastTime) / 1000;
                lastTime = timestamp;
                if (rawDt > 0.2) rawDt = 0.2; // Cap to avoid spiral
                if (rawDt <= 0) rawDt = fixedDt;
                accumulator += rawDt;
                while (accumulator >= fixedDt) {
                    accumulator -= fixedDt;
                    // Update input
                    updateInputFromKeys();
                    if (game.state === STATE.PLAYING) {
                        if (game.player) {
                            game.player.setVelocity(inputX, inputY);
                            game.playerLocking = actionDown && game.playerNearCage;
                        }
                        game.update(fixedDt);
                    }
                }
                // Render
                resizeCanvas();
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(canvasW / WORLD_W, canvasH / WORLD_H);
                if (game.state === STATE.MENU) {
                    game.drawMenu(ctx);
                } else if (game.state === STATE.PAUSED) {
                    game.draw(ctx);
                    game.drawPauseScreen(ctx);
                } else if (game.state === STATE.GAMEOVER) {
                    game.draw(ctx);
                    game.drawGameOverScreen(ctx);
                } else {
                    game.draw(ctx);
                    if (game.state === STATE.WAVE_COMPLETE) {
                        // Wave complete overlay is drawn within draw()
                    }
                }
            }

            // ──────────────────────────────────────
            // INITIAL SETUP
            // ──────────────────────────────────────
            function detectMobile() {
                return /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent) || window.innerWidth < 768;
            }
            if (detectMobile()) {
                mobileControls.style.display = 'block';
            }
            resizeCanvas();
            // Initial draw
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(canvasW / WORLD_W, canvasH / WORLD_H);
            game.drawMenu(ctx);
            // Start loop
            requestAnimationFrame(gameLoop);

            console.log('🦁 Baking Soda Men: Dinamo Zagreb Lockdown 🦁');
            console.log('Lock the cage monster before Malta reaches 59 million!');
            console.log('Los pollos are on the field! 🐔');
            console.log('WASD/Arrows: Move | SPACE/E near cage: Lock it | ESC: Pause');
        })();
    </script>
</body>
</html>
