<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Oswald: Stepping Reduced</title>
    <style>
        :root {
            --bg: #1a1a2e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #game-container {
            position: relative;
            width: 100vmin;
            height: 100vmin;
            max-width: 500px;
            max-height: 850px;
            aspect-ratio: 480 / 800;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(100, 140, 255, 0.3), 0 0 80px rgba(100, 140, 255, 0.1);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            const INTERNAL_W = 480;
            const INTERNAL_H = 800;

            function resizeCanvas() {
                const container = document.getElementById('game-container');
                const rect = container.getBoundingClientRect();
                const scale = Math.min(rect.width / INTERNAL_W, rect.height / INTERNAL_H);
                canvas.width = INTERNAL_W;
                canvas.height = INTERNAL_H;
                canvas.style.width = (INTERNAL_W * scale) + 'px';
                canvas.style.height = (INTERNAL_H * scale) + 'px';
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 100));

            // === AUDIO ENGINE ===
            let audioCtx = null;

            function getAudioCtx() {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                return audioCtx;
            }

            function playSound(freq, type, duration, vol = 0.08, glideFreq = null) {
                try {
                    const ctx = getAudioCtx();
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, now);
                    if (glideFreq) osc.frequency.linearRampToValueAtTime(glideFreq, now + duration);
                    gain.gain.setValueAtTime(vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + duration);
                } catch (e) { /* silent */ }
            }

            function sfxJump() { playSound(300, 'sine', 0.15, 0.06, 600); }

            function sfxLand() { playSound(80, 'triangle', 0.12, 0.05, 40);
                playSound(160, 'sine', 0.08, 0.06); }

            function sfxShrink() { playSound(200, 'sawtooth', 0.08, 0.03, 100); }

            function sfxDisappear() { playSound(60, 'square', 0.15, 0.08, 30); }

            function sfxGameOver() { playSound(100, 'sawtooth', 0.4, 0.1, 50);
                playSound(80, 'square', 0.3, 0.25, 30); }

            function sfxScore() { playSound(500, 'sine', 0.1, 0.06, 800); }

            function sfxStep() { playSound(140, 'triangle', 0.06, 0.04); }

            // === GAME STATE ===
            const STATE = { TITLE: 'title', PLAYING: 'playing', GAMEOVER: 'gameover' };
            let gameState = STATE.TITLE;
            let score = 0;
            let highScore = 0;
            let comboCount = 0;
            let comboTimer = 0;
            let screenShake = 0;
            let titleBounce = 0;
            let gameTime = 0;

            // === INPUT ===
            const keys = {};
            let touchLeft = false;
            let touchRight = false;
            let touchJump = false;
            let touchJumpPressed = false;
            let touchLeftPressed = false;
            let touchRightPressed = false;

            window.addEventListener('keydown', e => {
                keys[e.key] = true;
                if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === ' ') e.preventDefault();
                if (gameState === STATE.TITLE && (e.key === ' ' || e.key === 'Enter')) {
                    startGame();
                }
                if (gameState === STATE.GAMEOVER && (e.key === ' ' || e.key === 'Enter' || e.key === 'r')) {
                    restartGame();
                }
            });
            window.addEventListener('keyup', e => { keys[e.key] = false; });

            function getCanvasCoords(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = INTERNAL_W / rect.width;
                const scaleY = INTERNAL_H / rect.height;
                return {
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                };
            }

            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                if (gameState === STATE.TITLE) { startGame(); return; }
                if (gameState === STATE.GAMEOVER) { restartGame(); return; }
                for (let i = 0; i < e.touches.length; i++) {
                    const coords = getCanvasCoords(e.touches[i]);
                    handleTouchDown(coords.x, coords.y);
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                touchLeft = false;
                touchRight = false;
                touchJump = false;
                for (let i = 0; i < e.touches.length; i++) {
                    const coords = getCanvasCoords(e.touches[i]);
                    handleTouchDown(coords.x, coords.y);
                }
            }, { passive: false });

            canvas.addEventListener('touchend', e => {
                e.preventDefault();
                touchLeft = false;
                touchRight = false;
                touchJump = false;
                touchJumpPressed = false;
            });
            canvas.addEventListener('touchcancel', () => {
                touchLeft = false;
                touchRight = false;
                touchJump = false;
                touchJumpPressed = false;
            });

            canvas.addEventListener('mousedown', e => {
                if (gameState === STATE.TITLE) { startGame(); return; }
                if (gameState === STATE.GAMEOVER) { restartGame(); return; }
                const coords = getCanvasCoords(e);
                handleTouchDown(coords.x, coords.y);
            });
            canvas.addEventListener('mousemove', e => {
                touchLeft = false;
                touchRight = false;
                touchJump = false;
                if (e.buttons & 1) {
                    const coords = getCanvasCoords(e);
                    handleTouchDown(coords.x, coords.y);
                }
            });
            canvas.addEventListener('mouseup', () => {
                touchLeft = false;
                touchRight = false;
                touchJump = false;
                touchJumpPressed = false;
            });

            function handleTouchDown(x, y) {
                if (y > INTERNAL_H * 0.7) {
                    if (x < INTERNAL_W * 0.33) { touchLeft = true;
                        touchLeftPressed = true; } else if (x < INTERNAL_W * 0.66) { touchJump = true;
                        touchJumpPressed = true; } else { touchRight = true;
                        touchRightPressed = true; }
                } else if (y > INTERNAL_H * 0.35) {
                    touchJump = true;
                    touchJumpPressed = true;
                    if (x < INTERNAL_W * 0.4) touchLeft = true;
                    if (x > INTERNAL_W * 0.6) touchRight = true;
                } else {
                    touchJump = true;
                    touchJumpPressed = true;
                }
            }

            function isJumpPressed() {
                return keys[' '] || keys['ArrowUp'] || keys['w'] || keys['W'] || touchJumpPressed;
            }

            function isLeftHeld() {
                return keys['ArrowLeft'] || keys['a'] || keys['A'] || touchLeft;
            }

            function isRightHeld() {
                return keys['ArrowRight'] || keys['d'] || keys['D'] || touchRight;
            }

            // === OSWALD ===
            const oswald = {
                x: INTERNAL_W / 2,
                y: 650,
                vx: 0,
                vy: 0,
                width: 32,
                height: 38,
                onPlatform: null,
                isJumping: false,
                facingRight: true,
                earFlop: 0,
                squish: 0,
                trailPositions: [],
            };

            function resetOswald() {
                oswald.x = INTERNAL_W / 2;
                oswald.y = 650;
                oswald.vx = 0;
                oswald.vy = 0;
                oswald.onPlatform = null;
                oswald.isJumping = false;
                oswald.facingRight = true;
                oswald.earFlop = 0;
                oswald.squish = 0;
                oswald.trailPositions = [];
            }

            // === PLATFORMS ===
            const PLATFORM_TYPES = {
                NORMAL: {
                    name: 'normal',
                    color: '#5cb8ff',
                    glowColor: '#8ad4ff',
                    shrinkDuration: 150,
                    widthRange: [90, 140],
                },
                FRAGILE: {
                    name: 'fragile',
                    color: '#ff6b6b',
                    glowColor: '#ff9999',
                    shrinkDuration: 70,
                    widthRange: [65, 100],
                },
                STURDY: {
                    name: 'sturdy',
                    color: '#5cff8a',
                    glowColor: '#8affb0',
                    shrinkDuration: Infinity,
                    widthRange: [100, 150],
                    lifeDuration: 420,
                },
            };

            let platforms = [];
            let cameraY = 300;
            let maxHeightReached = 650;
            let highestPlatformY = 650;
            let platformIdCounter = 0;

            function createPlatform(x, y, type) {
                const t = PLATFORM_TYPES[type];
                const width = t.widthRange[0] + Math.random() * (t.widthRange[1] - t.widthRange[0]);
                return {
                    id: platformIdCounter++,
                    x: x,
                    y: y,
                    fullWidth: width,
                    currentHalfWidth: width / 2,
                    type: type,
                    color: t.color,
                    glowColor: t.glowColor,
                    shrinkDuration: t.shrinkDuration,
                    lifeDuration: t.lifeDuration || Infinity,
                    stepped: false,
                    shrinkStartTime: 0,
                    lifeStartTime: gameTime,
                    alpha: 1,
                    particlesEmitted: false,
                };
            }

            function getRandomPlatformType() {
                const roll = Math.random();
                if (roll < 0.10) return 'STURDY';
                if (roll < 0.32) return 'FRAGILE';
                return 'NORMAL';
            }

            function generateInitialPlatforms() {
                platforms = [];
                platformIdCounter = 0;
                // Starting platform
                const startPlat = createPlatform(INTERNAL_W / 2, 680, 'STURDY');
                startPlat.shrinkDuration = 200;
                startPlat.lifeDuration = 600;
                platforms.push(startPlat);
                highestPlatformY = 680;
                maxHeightReached = 680;

                // Generate platforms upward
                let lastY = 680;
                for (let i = 0; i < 12; i++) {
                    const gap = 70 + Math.random() * 55;
                    const newY = lastY - gap;
                    const newX = 40 + Math.random() * (INTERNAL_W - 80);
                    const pType = i < 3 ? 'NORMAL' : getRandomPlatformType();
                    const plat = createPlatform(newX, newY, pType);
                    platforms.push(plat);
                    lastY = newY;
                    if (newY < highestPlatformY) highestPlatformY = newY;
                }
                cameraY = 680 - 500;
                if (cameraY < 0) cameraY = 0;
            }

            function spawnPlatformsAbove() {
                const visibleTop = cameraY - 30;
                while (highestPlatformY > visibleTop - 40) {
                    const gap = 65 + Math.random() * 60;
                    const newY = highestPlatformY - gap;
                    if (newY < -2000) break;
                    const newX = 35 + Math.random() * (INTERNAL_W - 70);
                    const pType = getRandomPlatformType();
                    platforms.push(createPlatform(newX, newY, pType));
                    highestPlatformY = newY;
                }
            }

            function cleanupPlatforms() {
                const removeBelow = cameraY + INTERNAL_H + 150;
                platforms = platforms.filter(p => {
                    if (p.y > removeBelow) return false;
                    if (p.currentHalfWidth <= 0.5 && p.stepped) return false;
                    if (p.type === 'STURDY' && p.lifeDuration !== Infinity && (gameTime - p.lifeStartTime >
                            p.lifeDuration)) {
                        if (!p.particlesEmitted && p.stepped) {
                            emitPlatformParticles(p);
                            p.particlesEmitted = true;
                        }
                        return false;
                    }
                    return true;
                });
            }

            function emitPlatformParticles(plat) {
                const count = 12;
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
                    const speed = 2 + Math.random() * 4;
                    particles.push({
                        x: plat.x + (Math.random() - 0.5) * plat.currentHalfWidth * 2,
                        y: plat.y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 3,
                        life: 25 + Math.random() * 20,
                        maxLife: 45,
                        size: 2 + Math.random() * 3,
                        color: plat.glowColor,
                    });
                }
                sfxDisappear();
            }

            // === PARTICLES ===
            let particles = [];

            function spawnLandParticles(x, y) {
                const count = 8;
                for (let i = 0; i < count; i++) {
                    const angle = -Math.PI * 0.5 + (Math.random() - 0.5) * Math.PI * 0.8;
                    const speed = 1.5 + Math.random() * 3;
                    particles.push({
                        x: x + (Math.random() - 0.5) * 20,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 18 + Math.random() * 15,
                        maxLife: 33,
                        size: 1.5 + Math.random() * 2.5,
                        color: '#ffffff',
                    });
                }
            }

            function spawnJumpParticles(x, y) {
                const count = 6;
                for (let i = 0; i < count; i++) {
                    const angle = -Math.PI * 0.7 + Math.random() * Math.PI * 0.4;
                    const speed = 2 + Math.random() * 4;
                    particles.push({
                        x: x + (Math.random() - 0.5) * 16,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 2,
                        life: 15 + Math.random() * 12,
                        maxLife: 27,
                        size: 1.5 + Math.random() * 2,
                        color: '#ffe0a0',
                    });
                }
            }

            function spawnShrinkParticles(plat) {
                if (Math.random() < 0.35) {
                    const edgeX = plat.x + (Math.random() > 0.5 ? 1 : -1) * plat.currentHalfWidth;
                    particles.push({
                        x: edgeX,
                        y: plat.y + (Math.random() - 0.5) * 4,
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: -1 - Math.random() * 3,
                        life: 12 + Math.random() * 10,
                        maxLife: 22,
                        size: 1 + Math.random() * 2,
                        color: plat.glowColor,
                    });
                }
            }

            function updateParticles() {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.08;
                    p.life--;
                    if (p.life <= 0) particles.splice(i, 1);
                }
                if (particles.length > 120) particles.splice(0, particles.length - 120);
            }

            // === GAME FUNCTIONS ===
            function startGame() {
                gameState = STATE.PLAYING;
                score = 0;
                comboCount = 0;
                comboTimer = 0;
                screenShake = 0;
                gameTime = 0;
                particles = [];
                resetOswald();
                generateInitialPlatforms();
                oswald.onPlatform = platforms[0];
                oswald.y = platforms[0].y - oswald.height;
                oswald.x = platforms[0].x;
                oswald.vy = 0;
                maxHeightReached = oswald.y;
                cameraY = oswald.y - 320;
                if (cameraY < 0) cameraY = 0;
                platforms[0].stepped = true;
                platforms[0].shrinkStartTime = gameTime;
            }

            function restartGame() {
                startGame();
            }

            function gameOver() {
                gameState = STATE.GAMEOVER;
                screenShake = 20;
                sfxGameOver();
                if (score > highScore) highScore = score;
                // Emit burst particles
                for (let i = 0; i < 30; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 3 + Math.random() * 7;
                    particles.push({
                        x: oswald.x,
                        y: oswald.y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 5,
                        life: 30 + Math.random() * 40,
                        maxLife: 70,
                        size: 2 + Math.random() * 5,
                        color: Math.random() < 0.5 ? '#ff6b6b' : '#ffcc00',
                    });
                }
            }

            // === UPDATE ===
            const GRAVITY = 0.42;
            const JUMP_VELOCITY = -10.5;
            const MOVE_SPEED = 4.5;
            const MAX_FALL_SPEED = 14;

            function updateOswald() {
                if (gameState !== STATE.PLAYING) return;

                // Horizontal movement
                let moveDir = 0;
                if (isLeftHeld()) moveDir = -1;
                if (isRightHeld()) moveDir += 1;
                moveDir = Math.max(-1, Math.min(1, moveDir));

                oswald.vx = moveDir * MOVE_SPEED;
                if (moveDir !== 0) oswald.facingRight = moveDir > 0;

                // Apply friction when not moving
                if (moveDir === 0 && oswald.onPlatform) {
                    oswald.vx *= 0.85;
                }

                // Jump
                if (isJumpPressed() && oswald.onPlatform && !oswald.isJumping) {
                    oswald.vy = JUMP_VELOCITY;
                    oswald.isJumping = true;
                    oswald.squish = -6;
                    spawnJumpParticles(oswald.x, oswald.y + oswald.height);
                    sfxJump();
                    if (oswald.onPlatform && oswald.onPlatform.type === 'STURDY' && oswald.onPlatform.stepped) {
                        oswald.onPlatform.stepped = true;
                        oswald.onPlatform.shrinkStartTime = gameTime;
                        oswald.onPlatform.shrinkDuration = 100;
                        oswald.onPlatform.type = 'NORMAL';
                        oswald.onPlatform.color = '#ffaa44';
                        oswald.onPlatform.glowColor = '#ffcc88';
                    }
                    oswald.onPlatform = null;
                }

                // Apply gravity
                if (!oswald.onPlatform) {
                    oswald.vy += GRAVITY;
                    if (oswald.vy > MAX_FALL_SPEED) oswald.vy = MAX_FALL_SPEED;
                } else {
                    oswald.vy = 0;
                    oswald.isJumping = false;
                }

                // Update position
                oswald.x += oswald.vx;
                oswald.y += oswald.vy;

                // Wrap horizontally
                if (oswald.x < -oswald.width) oswald.x = INTERNAL_W + oswald.width;
                if (oswald.x > INTERNAL_W + oswald.width) oswald.x = -oswald.width;

                // Clamp horizontally
                oswald.x = Math.max(-oswald.width, Math.min(INTERNAL_W + oswald.width, oswald.x));

                // Squish recovery
                oswald.squish += (0 - oswald.squish) * 0.3;
                if (Math.abs(oswald.squish) < 0.1) oswald.squish = 0;

                // Ear flop animation
                if (!oswald.onPlatform) {
                    oswald.earFlop += (1 - oswald.earFlop) * 0.2;
                } else {
                    oswald.earFlop += (0 - oswald.earFlop) * 0.25;
                }

                // Trail
                if (!oswald.onPlatform && Math.abs(oswald.vy) > 1) {
                    oswald.trailPositions.push({ x: oswald.x, y: oswald.y + oswald.height / 2, life: 8, maxLife: 8 });
                }
                for (let i = oswald.trailPositions.length - 1; i >= 0; i--) {
                    oswald.trailPositions[i].life--;
                    if (oswald.trailPositions[i].life <= 0) oswald.trailPositions.splice(i, 1);
                }
                if (oswald.trailPositions.length > 15) oswald.trailPositions.splice(0, oswald.trailPositions.length - 15);

                // Check platform collisions (only when falling or standing)
                if (!oswald.onPlatform || oswald.vy >= 0) {
                    checkPlatformCollisions();
                }

                // If on a platform that shrank away
                if (oswald.onPlatform) {
                    const plat = oswald.onPlatform;
                    if (plat.stepped && plat.shrinkDuration !== Infinity) {
                        const elapsed = gameTime - plat.shrinkStartTime;
                        const newHalfWidth = (plat.fullWidth / 2) * Math.max(0, 1 - elapsed / plat.shrinkDuration);
                        plat.currentHalfWidth = newHalfWidth;
                        if (newHalfWidth <= 0.5) {
                            emitPlatformParticles(plat);
                            oswald.onPlatform = null;
                            oswald.vy = 1;
                            screenShake = Math.max(screenShake, 8);
                        } else if (Math.abs(oswald.x - plat.x) > newHalfWidth + 2) {
                            oswald.onPlatform = null;
                            oswald.vy = 0.5;
                        }
                    }
                    if (oswald.onPlatform && oswald.onPlatform.type === 'STURDY' && oswald.onPlatform.lifeDuration !==
                        Infinity) {
                        const lifeElapsed = gameTime - oswald.onPlatform.lifeStartTime;
                        if (lifeElapsed > oswald.onPlatform.lifeDuration) {
                            if (!oswald.onPlatform.particlesEmitted) {
                                emitPlatformParticles(oswald.onPlatform);
                                oswald.onPlatform.particlesEmitted = true;
                            }
                            oswald.onPlatform = null;
                            oswald.vy = 1;
                        }
                    }
                }

                // Update max height
                if (oswald.y < maxHeightReached) {
                    const gained = maxHeightReached - oswald.y;
                    if (gained > 5 && oswald.onPlatform) {
                        comboCount++;
                        comboTimer = 45;
                        score += Math.floor(gained) + comboCount * 2;
                        if (comboCount > 3 && comboCount % 3 === 0) sfxScore();
                    }
                    maxHeightReached = oswald.y;
                }

                // Combo timer
                if (comboTimer > 0) {
                    comboTimer--;
                    if (comboTimer <= 0) comboCount = 0;
                }

                // Update camera
                const targetCameraY = oswald.y - 310;
                if (targetCameraY < cameraY) {
                    cameraY += (targetCameraY - cameraY) * 0.15;
                    if (cameraY - targetCameraY < 0.5) cameraY = targetCameraY;
                }
                if (cameraY < -100) cameraY = -100;

                // Death check
                if (oswald.y > cameraY + INTERNAL_H + 60) {
                    gameOver();
                }
                if (oswald.y > 2500) {
                    gameOver();
                }
            }

            function checkPlatformCollisions() {
                const oswaldBottom = oswald.y + oswald.height;
                const oswaldPrevBottom = oswaldBottom - oswald.vy;

                let bestPlat = null;
                let bestDist = Infinity;

                for (const plat of platforms) {
                    const platTop = plat.y;
                    if (oswaldBottom >= platTop - 2 && oswaldPrevBottom <= platTop + 4 && oswald.vy >= -1) {
                        const halfW = plat.currentHalfWidth;
                        if (Math.abs(oswald.x - plat.x) < halfW + oswald.width * 0.35) {
                            const dist = Math.abs(oswaldBottom - platTop);
                            if (dist < bestDist && dist < 18) {
                                bestDist = dist;
                                bestPlat = plat;
                            }
                        }
                    }
                }

                if (bestPlat && bestPlat !== oswald.onPlatform) {
                    // Land on new platform
                    const prevPlat = oswald.onPlatform;
                    oswald.onPlatform = bestPlat;
                    oswald.y = bestPlat.y - oswald.height;
                    oswald.vy = 0;
                    oswald.isJumping = false;
                    oswald.squish = 4;
                    spawnLandParticles(oswald.x, oswald.y + oswald.height);
                    sfxLand();

                    if (!bestPlat.stepped) {
                        bestPlat.stepped = true;
                        bestPlat.shrinkStartTime = gameTime;
                        if (prevPlat && prevPlat !== bestPlat) {
                            sfxStep();
                        }
                    }
                    if (prevPlat && prevPlat !== bestPlat && prevPlat.stepped && prevPlat.shrinkDuration === Infinity &&
                        prevPlat.type === 'STURDY') {
                        prevPlat.shrinkDuration = 80;
                        prevPlat.shrinkStartTime = gameTime;
                        prevPlat.type = 'FRAGILE';
                        prevPlat.color = '#ff8844';
                        prevPlat.glowColor = '#ffaa77';
                    }
                }
            }

            function updatePlatforms() {
                for (const plat of platforms) {
                    if (plat.stepped && plat.shrinkDuration !== Infinity) {
                        const elapsed = gameTime - plat.shrinkStartTime;
                        const newHalfWidth = (plat.fullWidth / 2) * Math.max(0, 1 - elapsed / plat.shrinkDuration);
                        plat.currentHalfWidth = newHalfWidth;
                        if (newHalfWidth < plat.fullWidth * 0.3 && plat.stepped) {
                            spawnShrinkParticles(plat);
                        }
                    }
                    if (plat.type === 'STURDY' && plat.lifeDuration !== Infinity && plat.stepped) {
                        const lifeElapsed = gameTime - plat.lifeStartTime;
                        if (lifeElapsed > plat.lifeDuration * 0.7) {
                            plat.alpha = 1 - (lifeElapsed - plat.lifeDuration * 0.7) / (plat.lifeDuration * 0.3);
                            plat.alpha = Math.max(0.3, plat.alpha);
                        }
                    }
                }
            }

            function update() {
                if (gameState !== STATE.PLAYING && gameState !== STATE.GAMEOVER) return;

                gameTime++;
                updateOswald();
                updatePlatforms();
                updateParticles();
                spawnPlatformsAbove();
                cleanupPlatforms();

                // Screen shake decay
                if (screenShake > 0) {
                    screenShake *= 0.85;
                    if (screenShake < 0.3) screenShake = 0;
                }

                // Title bounce
                if (gameState === STATE.TITLE) {
                    titleBounce += 0.04;
                }
            }

            // === RENDER ===
            function drawBackground() {
                const grad = ctx.createLinearGradient(0, 0, 0, INTERNAL_H);
                const hourProgress = Math.min(1, Math.max(0, (maxHeightReached - 200) / 1800));
                const topColor = lerpColor('#87CEEB', '#1a1a3e', hourProgress);
                const midColor = lerpColor('#b8dff0', '#2d2d5e', hourProgress);
                const botColor = lerpColor('#d4eaf7', '#3d3d6e', hourProgress);
                grad.addColorStop(0, topColor);
                grad.addColorStop(0.5, midColor);
                grad.addColorStop(1, botColor);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, INTERNAL_W, INTERNAL_H);

                // Stars at higher altitudes
                if (hourProgress > 0.2) {
                    const starAlpha = (hourProgress - 0.2) * 1.2;
                    ctx.fillStyle = `rgba(255,255,255,${starAlpha})`;
                    const starSeed = 42;
                    for (let i = 0; i < 60; i++) {
                        const sx = ((i * 173 + starSeed) % INTERNAL_W);
                        const sy = ((i * 97 + starSeed * 3) % 600) - 100 + cameraY * 0.05;
                        const screenY = sy - cameraY;
                        if (screenY > -20 && screenY < INTERNAL_H + 20 && sy < maxHeightReached - 100) {
                            const twinkle = 0.5 + 0.5 * Math.sin(gameTime * 0.03 + i * 1.7);
                            const size = 0.6 + twinkle * 1.4;
                            ctx.globalAlpha = starAlpha * (0.4 + twinkle * 0.6);
                            ctx.beginPath();
                            ctx.arc(sx, screenY, size, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                    ctx.globalAlpha = 1;
                }

                // Distant clouds
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                for (let i = 0; i < 8; i++) {
                    const cx = ((i * 217 + 30) % (INTERNAL_W + 200)) - 100;
                    const cy = ((i * 137 + 80) % 500) + 50 - cameraY * 0.3;
                    const screenY = cy - cameraY;
                    if (screenY > -60 && screenY < INTERNAL_H + 60) {
                        drawCloud(cx, screenY, 40 + (i % 3) * 25);
                    }
                }
            }

            function drawCloud(x, y, size) {
                ctx.beginPath();
                ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
                ctx.arc(x + size * 0.35, y - size * 0.2, size * 0.4, 0, Math.PI * 2);
                ctx.arc(x + size * 0.6, y, size * 0.45, 0, Math.PI * 2);
                ctx.arc(x + size * 0.3, y + size * 0.15, size * 0.35, 0, Math.PI * 2);
                ctx.fill();
            }

            function lerpColor(c1, c2, t) {
                const r1 = parseInt(c1.slice(1, 3), 16);
                const g1 = parseInt(c1.slice(3, 5), 16);
                const b1 = parseInt(c1.slice(5, 7), 16);
                const r2 = parseInt(c2.slice(1, 3), 16);
                const g2 = parseInt(c2.slice(3, 5), 16);
                const b2 = parseInt(c2.slice(5, 7), 16);
                const r = Math.round(r1 + (r2 - r1) * t);
                const g = Math.round(g1 + (g2 - g1) * t);
                const b = Math.round(b1 + (b2 - b1) * t);
                return `rgb(${r},${g},${b})`;
            }

            function drawPlatforms() {
                for (const plat of platforms) {
                    const screenX = plat.x;
                    const screenY = plat.y - cameraY;
                    if (screenY < -30 || screenY > INTERNAL_H + 30) continue;

                    const hw = plat.currentHalfWidth;
                    const h = 12;
                    const alpha = plat.alpha;

                    ctx.save();
                    ctx.globalAlpha = alpha;

                    // Glow
                    const glowGrad = ctx.createRadialGradient(screenX, screenY, hw * 0.3, screenX, screenY, hw * 1.3);
                    glowGrad.addColorStop(0, plat.glowColor);
                    glowGrad.addColorStop(1, 'transparent');
                    ctx.fillStyle = glowGrad;
                    ctx.fillRect(screenX - hw * 1.4, screenY - h * 0.8, hw * 2.8, h * 2.5);

                    // Platform body
                    const bodyGrad = ctx.createLinearGradient(screenX, screenY - h / 2, screenX, screenY + h / 2);
                    bodyGrad.addColorStop(0, plat.glowColor);
                    bodyGrad.addColorStop(0.3, plat.color);
                    bodyGrad.addColorStop(1, '#333');
                    ctx.fillStyle = bodyGrad;
                    ctx.beginPath();
                    const r = h / 2;
                    ctx.moveTo(screenX - hw + r, screenY - r);
                    ctx.lineTo(screenX + hw - r, screenY - r);
                    ctx.arcTo(screenX + hw, screenY - r, screenX + hw, screenY + r, r);
                    ctx.lineTo(screenX + hw, screenY + r);
                    ctx.arcTo(screenX + hw, screenY + h, screenX + hw - r, screenY + h, r);
                    ctx.lineTo(screenX - hw + r, screenY + h);
                    ctx.arcTo(screenX - hw, screenY + h, screenX - hw, screenY + r, r);
                    ctx.lineTo(screenX - hw, screenY - r);
                    ctx.arcTo(screenX - hw, screenY - r, screenX - hw + r, screenY - r, r);
                    ctx.closePath();
                    ctx.fill();

                    // Top highlight
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.fillRect(screenX - hw + 4, screenY - r, hw * 2 - 8, r * 0.7);

                    // Shrinking edge indicators
                    if (plat.stepped && plat.shrinkDuration !== Infinity) {
                        const elapsed = gameTime - plat.shrinkStartTime;
                        const progress = Math.min(1, elapsed / plat.shrinkDuration);
                        if (progress > 0.4) {
                            const edgeAlpha = (progress - 0.4) * 1.6;
                            ctx.fillStyle = `rgba(255,100,60,${edgeAlpha})`;
                            ctx.beginPath();
                            ctx.arc(screenX - hw, screenY, 3, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.beginPath();
                            ctx.arc(screenX + hw, screenY, 3, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }

                    // Sturdy indicator
                    if (plat.type === 'STURDY' && plat.shrinkDuration === Infinity && !plat.stepped) {
                        ctx.fillStyle = 'rgba(255,255,255,0.5)';
                        ctx.fillRect(screenX - 8, screenY - r - 6, 16, 4);
                        ctx.fillRect(screenX - 4, screenY - r - 10, 8, 8);
                    }

                    ctx.restore();
                }
            }

            function drawOswald() {
                if (gameState === STATE.GAMEOVER && gameTime % 3 < 1) return;
                const sx = oswald.x;
                const sy = oswald.y - cameraY;
                if (sy < -60 || sy > INTERNAL_H + 60) return;

                const squishX = oswald.squish * 0.4;
                const squishY = -oswald.squish * 0.3;

                ctx.save();
                ctx.translate(sx, sy + oswald.height / 2);
                ctx.scale(1 + squishX * 0.01, 1 + squishY * 0.01);
                ctx.translate(0, -oswald.height / 2);

                // Trail
                for (const trail of oswald.trailPositions) {
                    const tx = trail.x - sx;
                    const ty = trail.y - (sy + oswald.height / 2);
                    const alpha = trail.life / trail.maxLife;
                    ctx.fillStyle = `rgba(180,210,255,${alpha * 0.4})`;
                    ctx.beginPath();
                    ctx.arc(tx, ty + oswald.height / 2, oswald.width * 0.3 * alpha, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(0, oswald.height - 2, oswald.width * 0.45, 4, 0, 0, Math.PI * 2);
                ctx.fill();

                // Body (dark gray/black - Oswald colors)
                const bodyGrad = ctx.createRadialGradient(-2, -oswald.height * 0.25, oswald.width * 0.15, 0, 0, oswald.width *
                    0.55);
                bodyGrad.addColorStop(0, '#4a4a5a');
                bodyGrad.addColorStop(0.5, '#2a2a35');
                bodyGrad.addColorStop(1, '#111118');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                const bodyRadius = oswald.width * 0.48;
                ctx.arc(0, -oswald.height * 0.05, bodyRadius, 0, Math.PI * 2);
                ctx.fill();

                // Blue shorts area
                ctx.fillStyle = '#3355aa';
                ctx.beginPath();
                ctx.ellipse(0, bodyRadius * 0.35, bodyRadius * 0.7, bodyRadius * 0.4, 0, 0, Math.PI);
                ctx.fill();

                // White face patch
                ctx.fillStyle = '#e8e8f0';
                ctx.beginPath();
                ctx.arc(0, -bodyRadius * 0.5, bodyRadius * 0.55, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                const eyeY = -bodyRadius * 0.55;
                const eyeSpacing = bodyRadius * 0.3;
                ctx.fillStyle = '#111';
                ctx.beginPath();
                ctx.arc(-eyeSpacing, eyeY, bodyRadius * 0.18, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(eyeSpacing, eyeY, bodyRadius * 0.18, 0, Math.PI * 2);
                ctx.fill();
                // Eye highlights
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(-eyeSpacing - 1.5, eyeY - 1.5, bodyRadius * 0.07, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(eyeSpacing - 1.5, eyeY - 1.5, bodyRadius * 0.07, 0, Math.PI * 2);
                ctx.fill();

                // Nose
                ctx.fillStyle = '#222';
                ctx.beginPath();
                ctx.arc(0, eyeY + bodyRadius * 0.3, bodyRadius * 0.12, 0, Math.PI * 2);
                ctx.fill();

                // Ears
                const earBaseX = bodyRadius * 0.5;
                const earBaseY = -bodyRadius * 0.85;
                const earLength = bodyRadius * 1.3;
                const earWidth = bodyRadius * 0.25;
                const flopAngle = oswald.earFlop * 0.7;

                // Left ear
                ctx.save();
                ctx.translate(-earBaseX, earBaseY);
                ctx.rotate(-0.3 - flopAngle * 0.6);
                ctx.fillStyle = '#2a2a38';
                ctx.beginPath();
                ctx.roundRect(-earWidth, -earLength, earWidth * 2, earLength + earWidth, earWidth);
                ctx.fill();
                ctx.fillStyle = '#3a3a4a';
                ctx.beginPath();
                ctx.roundRect(-earWidth * 0.7, -earLength + earWidth * 0.3, earWidth * 1.4, earLength * 0.7, earWidth * 0.6);
                ctx.fill();
                ctx.restore();

                // Right ear
                ctx.save();
                ctx.translate(earBaseX, earBaseY);
                ctx.rotate(0.3 + flopAngle * 0.5);
                ctx.fillStyle = '#2a2a38';
                ctx.beginPath();
                ctx.roundRect(-earWidth, -earLength, earWidth * 2, earLength + earWidth, earWidth);
                ctx.fill();
                ctx.fillStyle = '#3a3a4a';
                ctx.beginPath();
                ctx.roundRect(-earWidth * 0.7, -earLength + earWidth * 0.3, earWidth * 1.4, earLength * 0.7, earWidth * 0.6);
                ctx.fill();
                ctx.restore();

                // Feet
                const footY = bodyRadius * 0.7;
                ctx.fillStyle = '#222230';
                ctx.beginPath();
                ctx.ellipse(-bodyRadius * 0.4, footY, bodyRadius * 0.3, bodyRadius * 0.18, -0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(bodyRadius * 0.4, footY, bodyRadius * 0.3, bodyRadius * 0.18, 0.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            function drawParticles() {
                for (const p of particles) {
                    const sx = p.x;
                    const sy = p.y - cameraY;
                    const alpha = p.life / p.maxLife;
                    ctx.fillStyle = p.color.replace(')', `,${alpha})`);
                    if (p.color.startsWith('#')) {
                        const hex = p.color;
                        const r = parseInt(hex.slice(1, 3), 16);
                        const g = parseInt(hex.slice(3, 5), 16);
                        const b = parseInt(hex.slice(5, 7), 16);
                        ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
                    }
                    ctx.beginPath();
                    ctx.arc(sx, sy, p.size * alpha, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawUI() {
                // Score
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 22px "Segoe UI", system-ui, sans-serif';
                ctx.textAlign = 'left';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 4;
                ctx.fillText(`Score: ${Math.floor(score)}`, 16, 40);
                ctx.shadowBlur = 0;

                // Combo
                if (comboCount > 2 && comboTimer > 0) {
                    const comboAlpha = Math.min(1, comboTimer / 20);
                    ctx.fillStyle = `rgba(255,220,80,${comboAlpha})`;
                    ctx.font = 'bold 18px "Segoe UI", system-ui, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`${comboCount}x COMBO!`, INTERNAL_W / 2, 75);
                }

                // High score
                if (highScore > 0) {
                    ctx.fillStyle = 'rgba(255,255,255,0.7)';
                    ctx.font = '13px "Segoe UI", system-ui, sans-serif';
                    ctx.textAlign = 'right';
                    ctx.fillText(`Best: ${Math.floor(highScore)}`, INTERNAL_W - 16, 38);
                }

                // Platform count indicator
                const visiblePlatforms = platforms.filter(p => {
                    const sy = p.y - cameraY;
                    return sy > -20 && sy < INTERNAL_H;
                }).length;
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = '11px "Segoe UI", system-ui, sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(`Platforms ahead: ${visiblePlatforms}`, INTERNAL_W - 16, 58);

                // Mobile controls hint
                const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
                if (isMobile && gameState === STATE.PLAYING) {
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.font = '10px "Segoe UI", system-ui, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('◀ TAP LEFT | TAP MID/RIGHT ▶ | TAP TOP = JUMP', INTERNAL_W / 2, INTERNAL_H - 10);
                }
            }

            function drawTitleScreen() {
                // Darken
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.fillRect(0, 0, INTERNAL_W, INTERNAL_H);

                // Title
                const titleY = 220 + Math.sin(titleBounce) * 20;
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 36px "Segoe UI", system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(80,140,255,0.7)';
                ctx.shadowBlur = 20;
                ctx.fillText('OSWALD', INTERNAL_W / 2, titleY);
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#ffcc44';
                ctx.font = 'bold 22px "Segoe UI", system-ui, sans-serif';
                ctx.fillText('Stepping Reduced', INTERNAL_W / 2, titleY + 40);

                // Subtitle
                ctx.fillStyle = '#ddd';
                ctx.font = '15px "Segoe UI", system-ui, sans-serif';
                ctx.fillText('Keep stepping! Platforms shrink beneath you!', INTERNAL_W / 2, titleY + 80);

                // Instructions
                const instY = titleY + 150;
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px "Segoe UI", system-ui, sans-serif';
                const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
                if (isMobile) {
                    ctx.fillText('👆 Tap to Start', INTERNAL_W / 2, instY);
                    ctx.fillText('Tap left/right to move • Tap to jump', INTERNAL_W / 2, instY + 40);
                } else {
                    ctx.fillText('Press SPACE or ENTER to Start', INTERNAL_W / 2, instY);
                    ctx.fillText('← → or A/D to move • SPACE/↑ to jump', INTERNAL_W / 2, instY + 35);
                }

                // Platform types legend
                const legendY = instY + 90;
                ctx.font = '13px "Segoe UI", system-ui, sans-serif';
                ctx.fillStyle = '#5cb8ff';
                ctx.fillText('■ Normal (shrinks)', INTERNAL_W / 2 - 90, legendY);
                ctx.fillStyle = '#ff6b6b';
                ctx.fillText('■ Fragile (fast shrink)', INTERNAL_W / 2 + 80, legendY);
                ctx.fillStyle = '#5cff8a';
                ctx.fillText('■ Sturdy (safe, temporary)', INTERNAL_W / 2, legendY + 28);

                // Draw Oswald preview
                const prevX = INTERNAL_W / 2;
                const prevY = legendY + 100;
                ctx.save();
                ctx.translate(prevX, prevY);
                const br = 18;
                const bodyGrad2 = ctx.createRadialGradient(-1, -br * 0.2, br * 0.15, 0, 0, br * 0.55);
                bodyGrad2.addColorStop(0, '#4a4a5a');
                bodyGrad2.addColorStop(0.5, '#2a2a35');
                bodyGrad2.addColorStop(1, '#111118');
                ctx.fillStyle = bodyGrad2;
                ctx.beginPath();
                ctx.arc(0, -2, br, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#3355aa';
                ctx.beginPath();
                ctx.ellipse(0, br * 0.35, br * 0.7, br * 0.4, 0, 0, Math.PI);
                ctx.fill();
                ctx.fillStyle = '#e8e8f0';
                ctx.beginPath();
                ctx.arc(0, -br * 0.5, br * 0.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#111';
                ctx.beginPath();
                ctx.arc(-br * 0.28, -br * 0.55, br * 0.16, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(br * 0.28, -br * 0.55, br * 0.16, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(-br * 0.28 - 1, -br * 0.55 - 1.5, br * 0.06, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(br * 0.28 - 1, -br * 0.55 - 1.5, br * 0.06, 0, Math.PI * 2);
                ctx.fill();
                // ears
                ctx.fillStyle = '#2a2a38';
                ctx.fillRect(-br * 0.5 - 4, -br * 1.6, 8, br * 1.2);
                ctx.fillRect(br * 0.5 - 4, -br * 1.5, 8, br * 1.2);
                ctx.restore();

                // Pulsing "tap to start"
                const pulse = 0.6 + 0.4 * Math.sin(titleBounce * 2);
                ctx.fillStyle = `rgba(255,255,255,${pulse})`;
                ctx.font = 'bold 17px "Segoe UI", system-ui, sans-serif';
                ctx.fillText(isMobile ? 'TAP ANYWHERE' : 'PRESS SPACE', INTERNAL_W / 2, prevY + 55);
            }

            function drawGameOverScreen() {
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(0, 0, INTERNAL_W, INTERNAL_H);

                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 38px "Segoe UI", system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(255,60,60,0.6)';
                ctx.shadowBlur = 20;
                ctx.fillText('GAME OVER', INTERNAL_W / 2, 280);
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 24px "Segoe UI", system-ui, sans-serif';
                ctx.fillText(`Score: ${Math.floor(score)}`, INTERNAL_W / 2, 330);

                if (score >= highScore && score > 0) {
                    ctx.fillStyle = '#ffcc44';
                    ctx.font = 'bold 20px "Segoe UI", system-ui, sans-serif';
                    ctx.fillText('🏆 NEW BEST! 🏆', INTERNAL_W / 2, 365);
                } else {
                    ctx.fillStyle = '#ccc';
                    ctx.font = '16px "Segoe UI", system-ui, sans-serif';
                    ctx.fillText(`Best: ${Math.floor(highScore)}`, INTERNAL_W / 2, 365);
                }

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px "Segoe UI", system-ui, sans-serif';
                const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
                ctx.fillText(isMobile ? 'Tap to Retry' : 'Press SPACE or R to Retry', INTERNAL_W / 2, 420);
            }

            function drawScreenShake() {
                if (screenShake > 0.2) {
                    const shakeX = (Math.random() - 0.5) * screenShake;
                    const shakeY = (Math.random() - 0.5) * screenShake;
                    ctx.save();
                    ctx.setTransform(1, 0, 0, 1, shakeX, shakeY);
                }
            }

            function endScreenShake() {
                if (screenShake > 0.2) {
                    ctx.restore();
                }
            }

            function render() {
                ctx.clearRect(0, 0, INTERNAL_W, INTERNAL_H);
                drawBackground();
                drawScreenShake();
                drawPlatforms();
                drawParticles();
                if (gameState === STATE.PLAYING || gameState === STATE.GAMEOVER) {
                    drawOswald();
                }
                endScreenShake();
                drawUI();

                if (gameState === STATE.TITLE) {
                    drawTitleScreen();
                }
                if (gameState === STATE.GAMEOVER) {
                    drawGameOverScreen();
                }
            }

            // === GAME LOOP ===
            function gameLoop() {
                update();
                render();
                requestAnimationFrame(gameLoop);
            }

            // === INIT ===
            function init() {
                resetOswald();
                generateInitialPlatforms();
                oswald.onPlatform = platforms[0];
                oswald.y = platforms[0].y - oswald.height;
                oswald.x = platforms[0].x;
                oswald.vy = 0;
                maxHeightReached = oswald.y;
                cameraY = oswald.y - 340;
                if (cameraY < 0) cameraY = 0;
                gameState = STATE.TITLE;
                score = 0;
                comboCount = 0;
                comboTimer = 0;
                screenShake = 0;
                gameTime = 0;
                particles = [];
                platforms[0].stepped = true;
                platforms[0].shrinkStartTime = 0;
            }

            init();
            gameLoop();

            console.log('🐰 Oswald: Stepping Reduced - Ready!');
            console.log('   Help Oswald keep stepping! Platforms shrink beneath him.');
            console.log('   Desktop: Arrow keys + Space | Mobile: Touch controls');
        })();
    </script>
</body>
</html>
