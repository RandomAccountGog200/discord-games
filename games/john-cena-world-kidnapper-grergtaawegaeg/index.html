<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JOHN CENA: WORLD KIDNAPPER - grergtaawegaega</title>
    <style>
        :root {
            --bg: #0a0a0a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: 'Courier New', monospace;
        }
        #game-container {
            position: relative;
            width: 100vmin;
            height: 62.5vmin;
            max-width: 960px;
            max-height: 600px;
            min-width: 320px;
            min-height: 200px;
            border: 3px solid #444;
            border-radius: 4px;
            box-shadow: 0 0 40px rgba(255, 100, 0, 0.3), 0 0 80px rgba(255, 50, 0, 0.15);
            background: #111;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: auto;
        }
        #mobile-controls {
            display: none;
            position: absolute;
            bottom: 8px;
            left: 0;
            right: 0;
            pointer-events: none;
            z-index: 10;
            padding: 0 10px;
            justify-content: space-between;
            align-items: flex-end;
        }
        .dpad {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            pointer-events: all;
        }
        .dpad-row {
            display: flex;
            gap: 2px;
        }
        .dpad-btn {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 8px;
            color: #fff;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.1s;
            pointer-events: all;
        }
        .dpad-btn:active {
            background: rgba(255, 255, 255, 0.35);
        }
        .dpad-center {
            width: 42px;
            height: 42px;
            opacity: 0;
            pointer-events: none;
        }
        .action-btns {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            pointer-events: all;
        }
        .action-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.5);
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.1s;
            pointer-events: all;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.7);
        }
        .action-btn.punch {
            background: rgba(255, 150, 30, 0.5);
            border-color: rgba(255, 180, 60, 0.7);
        }
        .action-btn.kick {
            background: rgba(255, 60, 30, 0.5);
            border-color: rgba(255, 100, 50, 0.7);
        }
        .action-btn.special {
            background: rgba(200, 30, 255, 0.5);
            border-color: rgba(220, 100, 255, 0.7);
            font-size: 11px;
        }
        .action-btn:active {
            transform: scale(0.9);
        }
        @media (max-width: 768px) {
            #mobile-controls {
                display: flex;
            }
            #game-container {
                width: 100vw;
                height: 56vw;
                max-height: 55vh;
                border-radius: 0;
                border-left: none;
                border-right: none;
            }
        }
        @media (min-width: 769px) {
            #mobile-controls {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="mobile-controls">
            <div class="dpad">
                <div class="dpad-row">
                    <div class="dpad-center"></div>
                    <button class="dpad-btn" data-key="ArrowUp">▲</button>
                    <div class="dpad-center"></div>
                </div>
                <div class="dpad-row">
                    <button class="dpad-btn" data-key="ArrowLeft">◄</button>
                    <div class="dpad-center"></div>
                    <button class="dpad-btn" data-key="ArrowRight">►</button>
                </div>
                <div class="dpad-row">
                    <div class="dpad-center"></div>
                    <button class="dpad-btn" data-key="ArrowDown">▼</button>
                    <div class="dpad-center"></div>
                </div>
            </div>
            <div class="action-btns">
                <button class="action-btn punch" data-action="punch">PUNCH</button>
                <button class="action-btn kick" data-action="kick">KICK</button>
                <button class="action-btn special" data-action="special">GRERG!</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const container = document.getElementById('game-container');
            const mobileControls = document.getElementById('mobile-controls');

            const INTERNAL_W = 960;
            const INTERNAL_H = 600;

            let scaleX = 1;
            let scaleY = 1;

            function resizeCanvas() {
                const rect = container.getBoundingClientRect();
                const w = rect.width;
                const h = rect.height;
                canvas.width = INTERNAL_W;
                canvas.height = INTERNAL_H;
                scaleX = INTERNAL_W / w;
                scaleY = INTERNAL_H / h;
                if (w < 769) {
                    mobileControls.style.display = 'flex';
                } else {
                    mobileControls.style.display = 'none';
                }
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            new ResizeObserver(resizeCanvas).observe(container);

            // ─────────────────────────────────────
            // AUDIO SYSTEM (Web Audio API)
            // ─────────────────────────────────────
            class AudioManager {
                constructor() {
                    this.ctx = null;
                    this.musicGain = null;
                    this.musicNodes = [];
                    this.musicPlaying = false;
                    this.musicTimeout = null;
                    this.initialized = false;
                }

                init() {
                    if (this.initialized) return;
                    try {
                        this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                        this.masterGain = this.ctx.createGain();
                        this.masterGain.gain.value = 0.35;
                        this.masterGain.connect(this.ctx.destination);
                        this.musicGain = this.ctx.createGain();
                        this.musicGain.gain.value = 0.18;
                        this.musicGain.connect(this.masterGain);
                        this.initialized = true;
                    } catch (e) {
                        this.initialized = false;
                    }
                }

                ensureContext() {
                    if (!this.initialized) this.init();
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                }

                playTone(freq, duration, type = 'square', vol = 0.3, pan = 0) {
                    if (!this.initialized || !this.ctx) return;
                    this.ensureContext();
                    const t = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const panner = this.ctx.createStereoPanner();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, t);
                    osc.frequency.exponentialRampToValueAtTime(freq * 0.1, t + duration);
                    gain.gain.setValueAtTime(vol, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                    panner.pan.setValueAtTime(pan, t);
                    osc.connect(gain);
                    gain.connect(panner);
                    panner.connect(this.masterGain);
                    osc.start(t);
                    osc.stop(t + duration + 0.02);
                }

                playNoise(duration, vol = 0.25, filterFreq = 2000) {
                    if (!this.initialized || !this.ctx) return;
                    this.ensureContext();
                    const t = this.ctx.currentTime;
                    const bufferSize = Math.floor(this.ctx.sampleRate * duration);
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
                    }
                    const source = this.ctx.createBufferSource();
                    source.buffer = buffer;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(filterFreq, t);
                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(vol, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                    source.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.masterGain);
                    source.start(t);
                }

                punchSound() {
                    this.playNoise(0.08, 0.4, 3000);
                    this.playTone(120, 0.06, 'square', 0.35);
                }
                kickSound() {
                    this.playNoise(0.12, 0.5, 1500);
                    this.playTone(60, 0.1, 'sawtooth', 0.45);
                }
                specialSound() {
                    this.playTone(80, 0.3, 'sawtooth', 0.5);
                    this.playNoise(0.25, 0.55, 800);
                    this.playTone(200, 0.15, 'triangle', 0.4);
                }
                enemyHitSound() {
                    this.playNoise(0.06, 0.3, 4000);
                    this.playTone(200, 0.04, 'square', 0.25);
                }
                enemyDeathSound() {
                    this.playNoise(0.2, 0.5, 2000);
                    this.playTone(300, 0.08, 'sawtooth', 0.35);
                }
                bossHitSound() {
                    this.playNoise(0.1, 0.5, 2500);
                    this.playTone(50, 0.12, 'sawtooth', 0.5);
                }
                bossDeathSound() {
                    this.playNoise(0.4, 0.7, 1000);
                    this.playTone(30, 0.5, 'sawtooth', 0.6);
                    this.playTone(500, 0.2, 'triangle', 0.4);
                }
                pickupSound() {
                    this.playTone(600, 0.1, 'triangle', 0.3);
                    this.playTone(900, 0.08, 'triangle', 0.25);
                }
                uiClickSound() {
                    this.playTone(800, 0.04, 'square', 0.2);
                }
                waveAnnounceSound() {
                    this.playTone(400, 0.15, 'triangle', 0.4);
                    this.playTone(600, 0.1, 'triangle', 0.3);
                }

                startMusic() {
                    if (!this.initialized || !this.ctx || this.musicPlaying) return;
                    this.ensureContext();
                    this.musicPlaying = true;
                    this._musicLoop();
                }

                _musicLoop() {
                    if (!this.musicPlaying || !this.initialized || !this.ctx) return;
                    const t = this.ctx.currentTime;
                    const step = 0.25;

                    for (let i = 0; i < 8; i++) {
                        const bt = t + i * step;
                        if (i % 2 === 0) {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'triangle';
                            osc.frequency.setValueAtTime(55, bt);
                            gain.gain.setValueAtTime(0.35, bt);
                            gain.gain.exponentialRampToValueAtTime(0.001, bt + 0.2);
                            osc.connect(gain);
                            gain.connect(this.musicGain);
                            osc.start(bt);
                            osc.stop(bt + 0.25);
                        }
                        if (i === 0 || i === 4) {
                            const osc2 = this.ctx.createOscillator();
                            const gain2 = this.ctx.createGain();
                            osc2.type = 'square';
                            osc2.frequency.setValueAtTime(110, bt);
                            gain2.gain.setValueAtTime(0.2, bt);
                            gain2.gain.exponentialRampToValueAtTime(0.001, bt + 0.12);
                            osc2.connect(gain2);
                            gain2.connect(this.musicGain);
                            osc2.start(bt);
                            osc2.stop(bt + 0.15);
                        }
                        if (i === 2 || i === 6) {
                            const osc3 = this.ctx.createOscillator();
                            const gain3 = this.ctx.createGain();
                            osc3.type = 'sawtooth';
                            osc3.frequency.setValueAtTime(82, bt);
                            gain3.gain.setValueAtTime(0.15, bt);
                            gain3.gain.exponentialRampToValueAtTime(0.001, bt + 0.1);
                            osc3.connect(gain3);
                            gain3.connect(this.musicGain);
                            osc3.start(bt);
                            osc3.stop(bt + 0.12);
                        }
                    }
                    this.musicTimeout = setTimeout(() => this._musicLoop(), 2000);
                }

                stopMusic() {
                    this.musicPlaying = false;
                    if (this.musicTimeout) clearTimeout(this.musicTimeout);
                }

                setMusicVolume(v) {
                    if (this.musicGain) this.musicGain.gain.value = v;
                }
                setMasterVolume(v) {
                    if (this.masterGain) this.masterGain.gain.value = v;
                }
            }

            const audio = new AudioManager();

            // ─────────────────────────────────────
            // INPUT SYSTEM
            // ─────────────────────────────────────
            class InputManager {
                constructor() {
                    this.keys = {};
                    this.justPressed = {};
                    this.mobileActive = {};
                    this._keydown = (e) => {
                        if (!this.keys[e.key]) this.justPressed[e.key] = true;
                        this.keys[e.key] = true;
                        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                            e.preventDefault();
                        }
                        if (e.key === ' ' || e.key === 'Spacebar') {
                            this.keys[' '] = true;
                            if (!this._spaceWasDown) this.justPressed[' '] = true;
                            this._spaceWasDown = true;
                            e.preventDefault();
                        }
                    };
                    this._keyup = (e) => {
                        this.keys[e.key] = false;
                        if (e.key === ' ' || e.key === 'Spacebar') {
                            this.keys[' '] = false;
                            this._spaceWasDown = false;
                        }
                    };
                    this._spaceWasDown = false;
                    window.addEventListener('keydown', this._keydown);
                    window.addEventListener('keyup', this._keyup);
                    this._setupMobileControls();
                }

                _setupMobileControls() {
                    const dpadBtns = mobileControls.querySelectorAll('.dpad-btn');
                    dpadBtns.forEach(btn => {
                        const key = btn.dataset.key;
                        btn.addEventListener('pointerdown', (e) => {
                            e.preventDefault();
                            if (!this.keys[key]) this.justPressed[key] = true;
                            this.keys[key] = true;
                            this.mobileActive[key] = true;
                        });
                        btn.addEventListener('pointerup', (e) => {
                            e.preventDefault();
                            this.keys[key] = false;
                            this.mobileActive[key] = false;
                        });
                        btn.addEventListener('pointerleave', () => {
                            this.keys[key] = false;
                            this.mobileActive[key] = false;
                        });
                        btn.addEventListener('pointercancel', () => {
                            this.keys[key] = false;
                            this.mobileActive[key] = false;
                        });
                    });
                    const actionBtns = mobileControls.querySelectorAll('.action-btn');
                    actionBtns.forEach(btn => {
                        const action = btn.dataset.action;
                        btn.addEventListener('pointerdown', (e) => {
                            e.preventDefault();
                            const keyMap = { punch: 'j', kick: 'k', special: ' ' };
                            const k = keyMap[action];
                            if (k && !this.keys[k]) this.justPressed[k] = true;
                            if (k) this.keys[k] = true;
                            if (action === 'special') {
                                if (!this.keys[' ']) this.justPressed[' '] = true;
                                this.keys[' '] = true;
                            }
                        });
                        btn.addEventListener('pointerup', (e) => {
                            e.preventDefault();
                            const keyMap = { punch: 'j', kick: 'k', special: ' ' };
                            const k = keyMap[action];
                            if (k) this.keys[k] = false;
                            if (action === 'special') this.keys[' '] = false;
                        });
                        btn.addEventListener('pointerleave', () => {
                            const keyMap = { punch: 'j', kick: 'k', special: ' ' };
                            const k = keyMap[action];
                            if (k) this.keys[k] = false;
                            if (action === 'special') this.keys[' '] = false;
                        });
                    });
                }

                isDown(key) { return !!this.keys[key]; }
                wasJustPressed(key) {
                    if (this.justPressed[key]) {
                        this.justPressed[key] = false;
                        return true;
                    }
                    return false;
                }
                clearJustPressed() { this.justPressed = {}; }
                reset() {
                    this.keys = {};
                    this.justPressed = {};
                    this._spaceWasDown = false;
                }

                destroy() {
                    window.removeEventListener('keydown', this._keydown);
                    window.removeEventListener('keyup', this._keyup);
                }
            }

            const input = new InputManager();

            // ─────────────────────────────────────
            // PARTICLE SYSTEM
            // ─────────────────────────────────────
            class Particle {
                constructor(x, y, vx, vy, color, life, size = 3) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.color = color;
                    this.life = life;
                    this.maxLife = life;
                    this.size = size;
                    this.alive = true;
                }
                update(dt) {
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;
                    this.vy += 600 * dt;
                    this.life -= dt;
                    if (this.life <= 0) this.alive = false;
                }
                draw(ctx) {
                    const alpha = Math.max(0, this.life / this.maxLife);
                    const s = this.size * (0.5 + 0.5 * alpha);
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = s * 2;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, s, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            class ParticleSystem {
                constructor() {
                    this.particles = [];
                }
                emit(x, y, count, color, force = 200, life = 0.6, size = 3) {
                    for (let i = 0; i < count; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = force * (0.3 + Math.random() * 0.7);
                        const vx = Math.cos(angle) * speed;
                        const vy = Math.sin(angle) * speed - 150;
                        this.particles.push(new Particle(x, y, vx, vy, color, life * (0.6 + Math.random() * 0.8),
                            size));
                    }
                }
                update(dt) {
                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        this.particles[i].update(dt);
                        if (!this.particles[i].alive) this.particles.splice(i, 1);
                    }
                }
                draw(ctx) {
                    for (const p of this.particles) p.draw(ctx);
                }
                clear() { this.particles = []; }
            }

            // ─────────────────────────────────────
            // SCREEN SHAKE
            // ─────────────────────────────────────
            class ScreenShake {
                constructor() {
                    this.intensity = 0;
                    this.duration = 0;
                    this.timer = 0;
                    this.offsetX = 0;
                    this.offsetY = 0;
                }
                trigger(intensity, duration) {
                    this.intensity = Math.max(this.intensity, intensity);
                    this.duration = Math.max(this.duration, duration);
                    this.timer = 0;
                }
                update(dt) {
                    if (this.timer < this.duration) {
                        this.timer += dt;
                        const progress = this.timer / this.duration;
                        const decay = 1 - progress;
                        this.offsetX = (Math.random() * 2 - 1) * this.intensity * decay;
                        this.offsetY = (Math.random() * 2 - 1) * this.intensity * decay;
                    } else {
                        this.offsetX = 0;
                        this.offsetY = 0;
                        this.intensity = 0;
                        this.duration = 0;
                        this.timer = 0;
                    }
                }
            }

            const screenShake = new ScreenShake();

            // ─────────────────────────────────────
            // GAME ENTITIES
            // ─────────────────────────────────────
            class Player {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.width = 36;
                    this.height = 52;
                    this.vx = 0;
                    this.vy = 0;
                    this.speed = 320;
                    this.health = 100;
                    this.maxHealth = 100;
                    this.facing = 1;
                    this.state = 'idle';
                    this.stateTimer = 0;
                    this.attackHitbox = null;
                    this.specialMeter = 0;
                    this.maxSpecial = 100;
                    this.invincible = 0;
                    this.onGround = true;
                    this.groundedY = 0;
                    this.flashTimer = 0;
                }

                getAttackHitbox() {
                    if (this.state === 'punch' && this.stateTimer < 0.1 && this.stateTimer > 0.03) {
                        return {
                            x: this.x + this.facing * 20,
                            y: this.y - 10,
                            w: 35,
                            h: 30,
                            damage: 15,
                            knockback: 180,
                            type: 'punch'
                        };
                    }
                    if (this.state === 'kick' && this.stateTimer < 0.18 && this.stateTimer > 0.05) {
                        return {
                            x: this.x + this.facing * 18,
                            y: this.y - 5,
                            w: 45,
                            h: 25,
                            damage: 25,
                            knockback: 280,
                            type: 'kick'
                        };
                    }
                    if (this.state === 'special' && this.stateTimer < 0.25 && this.stateTimer > 0.08) {
                        return {
                            x: this.x - 50,
                            y: this.y - 60,
                            w: 100,
                            h: 75,
                            damage: 50,
                            knockback: 400,
                            type: 'special'
                        };
                    }
                    return null;
                }

                update(dt, keys, particles, groundY) {
                    this.groundedY = groundY - this.height;
                    this.invincible = Math.max(0, this.invincible - dt);
                    this.flashTimer = Math.max(0, this.flashTimer - dt);

                    if (this.state === 'idle' || this.state === 'walk') {
                        let moving = false;
                        if (keys.isDown('ArrowLeft') || keys.isDown('a') || keys.isDown('A')) {
                            this.vx = -this.speed;
                            this.facing = -1;
                            moving = true;
                        } else if (keys.isDown('ArrowRight') || keys.isDown('d') || keys.isDown('D')) {
                            this.vx = this.speed;
                            this.facing = 1;
                            moving = true;
                        } else {
                            this.vx *= 0.85;
                            if (Math.abs(this.vx) < 10) this.vx = 0;
                        }
                        this.state = moving ? 'walk' : 'idle';

                        if (keys.wasJustPressed('j') || keys.wasJustPressed('J') || keys.wasJustPressed('z') || keys
                            .wasJustPressed('Z')) {
                            this.state = 'punch';
                            this.stateTimer = 0;
                            this.vx *= 0.3;
                            audio.punchSound();
                        }
                        if (keys.wasJustPressed('k') || keys.wasJustPressed('K') || keys.wasJustPressed('x') || keys
                            .wasJustPressed('X')) {
                            this.state = 'kick';
                            this.stateTimer = 0;
                            this.vx *= 0.2;
                            audio.kickSound();
                        }
                        if ((keys.wasJustPressed(' ') || keys.wasJustPressed('Space')) && this.specialMeter >= this
                            .maxSpecial) {
                            this.state = 'special';
                            this.stateTimer = 0;
                            this.vx = 0;
                            this.specialMeter = 0;
                            audio.specialSound();
                            screenShake.trigger(12, 0.35);
                            particles.emit(this.x, this.y - 20, 25, '#ff00ff', 350, 0.7, 5);
                            particles.emit(this.x, this.y - 20, 15, '#ffffff', 250, 0.5, 3);
                        }
                    }

                    if (this.state === 'punch' || this.state === 'kick' || this.state === 'special') {
                        this.stateTimer += dt;
                        const maxTime = this.state === 'punch' ? 0.22 : this.state === 'kick' ? 0.35 : 0.45;
                        if (this.stateTimer >= maxTime) {
                            this.state = 'idle';
                            this.stateTimer = 0;
                            this.vx *= 0.5;
                        }
                    }

                    this.x += this.vx * dt;
                    this.y = this.groundedY;
                    this.x = Math.max(30, Math.min(INTERNAL_W - 30 - this.width, this.x));
                    this.attackHitbox = this.getAttackHitbox();
                }

                takeDamage(amount, particles) {
                    if (this.invincible > 0) return;
                    this.health -= amount;
                    this.invincible = 0.5;
                    this.flashTimer = 0.4;
                    this.specialMeter = Math.min(this.maxSpecial, this.specialMeter + amount * 1.5);
                    screenShake.trigger(6, 0.2);
                    particles.emit(this.x + this.width / 2, this.y + this.height / 2, 8, '#ff3333', 150, 0.4, 3);
                    audio.enemyHitSound();
                }

                draw(ctx) {
                    if (this.flashTimer > 0 && Math.floor(this.flashTimer * 30) % 2 === 0) return;

                    const cx = this.x + this.width / 2;
                    const cy = this.y + this.height / 2;

                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.scale(this.facing, 1);

                    // Shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.4)';
                    ctx.beginPath();
                    ctx.ellipse(0, this.height / 2 + 2, this.width / 2 + 4, 4, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Legs
                    const legSpread = this.state === 'walk' ? Math.sin(Date.now() / 80) * 8 : 0;
                    ctx.fillStyle = '#1a3a5c';
                    ctx.fillRect(-10, this.height / 2 - 14, 8, 16);
                    ctx.fillRect(2, this.height / 2 - 14 + legSpread * 0.5, 8, 16 - legSpread * 0.3);

                    // Body
                    const bodyGrad = ctx.createLinearGradient(0, -8, 0, 10);
                    bodyGrad.addColorStop(0, '#2d6db5');
                    bodyGrad.addColorStop(0.5, '#1e4d85');
                    bodyGrad.addColorStop(1, '#15355e');
                    ctx.fillStyle = bodyGrad;
                    ctx.fillRect(-13, -8, 26, 28);
                    ctx.strokeStyle = '#0d2040';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-13, -8, 26, 28);

                    // Chest detail
                    ctx.fillStyle = '#3a8de0';
                    ctx.fillRect(-6, -3, 12, 10);

                    // Head
                    ctx.fillStyle = '#e8c9a0';
                    ctx.beginPath();
                    ctx.arc(0, -18, 11, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#5a3a1a';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    // Hair
                    ctx.fillStyle = '#3a2010';
                    ctx.beginPath();
                    ctx.arc(0, -22, 11, Math.PI, Math.PI * 2);
                    ctx.fill();

                    // Eyes
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(-4, -19, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(4, -19, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(-3, -19, 1.8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(5, -19, 1.8, 0, Math.PI * 2);
                    ctx.fill();

                    // Arms
                    let armAngle = 0;
                    if (this.state === 'punch' && this.stateTimer < 0.15) armAngle = -1.2;
                    if (this.state === 'kick' && this.stateTimer < 0.2) armAngle = -0.5;
                    if (this.state === 'special') armAngle = (Math.sin(this.stateTimer * 40) * 1.5);

                    ctx.save();
                    ctx.translate(8, -9);
                    ctx.rotate(armAngle);
                    ctx.fillStyle = '#e8c9a0';
                    ctx.fillRect(0, -4, 19, 8);
                    ctx.fillStyle = '#1a3a5c';
                    ctx.fillRect(16, -3, 5, 6);
                    ctx.restore();

                    ctx.save();
                    ctx.translate(-8, -9);
                    ctx.rotate(-armAngle * 0.6);
                    ctx.fillStyle = '#e8c9a0';
                    ctx.fillRect(-19, -4, 19, 8);
                    ctx.fillStyle = '#1a3a5c';
                    ctx.fillRect(-21, -3, 5, 6);
                    ctx.restore();

                    // Attack glow
                    if (this.state === 'special') {
                        ctx.fillStyle = 'rgba(255,0,255,0.25)';
                        ctx.beginPath();
                        ctx.arc(0, -5, 55, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    if (this.state === 'punch' && this.stateTimer < 0.12) {
                        ctx.fillStyle = 'rgba(255,180,30,0.3)';
                        ctx.beginPath();
                        ctx.arc(25, -8, 16, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    if (this.state === 'kick' && this.stateTimer < 0.2) {
                        ctx.fillStyle = 'rgba(255,60,20,0.3)';
                        ctx.beginPath();
                        ctx.arc(28, 5, 18, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.restore();

                    // Invincibility glow
                    if (this.invincible > 0) {
                        ctx.save();
                        ctx.globalAlpha = 0.3;
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(this.x + this.width / 2, this.y + this.height / 2, 35, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                }

                drawHealthBar(ctx, x, y, w) {
                    const ratio = Math.max(0, this.health / this.maxHealth);
                    ctx.fillStyle = '#1a1a1a';
                    ctx.fillRect(x, y, w, 14);
                    ctx.strokeStyle = '#555';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, y, w, 14);
                    const healthGrad = ctx.createLinearGradient(x, y, x + w * ratio, y);
                    healthGrad.addColorStop(0, '#ff3333');
                    healthGrad.addColorStop(0.6, '#ffaa00');
                    healthGrad.addColorStop(1, '#44ff44');
                    ctx.fillStyle = healthGrad;
                    ctx.fillRect(x + 1, y + 1, (w - 2) * ratio, 12);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 10px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(Math.ceil(this.health) + ' HP', x + w / 2, y + 11);
                }

                drawSpecialBar(ctx, x, y, w) {
                    const ratio = Math.max(0, this.specialMeter / this.maxSpecial);
                    ctx.fillStyle = '#1a1a1a';
                    ctx.fillRect(x, y, w, 8);
                    ctx.strokeStyle = '#555';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, y, w, 8);
                    const specGrad = ctx.createLinearGradient(x, y, x + w, y);
                    specGrad.addColorStop(0, '#8800aa');
                    specGrad.addColorStop(1, '#ff00ff');
                    ctx.fillStyle = specGrad;
                    ctx.fillRect(x + 1, y + 1, (w - 2) * ratio, 6);
                    if (ratio >= 1) {
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 7px "Courier New", monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText('GRERG!', x + w / 2, y + 7);
                    }
                }
            }

            class Enemy {
                constructor(x, y, type, waveNum) {
                    this.x = x;
                    this.y = y;
                    this.type = type;
                    this.alive = true;
                    this.facing = -1;
                    this.state = 'idle';
                    this.stateTimer = 0;
                    this.attackCooldown = 0;
                    this.flashTimer = 0;
                    this.stunTimer = 0;
                    this.vx = 0;
                    this.vy = 0;
                    this.onGround = true;
                    this.groundedY = 0;

                    switch (type) {
                        case 'thug':
                            this.width = 30;
                            this.height = 46;
                            this.health = 30 + waveNum * 5;
                            this.maxHealth = this.health;
                            this.speed = 120 + waveNum * 15;
                            this.damage = 8;
                            this.color = '#e04030';
                            this.accentColor = '#ff6b5b';
                            break;
                        case 'big_thug':
                            this.width = 40;
                            this.height = 56;
                            this.health = 60 + waveNum * 8;
                            this.maxHealth = this.health;
                            this.speed = 80 + waveNum * 10;
                            this.damage = 15;
                            this.color = '#c03020';
                            this.accentColor = '#e85040';
                            break;
                        case 'cena':
                            this.width = 44;
                            this.height = 60;
                            this.health = 150 + waveNum * 20;
                            this.maxHealth = this.health;
                            this.speed = 140 + waveNum * 12;
                            this.damage = 22;
                            this.color = '#20c040';
                            this.accentColor = '#40ff60';
                            this.isBoss = true;
                            break;
                        case 'super_cena':
                            this.width = 50;
                            this.height = 68;
                            this.health = 350 + waveNum * 30;
                            this.maxHealth = this.health;
                            this.speed = 170 + waveNum * 10;
                            this.damage = 30;
                            this.color = '#10a030';
                            this.accentColor = '#30ff50';
                            this.isBoss = true;
                            this.isSuper = true;
                            break;
                        default:
                            this.width = 30;
                            this.height = 46;
                            this.health = 30;
                            this.maxHealth = 30;
                            this.speed = 120;
                            this.damage = 8;
                            this.color = '#e04030';
                            this.accentColor = '#ff6b5b';
                    }
                    this.maxHealth = this.health;
                }

                update(dt, playerX, playerY, groundY, particles) {
                    this.groundedY = groundY - this.height;
                    this.flashTimer = Math.max(0, this.flashTimer - dt);
                    this.stunTimer = Math.max(0, this.stunTimer - dt);
                    this.attackCooldown = Math.max(0, this.attackCooldown - dt);

                    if (this.stunTimer > 0) {
                        this.vx *= 0.9;
                        this.x += this.vx * dt;
                        this.y = this.groundedY;
                        this.state = 'stunned';
                        return;
                    }

                    const dx = playerX - this.x;
                    const dist = Math.abs(dx);
                    this.facing = dx > 0 ? 1 : -1;

                    if (dist > 55) {
                        this.vx = this.facing * this.speed;
                        this.state = 'walk';
                    } else if (dist < 35 && this.attackCooldown <= 0) {
                        this.vx *= 0.5;
                        this.state = 'attack';
                        this.stateTimer = 0;
                        this.attackCooldown = 0.8 + Math.random() * 0.6;
                        if (this.isBoss) this.attackCooldown *= 0.6;
                    } else {
                        this.vx *= 0.85;
                        if (Math.abs(this.vx) < 5) this.vx = 0;
                        this.state = 'idle';
                    }

                    if (this.state === 'attack') {
                        this.stateTimer += dt;
                        if (this.stateTimer > 0.35) {
                            this.state = 'idle';
                            this.stateTimer = 0;
                        }
                    }

                    this.x += this.vx * dt;
                    if (this.isBoss && this.isSuper && Math.random() < 0.01) {
                        this.vx += (Math.random() - 0.5) * 400;
                    }
                    this.x = Math.max(25, Math.min(INTERNAL_W - 25 - this.width, this.x));
                    this.y = this.groundedY;
                }

                getAttackHitbox() {
                    if (this.state === 'attack' && this.stateTimer > 0.08 && this.stateTimer < 0.22) {
                        return {
                            x: this.x + this.facing * 15,
                            y: this.y - 8,
                            w: 32,
                            h: 28,
                            damage: this.damage,
                            knockback: 150,
                            type: 'enemy_attack'
                        };
                    }
                    return null;
                }

                takeDamage(amount, knockbackX, particles) {
                    this.health -= amount;
                    this.flashTimer = 0.15;
                    this.vx += knockbackX;
                    this.stunTimer = 0.2;
                    if (this.isBoss) {
                        this.stunTimer = 0.12;
                        audio.bossHitSound();
                        particles.emit(this.x + this.width / 2, this.y + this.height / 2, 10, '#ffff00', 200, 0.5, 4);
                    } else {
                        audio.enemyHitSound();
                        particles.emit(this.x + this.width / 2, this.y + this.height / 2, 5, '#ffaa00', 120, 0.35, 3);
                    }
                    if (this.health <= 0) {
                        this.alive = false;
                        if (this.isBoss) {
                            audio.bossDeathSound();
                            screenShake.trigger(18, 0.55);
                            particles.emit(this.x + this.width / 2, this.y + this.height / 2, 40, '#ffff00', 400, 0.9,
                                6);
                            particles.emit(this.x + this.width / 2, this.y + this.height / 2, 30, '#ff4400', 300, 0.7,
                                5);
                            particles.emit(this.x + this.width / 2, this.y + this.height / 2, 20, '#ffffff', 250, 0.6,
                                3);
                        } else {
                            audio.enemyDeathSound();
                            particles.emit(this.x + this.width / 2, this.y + this.height / 2, 15, '#ff6600', 250, 0.55,
                                4);
                        }
                        if (Math.random() < 0.25) {
                            return 'drop_health';
                        }
                    }
                    return null;
                }

                draw(ctx) {
                    if (this.flashTimer > 0 && Math.floor(this.flashTimer * 40) % 2 === 0) {
                        ctx.save();
                        ctx.globalAlpha = 0.6;
                        this._drawBody(ctx);
                        ctx.restore();
                        return;
                    }
                    this._drawBody(ctx);
                }

                _drawBody(ctx) {
                    const cx = this.x + this.width / 2;
                    const cy = this.y + this.height / 2;

                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.scale(this.facing, 1);

                    // Shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.4)';
                    ctx.beginPath();
                    ctx.ellipse(0, this.height / 2 + 2, this.width / 2 + 3, 3, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Legs
                    ctx.fillStyle = '#1a1a1a';
                    ctx.fillRect(-8, this.height / 2 - 12, 7, 14);
                    ctx.fillRect(1, this.height / 2 - 12, 7, 14);

                    // Body
                    const bodyGrad = ctx.createLinearGradient(0, -6, 0, 12);
                    bodyGrad.addColorStop(0, this.accentColor);
                    bodyGrad.addColorStop(1, this.color);
                    ctx.fillStyle = bodyGrad;
                    ctx.fillRect(-this.width / 2 + 2, -6, this.width - 4, 24);
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(-this.width / 2 + 2, -6, this.width - 4, 24);

                    // Head
                    ctx.fillStyle = '#d4b896';
                    ctx.beginPath();
                    ctx.arc(0, -16, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#3a2a1a';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // Angry eyes
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(-6, -20, 3, 4);
                    ctx.fillRect(3, -20, 3, 4);
                    ctx.fillStyle = '#c00';
                    ctx.fillRect(-5.5, -19.5, 2, 3);
                    ctx.fillRect(3.5, -19.5, 2, 3);

                    // Arms
                    ctx.fillStyle = this.color;
                    ctx.fillRect(8, -8, 14, 7);
                    ctx.fillRect(-22, -8, 14, 7);

                    // Boss crown/indicator
                    if (this.isBoss) {
                        ctx.fillStyle = '#ffdd00';
                        ctx.beginPath();
                        const crownY = -26;
                        ctx.moveTo(-8, crownY + 8);
                        ctx.lineTo(-8, crownY);
                        ctx.lineTo(-3, crownY - 6);
                        ctx.lineTo(0, crownY);
                        ctx.lineTo(3, crownY - 6);
                        ctx.lineTo(8, crownY);
                        ctx.lineTo(8, crownY + 8);
                        ctx.closePath();
                        ctx.fill();
                        ctx.strokeStyle = '#aa8800';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                        if (this.isSuper) {
                            ctx.fillStyle = '#ff00ff';
                            ctx.beginPath();
                            ctx.arc(0, crownY - 3, 15, 0, Math.PI * 2);
                            ctx.globalAlpha = 0.4;
                            ctx.fill();
                            ctx.globalAlpha = 1;
                        }
                    }

                    ctx.restore();

                    // Health bar for bosses
                    if (this.isBoss) {
                        const barW = this.width + 10;
                        const barX = this.x - 5;
                        const barY = this.y - 22;
                        const ratio = Math.max(0, this.health / this.maxHealth);
                        ctx.fillStyle = '#1a1a1a';
                        ctx.fillRect(barX, barY, barW, 6);
                        ctx.fillStyle = ratio > 0.5 ? '#44ff44' : ratio > 0.25 ? '#ffaa00' : '#ff3333';
                        ctx.fillRect(barX, barY, barW * ratio, 6);
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 0.5;
                        ctx.strokeRect(barX, barY, barW, 6);
                    }
                }
            }

            class HealthPickup {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.width = 16;
                    this.height = 16;
                    this.alive = true;
                    this.life = 8;
                    this.bobOffset = 0;
                }
                update(dt) {
                    this.life -= dt;
                    this.bobOffset = Math.sin(Date.now() / 300) * 4;
                    if (this.life <= 0) this.alive = false;
                }
                draw(ctx) {
                    const alpha = Math.min(1, this.life / 2);
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    const cx = this.x + this.width / 2;
                    const cy = this.y + this.height / 2 + this.bobOffset;
                    ctx.fillStyle = '#ff4444';
                    ctx.shadowColor = '#ff0000';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(cx, cy, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(cx - 3, cy - 2, 6, 4);
                    ctx.fillRect(cx - 1, cy - 3, 2, 6);
                    ctx.restore();
                }
            }

            // ─────────────────────────────────────
            // GAME STATE
            // ─────────────────────────────────────
            const STATE = { MENU: 'menu', PLAYING: 'playing', PAUSED: 'paused', WAVE_TRANSITION: 'wave_transition',
                GAME_OVER: 'game_over', VICTORY: 'victory' };

            class Game {
                constructor() {
                    this.state = STATE.MENU;
                    this.player = null;
                    this.enemies = [];
                    this.particles = new ParticleSystem();
                    this.pickups = [];
                    this.wave = 0;
                    this.score = 0;
                    this.highScore = 0;
                    this.groundY = INTERNAL_H - 50;
                    this.waveTimer = 0;
                    this.waveTransitionTime = 2.0;
                    this.menuBlink = 0;
                    this.victoryTimer = 0;
                    this.totalKills = 0;
                    this.cenaDefeated = 0;

                    this._loadHighScore();
                }

                _loadHighScore() {
                    try {
                        const saved = localStorage.getItem('cenaGame_highScore');
                        if (saved) this.highScore = parseInt(saved, 10) || 0;
                    } catch (e) { this.highScore = 0; }
                }

                _saveHighScore() {
                    if (this.score > this.highScore) {
                        this.highScore = this.score;
                        try { localStorage.setItem('cenaGame_highScore', this.highScore.toString()); } catch (e) {}
                    }
                }

                startGame() {
                    audio.init();
                    audio.ensureContext();
                    this.player = new Player(INTERNAL_W / 2, this.groundY - 52);
                    this.enemies = [];
                    this.particles.clear();
                    this.pickups = [];
                    this.wave = 0;
                    this.score = 0;
                    this.totalKills = 0;
                    this.cenaDefeated = 0;
                    this.state = STATE.WAVE_TRANSITION;
                    this.waveTimer = 1.5;
                    this._startNextWave();
                    audio.startMusic();
                }

                _startNextWave() {
                    this.wave++;
                    this.enemies = [];
                    this.pickups = [];
                    const numThugs = 2 + this.wave * 2;
                    const numBig = Math.max(0, Math.floor((this.wave - 2) / 2));
                    const hasCena = this.wave % 5 === 0;
                    const isSuperCena = this.wave >= 10;

                    for (let i = 0; i < numThugs; i++) {
                        const side = Math.random() < 0.5 ? 0 : 1;
                        const x = side === 0 ? 40 + Math.random() * 200 : INTERNAL_W - 240 + Math.random() * 200;
                        const e = new Enemy(x, this.groundY - 46, 'thug', this.wave);
                        this.enemies.push(e);
                    }
                    for (let i = 0; i < numBig; i++) {
                        const x = 100 + Math.random() * (INTERNAL_W - 200);
                        const e = new Enemy(x, this.groundY - 56, 'big_thug', this.wave);
                        this.enemies.push(e);
                    }
                    if (hasCena) {
                        const cenaType = isSuperCena ? 'super_cena' : 'cena';
                        const cena = new Enemy(INTERNAL_W / 2, this.groundY - 60, cenaType, this.wave);
                        this.enemies.push(cena);
                    }
                    this.state = STATE.PLAYING;
                    if (hasCena) {
                        audio.waveAnnounceSound();
                        audio.playTone(200, 0.3, 'triangle', 0.5);
                    } else {
                        audio.waveAnnounceSound();
                    }
                }

                update(dt) {
                    if (this.state === STATE.MENU) {
                        this.menuBlink += dt;
                        if (input.wasJustPressed(' ') || input.wasJustPressed('Enter') ||
                            input.wasJustPressed('j') || input.wasJustPressed('J')) {
                            audio.uiClickSound();
                            this.startGame();
                        }
                        input.clearJustPressed();
                        return;
                    }

                    if (this.state === STATE.GAME_OVER) {
                        this.menuBlink += dt;
                        if (input.wasJustPressed(' ') || input.wasJustPressed('Enter') ||
                            input.wasJustPressed('j') || input.wasJustPressed('J')) {
                            audio.uiClickSound();
                            this.startGame();
                        }
                        input.clearJustPressed();
                        return;
                    }

                    if (this.state === STATE.VICTORY) {
                        this.victoryTimer += dt;
                        this.menuBlink += dt;
                        if (this.victoryTimer > 3 && (input.wasJustPressed(' ') || input.wasJustPressed('Enter') ||
                                input.wasJustPressed('j'))) {
                            audio.uiClickSound();
                            this.state = STATE.MENU;
                            this._saveHighScore();
                            audio.stopMusic();
                        }
                        input.clearJustPressed();
                        this.particles.update(dt);
                        return;
                    }

                    if (this.state === STATE.WAVE_TRANSITION) {
                        this.waveTimer -= dt;
                        this.particles.update(dt);
                        if (this.waveTimer <= 0) {
                            this._startNextWave();
                        }
                        input.clearJustPressed();
                        return;
                    }

                    if (this.state === STATE.PAUSED) {
                        if (input.wasJustPressed('p') || input.wasJustPressed('P') || input.wasJustPressed('Escape')) {
                            this.state = STATE.PLAYING;
                            audio.uiClickSound();
                        }
                        input.clearJustPressed();
                        return;
                    }

                    // PLAYING state
                    if (input.wasJustPressed('p') || input.wasJustPressed('P') || input.wasJustPressed('Escape')) {
                        this.state = STATE.PAUSED;
                        audio.uiClickSound();
                        input.clearJustPressed();
                        return;
                    }

                    const dtCapped = Math.min(dt, 0.1);
                    screenShake.update(dtCapped);
                    this.particles.update(dtCapped);
                    this.player.update(dtCapped, input, this.particles, this.groundY);

                    // Check player attack vs enemies
                    if (this.player.attackHitbox) {
                        const ah = this.player.attackHitbox;
                        for (const enemy of this.enemies) {
                            if (!enemy.alive) continue;
                            if (this._rectsOverlap(ah.x, ah.y, ah.w, ah.h, enemy.x, enemy.y, enemy.width, enemy
                                    .height)) {
                                const knockX = (enemy.x - this.player.x) > 0 ? ah.knockback : -ah.knockback;
                                const drop = enemy.takeDamage(ah.damage, knockX, this.particles);
                                if (!enemy.alive) {
                                    this.score += enemy.isBoss ? (enemy.isSuper ? 500 : 250) : (enemy.type ===
                                        'big_thug' ? 100 : 50);
                                    this.totalKills++;
                                    if (enemy.isBoss) this.cenaDefeated++;
                                }
                                if (drop === 'drop_health') {
                                    this.pickups.push(new HealthPickup(enemy.x + enemy.width / 2 - 8, enemy.y - 10));
                                }
                                if (ah.type === 'special' && enemy.isBoss) {
                                    screenShake.trigger(10, 0.3);
                                }
                            }
                        }
                        this.player.attackHitbox = null;
                    }

                    // Update enemies
                    for (const enemy of this.enemies) {
                        if (!enemy.alive) continue;
                        enemy.update(dtCapped, this.player.x + this.player.width / 2, this.player.y, this.groundY, this
                            .particles);
                        const eAh = enemy.getAttackHitbox();
                        if (eAh && this._rectsOverlap(eAh.x, eAh.y, eAh.w, eAh.h, this.player.x, this.player.y, this
                                .player.width, this.player.height)) {
                            this.player.takeDamage(eAh.damage, this.particles);
                            enemy.attackCooldown = 1.0;
                        }
                    }

                    // Update pickups
                    for (const pickup of this.pickups) {
                        if (!pickup.alive) continue;
                        pickup.update(dtCapped);
                        if (this._rectsOverlap(pickup.x, pickup.y, pickup.width, pickup.height, this.player.x, this.player
                                .y, this.player.width, this.player.height)) {
                            this.player.health = Math.min(this.player.maxHealth, this.player.health + 25);
                            pickup.alive = false;
                            audio.pickupSound();
                            this.particles.emit(pickup.x + 8, pickup.y + 8, 8, '#ff6666', 80, 0.4, 2);
                        }
                    }

                    // Clean up
                    this.enemies = this.enemies.filter(e => e.alive);
                    this.pickups = this.pickups.filter(p => p.alive);

                    // Check wave complete
                    if (this.enemies.length === 0 && this.state === STATE.PLAYING) {
                        // Check victory
                        if (this.wave >= 10 && this.cenaDefeated >= 2) {
                            this.state = STATE.VICTORY;
                            this.victoryTimer = 0;
                            this.menuBlink = 0;
                            this._saveHighScore();
                            audio.stopMusic();
                            audio.bossDeathSound();
                            screenShake.trigger(25, 0.8);
                            this.particles.emit(INTERNAL_W / 2, INTERNAL_H / 2, 60, '#ffdd00', 500, 1.2, 8);
                            this.particles.emit(INTERNAL_W / 2, INTERNAL_H / 2, 40, '#ff00ff', 400, 1.0, 6);
                            this.particles.emit(INTERNAL_W / 2, INTERNAL_H / 2, 30, '#ffffff', 350, 0.8, 4);
                            this.score += 1000;
                            this._saveHighScore();
                        } else {
                            this.state = STATE.WAVE_TRANSITION;
                            this.waveTimer = this.waveTransitionTime;
                            audio.waveAnnounceSound();
                        }
                    }

                    // Check player death
                    if (this.player.health <= 0) {
                        this.state = STATE.GAME_OVER;
                        this._saveHighScore();
                        audio.stopMusic();
                        audio.bossDeathSound();
                        screenShake.trigger(20, 0.6);
                        this.particles.emit(this.player.x + this.player.width / 2, this.player.y + this.player.height /
                            2, 35, '#ff0000', 300, 0.8, 5);
                    }

                    input.clearJustPressed();
                }

                _rectsOverlap(x1, y1, w1, h1, x2, y2, w2, h2) {
                    return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
                }

                draw(ctx) {
                    ctx.clearRect(0, 0, INTERNAL_W, INTERNAL_H);

                    // Apply screen shake
                    ctx.save();
                    ctx.translate(screenShake.offsetX, screenShake.offsetY);

                    // Background
                    this._drawBackground(ctx);

                    if (this.state === STATE.MENU) {
                        this._drawMenu(ctx);
                    } else if (this.state === STATE.GAME_OVER) {
                        this._drawGameOver(ctx);
                    } else if (this.state === STATE.VICTORY) {
                        this._drawVictory(ctx);
                    } else {
                        // Draw game world
                        this._drawGround(ctx);
                        for (const pickup of this.pickups) {
                            if (pickup.alive) pickup.draw(ctx);
                        }
                        for (const enemy of this.enemies) {
                            if (enemy.alive) enemy.draw(ctx);
                        }
                        if (this.player && this.player.health > 0) {
                            this.player.draw(ctx);
                        }
                        this.particles.draw(ctx);

                        // UI
                        this._drawUI(ctx);

                        if (this.state === STATE.WAVE_TRANSITION) {
                            this._drawWaveTransition(ctx);
                        }
                        if (this.state === STATE.PAUSED) {
                            this._drawPauseOverlay(ctx);
                        }
                    }

                    ctx.restore();
                }

                _drawBackground(ctx) {
                    const grad = ctx.createLinearGradient(0, 0, 0, INTERNAL_H);
                    grad.addColorStop(0, '#0a0a1a');
                    grad.addColorStop(0.5, '#111128');
                    grad.addColorStop(1, '#1a1a2e');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, INTERNAL_W, INTERNAL_H);

                    // City silhouette
                    ctx.fillStyle = '#0d0d20';
                    for (let i = 0; i < 15; i++) {
                        const bw = 40 + Math.sin(i * 2.7) * 30;
                        const bh = 80 + Math.cos(i * 1.7) * 100;
                        const bx = i * 70 - 20;
                        ctx.fillRect(bx, INTERNAL_H - this.groundY - bh + 20, bw, bh);
                    }

                    // Stars / ambient dots
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    for (let i = 0; i < 40; i++) {
                        const sx = (i * 137 + 50) % INTERNAL_W;
                        const sy = (i * 89 + 30) % (INTERNAL_H - this.groundY - 40);
                        ctx.beginPath();
                        ctx.arc(sx, sy, 1 + (i % 3), 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                _drawGround(ctx) {
                    const gy = this.groundY;
                    const grad = ctx.createLinearGradient(0, gy, 0, INTERNAL_H);
                    grad.addColorStop(0, '#2a2a3a');
                    grad.addColorStop(0.3, '#1a1a28');
                    grad.addColorStop(1, '#0a0a15');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, gy, INTERNAL_W, INTERNAL_H - gy);
                    ctx.strokeStyle = '#555577';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(0, gy);
                    ctx.lineTo(INTERNAL_W, gy);
                    ctx.stroke();
                    // Grid lines on ground
                    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                    ctx.lineWidth = 1;
                    for (let x = 0; x < INTERNAL_W; x += 60) {
                        ctx.beginPath();
                        ctx.moveTo(x, gy);
                        ctx.lineTo(x, INTERNAL_H);
                        ctx.stroke();
                    }
                }

                _drawUI(ctx) {
                    if (!this.player) return;
                    // Health bar
                    this.player.drawHealthBar(ctx, 15, 15, 200);
                    // Special bar
                    this.player.drawSpecialBar(ctx, 15, 33, 200);
                    // Score
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 14px "Courier New", monospace';
                    ctx.textAlign = 'right';
                    ctx.fillText('SCORE: ' + this.score, INTERNAL_W - 20, 28);
                    ctx.fillText('WAVE: ' + this.wave, INTERNAL_W - 20, 48);
                    ctx.fillText('KILLS: ' + this.totalKills, INTERNAL_W - 20, 66);
                    if (this.highScore > 0) {
                        ctx.fillText('BEST: ' + this.highScore, INTERNAL_W - 20, 84);
                    }
                }

                _drawWaveTransition(ctx) {
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(0, 0, INTERNAL_W, INTERNAL_H);
                    ctx.fillStyle = '#ffdd00';
                    ctx.font = 'bold 48px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.shadowColor = '#ff8800';
                    ctx.shadowBlur = 20;
                    ctx.fillText('WAVE ' + this.wave, INTERNAL_W / 2, INTERNAL_H / 2);
                    ctx.shadowBlur = 0;
                    if (this.wave % 5 === 0) {
                        ctx.fillStyle = '#ff4444';
                        ctx.font = 'bold 28px "Courier New", monospace';
                        ctx.fillText('⚠ JOHN CENA APPEARS! ⚠', INTERNAL_W / 2, INTERNAL_H / 2 + 50);
                    }
                }

                _drawPauseOverlay(ctx) {
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(0, 0, INTERNAL_W, INTERNAL_H);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 40px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('PAUSED', INTERNAL_W / 2, INTERNAL_H / 2 - 10);
                    ctx.font = '18px "Courier New", monospace';
                    ctx.fillText('Press P or ESC to resume', INTERNAL_W / 2, INTERNAL_H / 2 + 35);
                }

                _drawMenu(ctx) {
                    ctx.fillStyle = 'rgba(0,0,0,0.55)';
                    ctx.fillRect(0, 0, INTERNAL_W, INTERNAL_H);

                    // Title
                    ctx.fillStyle = '#ffcc00';
                    ctx.font = 'bold 44px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.shadowColor = '#ff6600';
                    ctx.shadowBlur = 25;
                    ctx.fillText('JOHN CENA', INTERNAL_W / 2, INTERNAL_H / 2 - 80);
                    ctx.fillText('WORLD KIDNAPPER', INTERNAL_W / 2, INTERNAL_H / 2 - 35);
                    ctx.shadowBlur = 0;

                    // Subtitle
                    ctx.fillStyle = '#ff6666';
                    ctx.font = 'bold 18px "Courier New", monospace';
                    ctx.fillText('He kidnapped everyone...', INTERNAL_W / 2, INTERNAL_H / 2 + 5);
                    ctx.fillText('YOU\'RE NEXT!', INTERNAL_W / 2, INTERNAL_H / 2 + 28);

                    // grergtaawegaega reference
                    ctx.fillStyle = '#ff44ff';
                    ctx.font = 'italic 16px "Courier New", monospace';
                    ctx.fillText('Unleash the grergtaawegaega!', INTERNAL_W / 2, INTERNAL_H / 2 + 55);

                    // Blink prompt
                    if (Math.floor(this.menuBlink * 3) % 2 === 0) {
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 22px "Courier New", monospace';
                        ctx.fillText('PRESS SPACE OR J TO FIGHT', INTERNAL_W / 2, INTERNAL_H / 2 + 100);
                    }

                    // High score
                    if (this.highScore > 0) {
                        ctx.fillStyle = '#ffaa00';
                        ctx.font = 'bold 16px "Courier New", monospace';
                        ctx.fillText('BEST SCORE: ' + this.highScore, INTERNAL_W / 2, INTERNAL_H / 2 + 135);
                    }

                    // Controls info
                    ctx.fillStyle = '#aaa';
                    ctx.font = '13px "Courier New", monospace';
                    ctx.fillText('ARROWS/WASD: Move | J/Z: Punch | K/X: Kick | SPACE: Special', INTERNAL_W / 2, INTERNAL_H /
                        2 + 165);
                    ctx.fillText('P/ESC: Pause | Fill special meter to unleash GRERG!', INTERNAL_W / 2, INTERNAL_H / 2 +
                        185);
                }

                _drawGameOver(ctx) {
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(0, 0, INTERNAL_W, INTERNAL_H);
                    ctx.fillStyle = '#ff2222';
                    ctx.font = 'bold 50px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.shadowColor = '#ff0000';
                    ctx.shadowBlur = 30;
                    ctx.fillText('YOU DIED', INTERNAL_W / 2, INTERNAL_H / 2 - 40);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ffaa00';
                    ctx.font = 'bold 20px "Courier New", monospace';
                    ctx.fillText('Cena got you... Score: ' + this.score, INTERNAL_W / 2, INTERNAL_H / 2 + 5);
                    ctx.fillText('Waves survived: ' + (this.wave - 1), INTERNAL_W / 2, INTERNAL_H / 2 + 30);
                    if (this.score >= this.highScore && this.score > 0) {
                        ctx.fillStyle = '#ffff00';
                        ctx.fillText('★ NEW HIGH SCORE! ★', INTERNAL_W / 2, INTERNAL_H / 2 + 55);
                    }
                    if (Math.floor(this.menuBlink * 3) % 2 === 0) {
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 22px "Courier New", monospace';
                        ctx.fillText('PRESS SPACE TO RETRY', INTERNAL_W / 2, INTERNAL_H / 2 + 90);
                    }
                }

                _drawVictory(ctx) {
                    this.particles.draw(ctx);
                    ctx.fillStyle = 'rgba(0,0,0,0.55)';
                    ctx.fillRect(0, 0, INTERNAL_W, INTERNAL_H);
                    ctx.fillStyle = '#ffdd00';
                    ctx.font = 'bold 48px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.shadowColor = '#ffaa00';
                    ctx.shadowBlur = 35;
                    ctx.fillText('VICTORY!', INTERNAL_W / 2, INTERNAL_H / 2 - 50);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#44ff44';
                    ctx.font = 'bold 22px "Courier New", monospace';
                    ctx.fillText('You defeated John Cena!', INTERNAL_W / 2, INTERNAL_H / 2);
                    ctx.fillText('The world is saved!', INTERNAL_W / 2, INTERNAL_H / 2 + 28);
                    ctx.fillStyle = '#ff44ff';
                    ctx.font = 'italic 18px "Courier New", monospace';
                    ctx.fillText('grergtaawegaega COMPLETE!', INTERNAL_W / 2, INTERNAL_H / 2 + 58);
                    ctx.fillStyle = '#ffaa00';
                    ctx.font = 'bold 18px "Courier New", monospace';
                    ctx.fillText('Final Score: ' + this.score + ' | Kills: ' + this.totalKills, INTERNAL_W / 2, INTERNAL_H /
                        2 + 85);
                    if (this.score >= this.highScore) {
                        ctx.fillStyle = '#ffff00';
                        ctx.fillText('★ NEW HIGH SCORE! ★', INTERNAL_W / 2, INTERNAL_H / 2 + 110);
                    }
                    if (this.victoryTimer > 3 && Math.floor(this.menuBlink * 3) % 2 === 0) {
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 20px "Courier New", monospace';
                        ctx.fillText('PRESS SPACE TO CONTINUE', INTERNAL_W / 2, INTERNAL_H / 2 + 145);
                    }
                }
            }

            // ─────────────────────────────────────
            // MAIN GAME LOOP
            // ─────────────────────────────────────
            const game = new Game();
            let lastTime = performance.now();
            let accumulator = 0;
            const fixedDt = 1 / 60;

            function gameLoop(timestamp) {
                let rawDt = (timestamp - lastTime) / 1000;
                lastTime = timestamp;

                if (rawDt > 0.2) rawDt = 0.2;
                if (rawDt <= 0) rawDt = fixedDt;

                accumulator += rawDt;
                let updates = 0;
                while (accumulator >= fixedDt && updates < 5) {
                    game.update(fixedDt);
                    accumulator -= fixedDt;
                    updates++;
                }
                if (updates === 0) {
                    game.update(rawDt);
                }

                game.draw(ctx);
                requestAnimationFrame(gameLoop);
            }

            // Initial draw
            game.draw(ctx);

            // Start loop on first interaction to comply with audio autoplay policies
            function startOnInteraction(e) {
                audio.init();
                audio.ensureContext();
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
                window.removeEventListener('pointerdown', startOnInteraction);
                window.removeEventListener('keydown', startOnInteraction);
            }
            window.addEventListener('pointerdown', startOnInteraction);
            window.addEventListener('keydown', startOnInteraction);

            // Also try to start immediately (some browsers allow it)
            setTimeout(() => {
                audio.init();
                audio.ensureContext();
                if (audio.initialized && audio.ctx && audio.ctx.state === 'running') {
                    lastTime = performance.now();
                    requestAnimationFrame(gameLoop);
                }
            }, 100);

            console.log('%c🥊 JOHN CENA: WORLD KIDNAPPER %c- grergtaawegaega Edition',
                'font-size:18px;color:#ffcc00;', 'font-size:14px;color:#ff44ff;');
            console.log('%cDefeat waves of enemies, build your special meter, and take down John Cena!',
                'color:#aaa;');
            console.log('%cControls: Arrows/WASD to move, J/Z Punch, K/X Kick, SPACE for GRERG! special',
                'color:#ccc;');
        })();
    </script>
</body>
